<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Admin</title><link rel="stylesheet" href="site.css"><script src="data.js"></script></head>
<body>
<div class="layout"><main class="main"><h1 id="h1"></h1><div class="goods" id="goods"></div><div class="loading" id="ld"></div></main></div>
<script>
const T=DEMO.T,F=DEMO.frame(2,T.scrollTitle);
document.body.insertAdjacentHTML('afterbegin',F.top);
const lay=document.querySelector('.layout');lay.insertAdjacentHTML('afterbegin',F.side);lay.insertAdjacentHTML('afterend',F.foot);
document.getElementById('h1').textContent=T.scrollTitle;
const slow=/slow/.test(location.search),all=DEMO.items,step=24;let n=0,busy=false;const box=document.getElementById('goods'),ld=document.getElementById('ld');
ld.textContent=T.more;
function more(){if(busy||n>=all.length)return;busy=true;if(!slow)ld.textContent=T.loading;setTimeout(()=>{box.insertAdjacentHTML('beforeend',all.slice(n,n+step).map(g=>`<div class="goods-item"><img src="${g.img}" alt=""><div class="g-body"><div class="g-title">${g.title}</div><div class="g-price">${DEMO.fill(T.price,{p:g.price})}</div><div class="g-meta"><span class="g-shop">${g.shop}</span><span class="g-sold">${DEMO.fill(T.sold,{n:g.sold})}</span></div><div class="g-meta"><span class="g-sku">${g.sku}</span><span class="g-rating">${DEMO.fill(T.rating,{r:g.rating})}</span></div></div></div>`).join(''));n+=step;busy=false;ld.textContent=n>=all.length?T.end:T.more;},slow?(n?1500:0):500);}
addEventListener('scroll',()=>{if(innerHeight+scrollY>document.documentElement.scrollHeight-300)more();});more();</script>
</body></html>
