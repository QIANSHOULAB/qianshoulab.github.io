<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Admin</title><link rel="stylesheet" href="site.css"><script src="data.js"></script></head>
<body>
<div class="layout"><main class="main"><h1 id="h1"></h1><div class="panel"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table><div class="pager" id="pager"></div></div></main></div>
<script>
const T=DEMO.T,F=DEMO.frame(0,T.tableTitle);
document.body.insertAdjacentHTML('afterbegin',F.top);
const lay=document.querySelector('.layout');lay.insertAdjacentHTML('afterbegin',F.side);lay.insertAdjacentHTML('afterend',F.foot);
document.getElementById('h1').textContent=T.tableTitle;
document.getElementById('hd').innerHTML=T.tableCols.map(c=>`<th>${c}</th>`).join('');
const per=20,all=DEMO.customers,pages=Math.ceil(all.length/per);
const p=Math.min(pages,Math.max(1,+new URLSearchParams(location.search).get('p')||1));
document.getElementById('tb').innerHTML=all.slice((p-1)*per,p*per).map(c=>`<tr><td>${c.id}</td><td><a href="#${c.id}">${c.company}</a></td><td>${c.contact}</td><td>${c.phone}</td><td>${c.email}</td><td>${c.city}</td><td>${c.stage}</td><td>${c.since}</td><td><a href="javascript:void 0">${T.edit}</a></td></tr>`).join('');
let h=p>1?`<a href="?p=${p-1}">${T.prev}</a>`:`<span class="disabled">${T.prev}</span>`;
for(let i=1;i<=pages;i++)h+=i===p?`<span class="cur">${i}</span>`:`<a href="?p=${i}">${i}</a>`;
h+=p<pages?`<a href="?p=${p+1}">${T.next}</a>`:`<span class="disabled">${T.next}</span>`;
document.getElementById('pager').innerHTML=h;</script>
</body></html>
