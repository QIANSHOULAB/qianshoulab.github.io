<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售线索 · 示例后台</title><link rel="stylesheet" href="site.css"></head>
<body>
<header class="topnav"><b>示例后台</b><a href="table.html">客户</a><a href="cards.html" class=on>线索</a><a href="scroll.html">商品</a><a href="index.html">报表</a><a href="index.html">设置</a></header>
<div class="layout"><aside class="side"><ul><li><a href="table.html">客户名单</a></li><li><a href="cards.html" class=on>销售线索</a></li><li><a href="scroll.html">商品列表</a></li><li><a href="index.html">合同</a></li><li><a href="index.html">回款</a></li><li><a href="index.html">工单</a></li><li><a href="index.html">团队</a></li></ul></aside>
<main class="main"><h1>销售线索</h1><div class="cards" id="cards"></div><div class="pager" style="justify-content:center;align-items:center;gap:12px"><button class="btnp" id="prev">‹ 上一页</button><span id="pg" style="border:0"></span><button class="btnp" id="next">下一页 ›</button></div></main></div>
<footer class="foot">示例后台 · 数据全是随机生成的假数据 · 给 <a href="../">化缘僧</a> 练手用</footer>
<script src="data.js"></script><script>
const per=12,all=DEMO.leads,pages=Math.ceil(all.length/per);let p=1;
const box=document.getElementById('cards');
function draw(){box.innerHTML=all.slice((p-1)*per,p*per).map(l=>`<div class="lead-card"><img src="${l.avatar}" alt=""><div class="lead-name">${l.name}</div><div class="lead-role">${l.role} · ${l.company}</div><div class="lead-info"><div class="lead-phone">电话：${l.phone}</div><div class="lead-email">邮箱：${l.email}</div><div class="lead-city">城市：${l.city}</div></div><div class="lead-foot"><span class="chip">${l.tag}</span><span class="lead-score">意向分 ${l.score}</span></div></div>`).join('');
document.getElementById('pg').textContent=p+' / '+pages;document.getElementById('prev').disabled=p===1;document.getElementById('next').disabled=p===pages;}
function go(d){box.style.opacity=.4;setTimeout(()=>{p+=d;draw();box.style.opacity=1;},450);}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);draw();</script>
</body></html>
