<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Admin</title><link rel="stylesheet" href="site.css"><script src="data.js"></script></head>
<body>
<div class="layout"><main class="main"><h1 id="h1"></h1><div class="cards" id="cards"></div><div class="pager" style="justify-content:center;align-items:center;gap:12px"><button class="btnp" id="prev"></button><span id="pg" style="border:0"></span><button class="btnp" id="next"></button></div></main></div>
<script>
const T=DEMO.T,F=DEMO.frame(1,T.cardsTitle);
document.body.insertAdjacentHTML('afterbegin',F.top);
const lay=document.querySelector('.layout');lay.insertAdjacentHTML('afterbegin',F.side);lay.insertAdjacentHTML('afterend',F.foot);
document.getElementById('h1').textContent=T.cardsTitle;
document.getElementById('prev').textContent=T.cardPrev;document.getElementById('next').textContent=T.cardNext;
const per=12,all=DEMO.leads,pages=Math.ceil(all.length/per);let p=1;
const box=document.getElementById('cards');
function draw(){box.innerHTML=all.slice((p-1)*per,p*per).map(l=>`<div class="lead-card"><img src="${l.avatar}" alt=""><div class="lead-name">${l.name}</div><div class="lead-role">${l.role} · ${l.company}</div><div class="lead-info"><div class="lead-phone">${T.phoneL}${l.phone}</div><div class="lead-email">${T.emailL}${l.email}</div><div class="lead-city">${T.cityL}${l.city}</div></div><div class="lead-foot"><span class="chip">${l.tag}</span><span class="lead-score">${DEMO.fill(T.score,{s:l.score})}</span></div></div>`).join('');
document.getElementById('pg').textContent=p+' / '+pages;document.getElementById('prev').disabled=p===1;document.getElementById('next').disabled=p===pages;}
function go(d){box.style.opacity=.4;setTimeout(()=>{p+=d;draw();box.style.opacity=1;},450);}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);draw();</script>
</body></html>
