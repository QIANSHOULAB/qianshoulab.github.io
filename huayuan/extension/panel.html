<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huayuan</title>
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="icons/48.png" alt="">
    <div class="ttl">
      <b data-t="hyName"></b>
      <span id="host"></span>
    </div>
    <div class="seg lang" id="lang" role="group" data-t-aria="langLabel">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="zh" lang="zh-CN">中文</button>
    </div>
    <div class="top-r">
      <button type="button" class="icon-btn" id="gear" data-t-aria="settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <div class="pop" id="pop" hidden>
        <label class="row"><span data-t="settingAuto"></span><span class="switch"><input type="checkbox" id="setAuto"><i></i></span></label>
        <label class="row"><span data-t="settingDelay"></span><input class="field num" type="number" id="setDelay" min="0" max="30" step="0.1" inputmode="decimal"></label>
        <label class="row"><span data-t="settingMax"></span><input class="field num" type="number" id="setMax" min="1" max="1000" step="1" inputmode="numeric"></label>
        <a class="row fb" id="fb" href="#" target="_blank" rel="noopener"><span data-t="fb"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></a>
        <div class="qs-foot pop-foot">
          <span data-t="hyFoot"></span>
          <span><span data-t="footMail"></span><span class="mail">oilsongchengmin@gmail.com</span></span>
          <a href="https://qianshoulab.github.io/" target="_blank" rel="noopener" data-t="footHome"></a>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading"><span class="spin"></span><span data-t="looking"></span></div>

    <section class="card ctl" id="ctl" hidden>
      <div class="bar" id="bar" hidden></div>
      <div class="blk">
        <span class="blk-n num" id="blkN"></span>
        <span class="blk-s" id="blkS"></span>
        <button type="button" class="btn text" id="swap" data-t="switchBlock"></button>
      </div>
      <div class="seg" id="seg" role="group">
        <button type="button" data-mode="next" data-t="modeNext"></button>
        <button type="button" data-mode="scroll" data-t="modeScroll"></button>
        <button type="button" data-mode="one" data-t="modeOne"></button>
      </div>
      <div class="mode">
        <span class="hint" id="hint"></span>
        <button type="button" class="btn text" id="pick"></button>
      </div>
      <div class="status num" id="status"></div>
      <button type="button" class="btn primary" id="go"></button>
    </section>

    <div class="alert" id="perm" hidden>
      <span data-t="needPerm"></span>
      <button type="button" class="btn primary" id="grant" data-t="grant"></button>
    </div>

    <section class="card empty" id="empty" hidden>
      <svg class="empty-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="17.5" cy="16.5" r="3"/><path d="M20 19l2 2"/></svg>
      <div class="empty-t" id="emptyT"></div>
      <p class="empty-s" id="emptyS"></p>
      <button type="button" class="btn primary" id="tryDemo" data-t="demoTry"></button>
      <a href="#" id="openDemo" data-t="demoOpen"></a>
    </section>

    <section class="card grid-wrap" id="gridWrap" hidden>
      <div class="grid-scroll" id="gridScroll"><table class="grid" id="grid"></table></div>
    </section>

    <div class="meta" id="meta"></div>
  </main>

  <footer class="bottom" id="bottom">
    <div class="exp" id="exp">
      <button type="button" class="btn plain" id="copy" data-t="copy"></button>
      <button type="button" class="btn plain" id="csv"></button>
      <button type="button" class="btn plain" id="xlsx"></button>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="lib/strings.js"></script>
<script src="lib/feedback.js"></script>
<script src="lib/settings.js"></script>
<script src="lib/sheet.js"></script>
<script src="lib/export.js"></script>
<script src="panel.js"></script>
</body>
</html>
