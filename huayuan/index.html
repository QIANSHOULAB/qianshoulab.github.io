<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huayuan · List Grabber — any web list, straight into Excel</title>
<meta name="description" content="A Chrome / Edge extension that turns any list or table on a web page into Excel or CSV. Pages through, scrolls to the end, names the columns. Data never leaves your browser.">
<script src="extension/lib/strings.js?v=0.4.0"></script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="extension/icons/128.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --doubt:rgba(255,204,0,.22);
  --accent:#9A6700; --on-accent:#ffffff; /* 化缘僧金 #D99A0B 加深到白字 4.9:1 */
  --r-card:18px; --r-btn:12px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shot:0 24px 64px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.72);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --shadow:none;
  --accent:#F5B931; --on-accent:#1d1d1f;
  --shot:0 0 0 .5px rgba(255,255,255,.14); --glass:rgba(22,22,23,.72);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;height:auto;display:block}
.w{max-width:980px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

.nav{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.nav .w{display:flex;align-items:center;gap:16px;height:52px}
.nav .home{color:var(--fg-2);font-size:13px}
.nav b{font-size:17px;font-weight:600;flex:1}
.nav .btn{height:32px;padding:0 16px;font-size:13px;border-radius:var(--r-btn)}

.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;min-width:44px;padding:0 24px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;transition:filter var(--t) var(--ease)}
.btn:hover{text-decoration:none;filter:brightness(1.08)}

.hero{text-align:center;padding:72px 16px 32px}
.hero .ico{width:96px;height:96px;margin:0 auto 24px}
.hero h1{margin:0;font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1.1;letter-spacing:-.01em}
.hero .tag{margin:12px 0 0;font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.2}
.hero .sub{margin:16px auto 0;max-width:560px;color:var(--fg-2);font-size:17px}
/* 中文只在标点、空格处换行，词不拆开 */
.hero h1,.hero .tag,.hero .sub{word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.cta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px 24px;margin-top:32px}
.cta .lnk{display:inline-flex;align-items:center;min-height:44px}
.ver{margin-top:12px;color:var(--fg-3);font-size:13px}

.stage{max-width:1120px;margin:48px auto 0;padding:0 16px}
.stage img,.shot img{border-radius:var(--r-card);box-shadow:var(--shot)}
.cap{text-align:center;color:var(--fg-2);font-size:13px;margin:16px 0 0}

section,section.w{margin-top:96px} /* .w 的 margin:0 auto 会盖掉 section 的上边距，所以写两遍 */
h2{margin:0;font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.15;text-align:center;letter-spacing:-.005em}
.lead{margin:12px auto 0;max-width:600px;text-align:center;color:var(--fg-2);font-size:17px}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 24px;margin:48px 0 0;padding:0;list-style:none}
.feats li{display:grid;grid-template-columns:28px 1fr;gap:4px 12px;align-items:start}
.feats svg{width:28px;height:28px;color:var(--accent);grid-row:span 2}
.feats b{font-size:17px;font-weight:600;line-height:1.3}
.feats span{color:var(--fg-2);font-size:15px}

.score{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.score div{background:var(--bg-group);border-radius:var(--r-card);padding:24px}
@media (prefers-color-scheme:dark){.score div,.steps{background:var(--card)}}
.score b{display:block;font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{display:block;margin-top:8px;color:var(--fg-2);font-size:15px}
.fine{margin:16px auto 0;text-align:center;color:var(--fg-3);font-size:13px}

.shot{margin:48px auto 0;max-width:1120px;padding:0 16px}

.steps{margin:48px auto 0;max-width:640px;padding:0;list-style:none;background:var(--bg-group);border-radius:var(--r-card);counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:12px 16px 12px 56px;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.steps li+li::before{content:"";position:absolute;left:56px;right:0;top:0;border-top:.5px solid var(--line)}
.steps li::after{content:counter(s);position:absolute;left:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.steps code{font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--fill);padding:4px 8px;border-radius:var(--r-chip);user-select:all;-webkit-user-select:all}
.steps small{display:block;color:var(--fg-2);font-size:13px;margin-top:2px}

.foot{margin-top:96px;border-top:.5px solid var(--line);padding:24px 0 48px;color:var(--fg-2);font-size:12px}
.foot .w{display:flex;flex-wrap:wrap;gap:8px 16px}
.mail{color:var(--fg);user-select:text;-webkit-user-select:text}

@media (max-width:760px){
  .hero{padding-top:48px}
  .feats{grid-template-columns:1fr;gap:24px}
  .score{grid-template-columns:1fr}
  section,section.w{margin-top:72px}
  .stage img,.shot img{border-radius:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nav .lang{flex:none}
/* 语言：右上角 EN / 中文，选过就记住（localStorage 的 huayuan.lang，示例页也认这个） */
.lang{display:flex;background:var(--fill);border-radius:var(--r-field);padding:2px;gap:2px}
.lang button{position:relative;height:28px;padding:0 10px;border:0;border-radius:var(--r-chip);background:none;color:var(--fg);font:400 13px/1 var(--font);cursor:pointer;transition:background-color var(--t) var(--ease)}
.lang button::after{content:"";position:absolute;inset:-8px -1px}  /* 点得到的地方够 44 高 */
.lang button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.lang button[aria-pressed="true"]{background:#636366}}
[hidden]{display:none!important}
.hero h1 .nb{white-space:nowrap}
:lang(en) .hero h1,:lang(en) h2{letter-spacing:-.02em}
.steps small:empty{display:none}
@media (max-width:480px){
  .nav .btn{display:none}  /* 手机上下插件没用，大按钮在首屏 */
  .hero h1 .nb{display:block}
  .hero h1 .dot{display:none}
}
</style>
</head>
<body>
<nav class="nav"><div class="w">
  <a class="home" href="../" data-s="home"></a>
  <b data-s="navName"></b>
  <a class="btn" href="dist/huayuan-0.4.0.zip" download data-s="navDl"></a>
  <div class="lang" role="group"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button></div>
</div></nav>

<header class="hero">
  <img class="ico" src="img/icon.svg" alt="" width="96" height="96">
  <h1><span data-s="nameA"></span><span class="nb"><span class="dot"> · </span><span data-s="nameB"></span></span></h1>
  <p class="tag" data-s="tag"></p>
  <p class="sub" data-s="sub"></p>
  <div class="cta">
    <a class="btn" href="dist/huayuan-0.4.0.zip" download data-s="ctaDl"></a>
    <a class="lnk" href="#install" data-s="ctaHow"></a>
    <a class="lnk" href="demo/" data-s="ctaDemo"></a>
  </div>
  <div class="ver" data-s="ver"></div>
</header>

<div class="stage">
  <picture>
    <source data-img="side-table-dark" srcset="img/side-table-dark-en.jpg" media="(prefers-color-scheme: dark)">

<section class="w">
  <h2 data-s="h2a"></h2>
  <p class="lead" data-s="leadA"></p>
  <ul class="feats">
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><b data-s="f1t"></b><span data-s="f1s"></span></li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13M6 11l6 6 6-6M5 20h14"/></svg><b data-s="f2t"></b><span data-s="f2s"></span></li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg><b data-s="f3t"></b><span data-s="f3s"></span></li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><b data-s="f4t"></b><span data-s="f4s"></span></li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><b data-s="f5t"></b><span data-s="f5s"></span></li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><b data-s="f6t"></b><span data-s="f6s"></span></li>
  </ul>

<section class="w">
  <h2 data-s="h2b"></h2>

    <div><b class="num" data-s="s1b"></b><span data-s="s1s"></span></div>

<section>
  <div class="w"><h2 data-s="h2c"></h2>

  <div class="shot"><img data-img="side-scroll" data-alt="alt2" src="img/side-scroll-en.jpg" alt="" width="2562" height="1640" loading="lazy"></div>

<footer class="foot"><div class="w">
  <span data-s="footName"></span>
  <span><span data-s="footMail"></span><span class="mail">oilsongchengmin@gmail.com</span></span>
  <a href="https://qianshoulab.github.io/" data-s="footHome"></a>
</div></footer>
<script>
// 字全在 extension/lib/strings.js 的 site 里。默认英文；右上角 EN / 中文，选过就记住；网址带 ?lang=zh|en 先听网址
(() => {
  const SITE = QSStrings.site, LK = 'huayuan.lang';
  const save = (l) => { try { localStorage.setItem(LK, l); } catch (e) {} };
  let lang = null;
  try { lang = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (SITE[lang]) save(lang);
  else { try { lang = localStorage.getItem(LK); } catch (e) {} if (!SITE[lang]) lang = 'en'; }
  function apply() {
    const s = SITE[lang], suf = lang === 'en' ? '-en' : '';
    document.documentElement.lang = s.htmlLang;
    document.title = s.title;
    document.querySelector('meta[name=description]').content = s.desc;
    for (const el of document.querySelectorAll('[data-s]')) el.textContent = s[el.dataset.s];
    for (const el of document.querySelectorAll('[data-sh]')) el.innerHTML = s[el.dataset.sh];
    for (const el of document.querySelectorAll('[data-alt]')) el.alt = s[el.dataset.alt];
    for (const el of document.querySelectorAll('[data-img]')) el[el.tagName === 'IMG' ? 'src' : 'srcset'] = 'img/' + el.dataset.img + suf + '.jpg';
    document.querySelector('.hero .nb').hidden = !s.nameB;
    const g = document.querySelector('.lang');
    g.setAttribute('aria-label', s.langLabel);
    for (const b of g.children) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  document.querySelector('.lang').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; save(lang);
    if (location.search) history.replaceState(null, '', location.pathname + location.hash);
    apply();
  });
  apply();
})();
</script>
</body>
