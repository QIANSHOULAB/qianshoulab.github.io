<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rent Splitter</title>
<meta name="description" content="For landlords who rent out rooms: rent and the power bill, split per person and by the day, in one message for the whole house. Your books stay on your phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rent Splitter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.en.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 千手院设计规范 2026-11-03：系统字、一个主色（二房东算账粉，原包租僧那张卡的粉）、其余全灰；iOS 分组列表；跟随系统深浅色 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --doubt:rgba(255,204,0,.22);
  --accent:#cc2c7c; --accent-fill:#cc2c7c; --on-accent:#ffffff; --accent-tint:rgba(226,65,140,.12);
  --bad-ink:#d70015; --bad-tint:rgba(255,59,48,.1);
  --r-card:18px; --r-btn:12px; --r-btn-l:14px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  --glass:rgba(255,255,255,.98); --scrim:rgba(0,0,0,.32); --sheet:#f5f5f7; --sheet-card:#ffffff;
  --toast-bg:rgba(255,255,255,.98); --toast-fg:#1d1d1f; --knob:#ffffff; --bar:rgba(120,120,128,.28);
  color-scheme:light;
}
/* 英文界面西文字体在前（不然 Windows 上会拿雅黑的西文字形、连字符画成全角）；中文界面照规范不变 */
html[lang=en]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --shadow:none;
  --accent:#ff5ca8; --accent-fill:#d63384; --accent-tint:rgba(255,92,168,.16);
  --bad-ink:#ff6961; --bad-tint:rgba(255,69,58,.16);
  --glass:rgba(28,28,30,.98); --scrim:rgba(0,0,0,.56); --sheet:#1c1c1e; --sheet-card:#2c2c2e;
  --toast-bg:rgba(28,28,30,.98); --toast-fg:#f5f5f7; --bar:rgba(120,120,128,.44);
  color-scheme:dark;
}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg-group);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg-group)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
button,a{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit;text-decoration:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-field)}
.num,.row-v,.hero-n,.ro-v,.elec-field input{font-variant-numeric:tabular-nums}

/* 顶栏：毛玻璃 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));transition:background-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.nav.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.nav-in{display:contents}
.nav-l{justify-self:start;min-width:0}
.nav-r{justify-self:end;display:flex;align-items:center;gap:8px}
.lang-seg button{padding:0 8px}
.nav{column-gap:8px}
.nav-a,.seg button{white-space:nowrap}
.nav-t{font-weight:600;font-size:17px;opacity:0;transition:opacity var(--t) var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.nav.scrolled .nav-t{opacity:1}
.nav-back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:17px;height:44px;margin-left:-4px;padding-right:8px}
.nav-back svg{width:12px;height:20px}
.nav-a{display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:15px;font-weight:600;height:36px;min-width:44px;padding:0 12px;border-radius:var(--r-btn);background:var(--fill)}
.nav-a svg{width:20px;height:20px}
.nav-a.round{padding:0;width:44px;height:44px;background:none}
.nav{padding-left:max(16px,env(safe-area-inset-left,0px),calc(50% - 284px));padding-right:max(16px,env(safe-area-inset-right,0px),calc(50% - 284px))}
@media (min-width:960px){.nav.wide{padding-left:max(16px,calc(50% - 504px));padding-right:max(16px,calc(50% - 504px))}}
#elecOut.stale{display:none}
.stale-all #hHero,.stale-all #hTen{opacity:.35;transition:opacity 200ms var(--ease)}

/* 页面 */
.wrap{max-width:600px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#view{overflow-x:clip}
.enter{animation:push var(--t) var(--ease)}
@keyframes push{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
.lt{padding:4px 4px 24px}
.lt h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lt h1.big{font-size:clamp(40px,6vw,64px);line-height:1.1;letter-spacing:-.02em}
.tag{margin:8px 0 0;color:var(--fg-2);font-size:17px;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.lt h1 .h1-2{color:var(--fg-2)}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:15px;font-weight:600;margin-bottom:4px}

/* 月份 / 年份切换：分段式 */
.mswitch{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:44px;background:var(--fill);border-radius:var(--r-btn);margin:0 0 24px;padding:0 4px}
.ms-b{height:36px;border-radius:var(--r-chip);display:grid;place-items:center;color:var(--accent)}
.ms-b svg{width:10px;height:16px}
.ms-b:disabled{color:var(--fg-3);opacity:.5;cursor:default}
.ms-t{justify-self:center;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;height:36px;padding:0 12px;border-radius:var(--r-chip)}
.ms-t:disabled{cursor:default;color:var(--fg)}
.ms-now{font-size:13px;font-weight:400;color:var(--fg-2)}
.ms-back{font-size:13px;font-weight:600;color:var(--accent)}

/* 大数 */
.hero{display:block;background:var(--card);border-radius:var(--r-card);padding:24px;box-shadow:var(--shadow)}
.hhero{padding:0 4px;margin:0 0 24px}
.hero-l{display:block;font-size:15px;font-weight:600;color:var(--fg-2)}
.hero-n{display:block;font-size:clamp(40px,6vw,56px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:4px 0;white-space:nowrap}
.hero-n .cur{font-size:.6em;font-weight:600;margin-right:2px}
.hero-n .dec{font-size:.5em;font-weight:600;color:var(--fg-2)}
.hero-s{display:block;color:var(--fg-2);font-size:15px;font-variant-numeric:tabular-nums}
.meter{display:block;height:4px;border-radius:2px;background:var(--fill);margin:16px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width var(--t) var(--ease)}
.hero-f{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.hero-f .go{color:var(--accent);font-weight:600;white-space:nowrap}
.hero-note{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--fg-2)}
.hero-note::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.hero-note.bad{color:var(--bad-ink)}
.hero-note.bad::before{background:var(--bad)}
.hero-note.done{color:var(--fg-2)}
.hero-note.done::before{background:var(--ok)}

/* 示例横条 */
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;background:var(--card);border-radius:var(--r-card);margin-bottom:24px;box-shadow:var(--shadow)}
.demo-bar b{display:block;font-size:15px;font-weight:600}
.demo-bar span{font-size:13px;color:var(--fg-2)}

/* 分组列表 */
.grp{margin-top:32px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 8px;min-height:44px}
.grp-h h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;display:flex;align-items:baseline;gap:8px;min-width:0}
.grp-sub,.grp-meta{font-size:15px;font-weight:400;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.grp-foot{margin:8px 0 0;padding:0 16px;font-size:13px;color:var(--fg-2)}
.sub-h{display:flex;justify-content:space-between;gap:12px;padding:16px 16px 8px;font-size:13px;font-weight:600;color:var(--fg-2)}
.sub-h:first-child{padding-top:0}
.sub-h span:last-child{font-weight:400;font-variant-numeric:tabular-nums}
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.list+.list{margin-top:12px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;transition:background-color 200ms var(--ease)}
.list>.row+.row::before,.list>.row+.ten::before,.list>.ten+.row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--line)}
.list.lead>.row+.row::before{left:60px}
.list.lead2>.row+.row::before{left:60px}
a.row:active,button.row:active,.row-btn:active{background:var(--fill)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px}
.tag2{color:var(--fg-2);font-size:15px}
.row-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.row-v{font-weight:600;white-space:nowrap;font-size:17px}
.row-v.mute{color:var(--fg-3);font-weight:400}
.chev{width:8px;height:14px;color:var(--fg-3);flex:none}
.row.add{color:var(--accent);min-height:52px;gap:12px}
.plus{width:32px;height:32px;display:grid;place-items:center;flex:none}
.plus svg{width:20px;height:20px}
.emptyrow{color:var(--fg-2);font-size:15px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-chip);font-size:13px;font-weight:400;background:var(--fill);color:var(--fg-2);white-space:nowrap;line-height:1}
.chip.warn{background:var(--doubt);color:var(--fg)}
.chip.bad{background:var(--bad-tint);color:var(--bad-ink)}
.chip.ok{background:var(--fill);color:var(--fg-2)}
.chip.move{background:var(--fill);color:var(--fg)}

/* 房客行 */
.row.ten{padding:0 0 0 8px;gap:4px}
.paid{flex:none;width:44px;height:64px;display:grid;place-items:center}
.paid>span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--fill-2);color:var(--on-accent);font-size:12px;font-weight:700;transition:background-color 200ms var(--ease),box-shadow 200ms var(--ease),transform 200ms var(--ease)}
.paid svg{width:14px;height:14px;opacity:0;transition:opacity 200ms var(--ease)}
.paid.on>span{background:var(--accent-fill);box-shadow:none}
.paid.on svg{opacity:1}
.paid.owe>span{background:var(--bad);box-shadow:none}
.paid:active>span{transform:scale(.88)}
.paid.pop>span{animation:pop 240ms var(--ease)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.row-btn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px 8px 0;text-align:left}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:2px;border-radius:var(--r-field);background:var(--fill);flex:none}
.seg button{height:32px;padding:0 12px;border-radius:var(--r-chip);font-size:13px;font-weight:600;color:var(--fg-2);transition:background-color 200ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.txt-btn{color:var(--accent);font-size:15px;font-weight:600;min-height:44px;padding:0 4px}

/* 电费 */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.elec{padding:16px 16px 24px}
.elec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--fg-2)}
.elec-h svg{width:18px;height:18px;color:var(--fg-2)}
.elec-field{display:flex;align-items:baseline;gap:4px;margin:8px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);transition:border-color var(--t) var(--ease)}
.elec-field:focus-within{border-bottom-color:var(--accent)}
.elec-field.bad{border-bottom-color:var(--bad)}
.elec-cur{font-size:28px;font-weight:600;color:var(--fg-2)}
.elec-field input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:0;font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.elec-field input::placeholder{color:var(--fg-3);opacity:.6}
.elec-hint{margin:0;color:var(--fg-2);font-size:15px}
.elec-err{margin:0 0 8px;color:var(--bad-ink);font-size:15px}
.heads{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.heads i{width:12px;height:12px;border-radius:50%;background:var(--fg-2)}
.heads i.inc{background:transparent;box-shadow:inset 0 0 0 2px var(--fg-3)}
.heads i.me{background:var(--fill-2)}
.split-main{font-size:17px}
.split-main b{font-weight:700;font-variant-numeric:tabular-nums}
.split-sub,.split-days{margin-top:4px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.send{margin-top:16px}
.send-note{margin:8px 0 0;text-align:center;font-size:13px;color:var(--fg-2)}
.note-card{padding:24px;text-align:center}
.note-card p{margin:0 0 16px;color:var(--fg-2);font-size:15px}
.note-card .btn{margin:0 auto}

/* 按钮 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border-radius:var(--r-btn-l);font-size:17px;font-weight:600;transition:transform 200ms var(--ease),opacity 200ms var(--ease),background-color 200ms var(--ease)}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.plain{color:var(--accent)}
.btn.danger{color:var(--bad-ink)}
.btn.small{width:auto;min-height:44px;padding:0 16px;font-size:15px;border-radius:var(--r-btn)}
.newhouse{margin-top:24px}

/* 空状态 / 加载 / 页脚 */
.empty{padding:32px 24px 16px;text-align:center}
.empty-ico{display:block;width:96px;height:96px;margin:0 auto 24px;border-radius:22px;box-shadow:var(--shadow)}
.empty-s{margin:0 auto 32px;color:var(--fg-2);font-size:17px;max-width:24em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.empty-b{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:0 auto}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--fg-2);padding:48px 0;font-size:15px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--fill-2);border-top-color:var(--fg-2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:48px;padding:0 4px;font-size:12px;line-height:1.7;color:var(--fg-2);text-align:center}
/* 提意见：页脚一行里的链接，点的地方撑到 44 高，不把行撑高 */
.foot a.fb{display:inline-block;padding:12px 8px;margin:-12px -4px;color:var(--accent);font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.foot a.fb:hover{text-decoration:underline}}
.foot a.fb:focus-visible{outline:2px solid var(--accent);outline-offset:-8px;border-radius:var(--r-chip)}

/* 总账图 */
.chart{background:var(--card);border-radius:var(--r-card);padding:16px;margin-top:24px;box-shadow:var(--shadow)}
.ro{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 12px;min-height:68px}
.ro-m,.ro-v,.ro-s{grid-column:1}
.ro-m{font-size:13px;color:var(--fg-2);font-weight:600}
.ro-v{font-size:22px;font-weight:700}
.ro-s{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.ro-go{grid-column:2;grid-row:1/span 3;color:var(--accent);font-size:15px;font-weight:600;min-height:44px}
.plot{position:relative;height:152px;margin-top:12px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.gl.zero{background:var(--fill-2)}
.yl{position:absolute;right:0;transform:translateY(-50%);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;background:var(--card);padding-left:8px;line-height:1.2}
.cols{position:absolute;top:0;bottom:0;left:0;right:48px;display:grid;grid-template-columns:repeat(12,1fr)}
.col{position:relative;height:100%}
.col .b{position:absolute;left:50%;width:16px;margin-left:-8px;background:var(--bar);transition:background-color 200ms var(--ease)}
.col .b.up{border-radius:4px 4px 0 0}
.col .b.dn{border-radius:0 0 4px 4px}
.col.sel .b{background:var(--accent)}
.col .lbl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.col.sel .lbl{color:var(--fg);font-weight:700}
.col.none .lbl{color:var(--fg-3)}
.col:disabled{cursor:default}

/* 底部浮层（sheet） */
#sheets{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 280ms var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:calc(100% - 32px);overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:var(--r-card) var(--r-card) 0 0;transform:translateY(104%);transition:transform 300ms var(--ease);padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
#sheets.open .scrim{opacity:1}
#sheets.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--fill-2);margin:8px auto 0}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:0 16px}
.sh-x{justify-self:start;color:var(--accent);font-size:17px;min-height:44px}
.sh-ok{justify-self:end;color:var(--accent);font-size:17px;font-weight:600;min-height:44px}
.sh-ok:disabled{color:var(--fg-3);cursor:default}
.sh-t{font-size:17px;font-weight:600}
.sh-body{display:flex;flex-direction:column;gap:12px;padding:4px 16px 8px}
.form{background:var(--sheet-card);border-radius:var(--r-btn);overflow:hidden}
.f-row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.form>.f-row+.f-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.f-k{flex:none;display:flex;flex-direction:column;font-size:17px;line-height:1.3}
.f-k small{font-size:13px;color:var(--fg-2)}
.f-row input{flex:1;min-width:0;height:50px;border:0;background:transparent;outline:none;text-align:right;font-size:17px;color:var(--fg)}
.f-row input.left{text-align:left}
.f-row input::placeholder,.paste::placeholder{color:var(--fg-3)}
.f-label{font-size:13px;color:var(--fg-2);padding:4px 16px 0;margin-bottom:-4px}
.f-err{margin:0;padding:0 16px;color:var(--bad-ink);font-size:15px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:36px;padding:0 12px;border-radius:var(--r-chip);background:var(--sheet-card);font-size:15px;transition:background-color 200ms var(--ease)}
.pick button[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
.switch{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--fill-2);margin-left:auto;transition:background-color 200ms var(--ease)}
.switch i{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:var(--knob);box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.12);transition:transform 240ms var(--ease)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch.red[aria-checked="true"]{background:var(--bad)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.sh-acts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.sh-note{margin:0 0 8px;text-align:center;font-size:13px;color:var(--fg-2)}
.prev-owe{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r-btn);background:var(--sheet-card);font-size:15px}
.prev-owe b{color:var(--bad-ink);font-variant-numeric:tabular-nums}
.prev-owe .btn{background:var(--fill);color:var(--fg);flex:none}
.cf{padding:24px 24px 4px;text-align:center}
.cf-t{font-size:22px;font-weight:700}
.cf-m{color:var(--fg-2);margin:8px 0 24px;font-size:15px}
.cf-b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.copybox,.paste{width:100%;border:0;border-radius:var(--r-btn);background:var(--sheet-card);color:var(--fg);padding:12px 16px;font:17px/1.5 var(--font);resize:none;outline:none}
.paste:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.sh-tip{margin:0;padding:0 4px;font-size:13px;color:var(--fg-2)}
.bk-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:4px 4px 0;font-size:13px;color:var(--fg-2)}
.bk-h .bk-bad{color:var(--bad-ink)}
.bk{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--sheet-card);border-radius:var(--r-btn);padding:8px 8px 8px 16px}
.bk+.bk{margin-top:8px}
.bk input{border:0;background:transparent;outline:none;color:var(--fg);min-width:0}
.bk-name{font-size:17px;font-weight:600}
.bk-rent{display:flex;align-items:baseline;gap:4px;justify-self:end;border-radius:var(--r-field);background:var(--fill);padding:4px 12px}
.bk-rent span{color:var(--fg-2);font-size:15px}
.bk-rent input{width:88px;text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bk-rent.bad{background:var(--doubt)}
.bk-2{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.bk-room{flex:1;font-size:15px;color:var(--fg-2)}

.bk-sh.inc{color:var(--fg-2)}

.bk-del svg{width:10px;height:10px}
.bk.dup{opacity:.5}

/* 提示条：能撤销 */
/* 提示条：底部居中（整页内容区就是居中的），离底 24 + 安全区，毛玻璃；页面底部留了 96 不让它盖最后一行 */
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;min-height:44px;max-width:calc(100% - 32px);transform:translateY(16px);opacity:0;pointer-events:none;padding:8px 16px;border-radius:var(--r-btn);box-shadow:0 8px 24px rgba(0,0,0,.16),0 0 0 .5px var(--line);background:var(--toast-bg);color:var(--toast-fg);font-size:15px;font-weight:400;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
#toast.show{opacity:1;transform:none}
#toast.has-act{padding-right:8px}
#toast.show.has-act{pointer-events:auto}
#toast button{color:var(--accent);font-weight:600;min-height:36px;padding:0 8px;border-radius:var(--r-chip);white-space:nowrap}

/* 放到主屏幕 */
.a2hs{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-card);padding:12px 4px 12px 16px;margin-bottom:24px;box-shadow:var(--shadow)}
.a2hs .a2hs-ico{width:44px;height:44px;border-radius:10px;flex:none}
.a2hs>div{flex:1;min-width:0}
.a2hs b{display:block;font-size:15px;font-weight:600}
.a2hs p{margin:0;font-size:13px;color:var(--fg-2)}
.a2hs .share{display:inline-block;width:14px;height:16px;vertical-align:-2px;color:var(--accent)}
.a2hs .btn{margin-top:8px}
.a2hs-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg-3);flex:none}
.a2hs-x svg{width:12px;height:12px}

/* 日期、备份行 */
.f-row input[type=date]{-webkit-appearance:none;appearance:none;text-align:right;min-width:0;color:var(--fg)}
.f-row input[type=date]::-webkit-date-and-time-value{text-align:right}
.f-row input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
.ico{width:32px;height:32px;display:grid;place-items:center;flex:none;color:var(--accent)}
.ico svg{width:22px;height:22px}

/* 整页拖放 */
#drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--accent-tint);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease)}
#drop.on{opacity:1}
#drop div{padding:16px 24px;border-radius:var(--r-card);background:var(--card);font-size:17px;font-weight:600;box-shadow:var(--shadow)}

/* 电脑宽：单套房两栏 */
@media (min-width:960px){
  .wrap.wide{max-width:1040px}
  .two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start}
  .two>.left{position:sticky;top:76px}
  .two>.right>.grp:first-child{margin-top:0}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
(function () {
'use strict';
const VERSION = '0.4.2';

/* =====================================================================
   界面文字全在 strings.js（中文、英文各一套，键一一对应），这里只挑语言：

const STR = window.BZS_STR;
const LS = 'baozuseng.v1', LSU = 'baozuseng.ui';
let UI = {};
try { UI = JSON.parse(localStorage.getItem(LSU) || '{}') || {}; } catch (e) { UI = {}; }
function saveUI() { try { localStorage.setItem(LSU, JSON.stringify(UI)); } catch (e) {} }
let LANG = STR[UI.lang] ? UI.lang : 'en', T = STR[LANG];
// <html lang>、<title>、description、主屏名字、manifest 跟着语言换

applyLang();

/*MODEL-START*/
const pad = n => String(n).padStart(2, '0');
const ymAdd = (ym, k) => { let y = +ym.slice(0, 4), m = +ym.slice(5) + k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(m); };
const toC = x => Math.round((+x || 0) * 100);
const dim = ym => new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate();
// Days tenant x lives in month m. from/to are 'YYYY-MM-DD', both days count; empty = open-ended.
function span(x, m) {

  const lo = x.from && x.from > a ? x.from : a, hi = x.to && x.to < b ? x.to : b;
  return lo > hi ? 0 : +hi.slice(8) - +lo.slice(8) + 1;
}

function norm(h) {
  h.tenants = Array.isArray(h.tenants) ? h.tenants : [];
  h.fixed = Array.isArray(h.fixed) ? h.fixed : [];
  h.months = h.months && typeof h.months === 'object' ? h.months : {};
  for (const k of Object.keys(h.months)) {
    const r = h.months[k];
    r.rows = Array.isArray(r.rows) ? r.rows : [];
    r.exp = Array.isArray(r.exp) ? r.exp : [];
    if (r.elec === undefined) r.elec = null;
  }
  return h;
}
const person = t => { const o = { id: t.id, name: t.name, room: t.room || '', rent: t.rent, share: !!t.share }; if (t.from) o.from = t.from; if (t.to) o.to = t.to; return o; };

// A month nobody has touched yet is read off the house's roster (only people living there that month) and fixed costs.
function virt(h, m) {
  return {
    elec: null, self: !!h.self,
    rows: h.tenants.filter(t => !m || span(t, m) > 0).map(t => Object.assign(person(t), { paid: false })),

}
function rec(h, m) { return (h.months && h.months[m]) || virt(h, m); }

// Money in integer cents.
// Rent: full month, or round(rent × days lived ÷ days in month).
// Electricity: bill split by person-days over everyone living there (landlord counts a full month if he lives in).
//   Each sharer pays round(bill × his days ÷ all person-days). Heads of rent-includes-electricity tenants,

function calc(h, m) {
  const r = rec(h, m), D = dim(m);
  const has = r.elec != null;
  const ds = r.rows.map(x => span(x, m));
  const totD = ds.reduce((s, d) => s + d, 0) + (r.self ? D : 0);
  const heads = r.rows.length + (r.self ? 1 : 0);
  const elecC = has ? toC(r.elec) : 0;
  const perC = has && totD ? Math.round(elecC * D / totD) : 0;
  const prev = {};
  for (const k of Object.keys(h.months || {})) {
    if (k >= m || k < h.created) continue;
    for (const x of h.months[k].rows || []) if (x.owe > 0) {
      const p = prev[x.id] || (prev[x.id] = { c: 0, ms: [], name: x.name });
      p.c += toC(x.owe); p.ms.push(k); p.name = x.name;
    }
  }
  let rentC = 0, inC = 0, paidC = 0, unpaid = 0, sharers = 0, oweNowC = 0, elecInC = 0;
  const rows = r.rows.map((x, i) => {
    const d = ds[i], part = d < D, fullC = toC(x.rent);
    const rC = part ? Math.round(fullC * d / D) : fullC;
    const eC = x.share && has && totD ? Math.round(elecC * d / totD) : 0, due = rC + eC;
    const oC = !x.paid && x.owe > 0 ? toC(x.owe) : 0;
    const st = x.paid ? 'paid' : oC ? 'owe' : 'open';
    const got = st === 'paid' ? due : st === 'owe' ? Math.max(0, due - oC) : 0;
    if (x.share) { sharers++; elecInC += eC; }

    if (st === 'open') unpaid++;
    const p = prev[x.id];
    return Object.assign({}, x, { d, D, part, fullC, rC, eC, due, oC, st, got, prevC: p ? p.c : 0, prevMs: p ? p.ms.sort() : [] });
  });
  const here = new Set(r.rows.map(x => x.id));
  const gone = Object.keys(prev).filter(id => !here.has(id)).map(id => ({ id, name: prev[id].name, c: prev[id].c }));
  const prevAllC = Object.values(prev).reduce((s, p) => s + p.c, 0);
  const otherC = r.exp.reduce((s, e) => s + toC(e.amt), 0);

  return { r, rows, has, D, totD, heads, sharers, elecC, perC, rentC, elecInC, inC, otherC, outC, netC: inC - outC,
    paidC, unpaid, oweNowC, prevAllC, owedC: oweNowC + prevAllC, gone, eatC: elecC - elecInC };

const settled = c => c.has && c.rows.length > 0 && c.unpaid === 0 && c.oweNowC === 0;

// ---- roster text → tenants (runs on the phone, no API) ----
const ROOM_PATS = [
  /主人房\d{0,2}(?!\d)/, /主卧\d{0,2}(?!\d)/, /次卧\d{0,2}(?!\d)/, /普通房\d{0,2}(?!\d)/, /普通间\d{0,2}(?!\d)/,
  /小房间?\d{0,2}(?!\d)/, /大房间\d{0,2}(?!\d)/, /客厅/, /储物间/, /杂物间/, /工人房/, /女佣房/, /阁楼/,
  /房间\d{1,2}(?!\d)/, /房间[A-Za-z一二三四五六七八九十](?![A-Za-z])/, /房\d{1,2}(?!\d)/, /\d{1,2}号房/, /[一二三四五六七八九十]号房/, /\b[A-Za-z]房(?!东|租)/,
  /master\s*(?:bed)?room\s*\d{0,2}(?!\d)/i, /common\s*room\s*\d{0,2}(?!\d)/i, /small\s*room\s*\d{0,2}(?!\d)/i, /living\s*room/i, /store\s*room/i, /\bbed\s*room\s*\d{1,2}(?!\d)/i, /\broom\s*\d{1,2}(?!\d)/i

// English: "incl." / "power incl." / "all-in" = rent covers power; "not incl." / "excl." = splits it.
const EN_UTIL = '(?:\\s*(?:of\\s+)?(?:power|electricity|elec|utilities|utils|bills))?';
const SHARE_W = '(不包电|不含电|电费另算|电费另付|电费自理|分摊电费|分摊|平摊|摊电|另算|另付|分电|\\bAA\\b|\\bnot\\s+incl\\w*\\.?' + EN_UTIL + '|\\bexcl\\w*\\.?' + EN_UTIL + '|\\b(?:power|electricity|utilities|bills)\\s+(?:extra|separate|split)\\b)';
const INC_W = '(包水电|含水电|水电全包|水电包|电费全包|电费包了|包电费|含电费|包电|含电|\\b(?:power|electricity|elec|utilities|utils|bills)\\s*incl\\w*\\.?|incl\\w*\\.?' + EN_UTIL + '|\\ball[\\s-]in(?:clusive)?\\b)';
// English move dates: "from 11th", "moves in Nov 11", "until 20", "moving out 20th Nov". Day numbers only, with a word in front.
const EN_MON = 'jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec';
const EN_DAY = '(?:(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+(' + EN_MON + ')[a-z]*\\.?)?|(' + EN_MON + ')[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?)(?![\\d/])';
const EN_FROM = '\\b(?:from|moves?\\s+in|moving\\s+in|move-in|starts?|starting)\\s+(?:on\\s+)?(?:the\\s+)?' + EN_DAY;
const EN_TO = '\\b(?:until|till|til|moves?\\s+out|moving\\s+out|move-out|out|leaves?|leaving)\\s+(?:on\\s+)?(?:the\\s+)?' + EN_DAY;
const enMon = w => (w ? EN_MON.split('|').indexOf(w.slice(0, 3).toLowerCase()) + 1 : 0);
function findRoom(s) {
  let best = null;
  for (const re of ROOM_PATS) {
    const m = re.exec(s);
    if (m && (!best || m.index < best.index || (m.index === best.index && m[0].length > best.text.length))) best = { index: m.index, text: m[0] };
  }
  return best;
}
function rentNums(s) {
  const out = [], re = /(?:S\$|RM|HK\$|\$|¥|￥)?\s*(\d{1,3}(?:,\d{3})+|\d+)(\.\d{1,2})?/g;
  let m;
  while ((m = re.exec(s))) {
    const val = parseFloat((m[1] + (m[2] || '')).replace(/,/g, ''));
    const before = s.slice(Math.max(0, m.index - 10), m.index);
    const after = s.slice(m.index + m[0].length, m.index + m[0].length + 2);
    const perMonth = /^\s*\/\s*(?:月|mo|mth)/i.test(s.slice(m.index + m[0].length, m.index + m[0].length + 6)); // "900/月"、"$1,200/month" 是月租，不是日期
    if (/(押金|按金|deposit|bond|电费|水费|网费)\s*[:：]?\s*$/i.test(before)) continue;
    if (/#\s*$/.test(before) || (!perMonth && /^\s*(年|月|号|日|楼|层|栋|座|-|\/)/.test(after)) || /\/\s*$/.test(before)) continue;
    if (val < 50 || val >= 100000) continue;
    out.push({ val: Math.round(val * 100) / 100, index: m.index, len: m[0].length, pref: perMonth || /(房租|月租|租金|租|rent)\s*[:：]?\s*$/i.test(before) });

// "15号入住" / "11月15日搬进" / "住到20号" / "20号搬走" → dates inside month m (or the month named).
function findDates(s, m) {
  const out = {};
  const D = '(?:(\\d{1,2})\\s*月\\s*)?(\\d{1,2})\\s*[日号]';
  const mk = (mo, d) => { const ym = mo ? m.slice(0, 5) + pad(+mo) : m; const dd = Math.min(+d, dim(ym)); return +d >= 1 && (!mo || (+mo >= 1 && +mo <= 12)) ? ym + '-' + pad(dd) : null; };

  if (!out.to && (x = new RegExp(EN_TO, 'i').exec(s))) out.to = mk(enMon(x[2] || x[3]) || null, x[1] || x[4]);

}
function parseOne(seg, inheritRoom, m) {
  let s = ' ' + seg + ' ';
  const dates = m ? findDates(s, m) : {};
  let share = true;
  if (new RegExp(SHARE_W, 'i').test(s)) s = s.replace(new RegExp(SHARE_W, 'gi'), ' ');
  else if (new RegExp(INC_W, 'i').test(s)) { share = false; s = s.replace(new RegExp(INC_W, 'gi'), ' '); }
  let room = '';
  const rm = findRoom(s);
  if (rm) { room = rm.text.replace(/\s+/g, ' ').trim(); s = s.slice(0, rm.index) + ' ' + s.slice(rm.index + rm.text.length); }
  s = s.replace(/(?:\d{1,2}\s*月\s*)?\d{1,2}\s*[日号]\s*(?:起)?(?:入住|搬入|搬进|起租|进来|起|搬走|搬出|退租|退房|走)?|(?:住到|租到|到)\s*(?:\d{1,2}\s*月\s*)?\d{1,2}\s*[日号]/g, ' ');
  s = s.replace(new RegExp(EN_FROM, 'gi'), ' ').replace(new RegExp(EN_TO, 'gi'), ' ');

  // app 名沿用 'baozuseng'（0.4.2 改名二房东算账也不换）：旧备份（包租僧备份-*.json、baozu-backup-*.json）和新备份互相认，导回只看文件内容，不看文件名
  return { app: 'baozuseng', v: 2, ver: VERSION, at: new Date().toISOString(), order: hs.map(h => h.id), houses };
}
function saveBackup() {
  const body = backupBody();
  if (!body.order.length) { toast(T.bkNothing); return; }
  const name = T.bkFile(TODAY), text = JSON.stringify(body, null, 1);
  const done = () => { UI.lastBk = TODAY; saveUI(); toast(T.bkSaved); if (S.route === '') render(); };
  const download = () => {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); done();
  };
  try {
    if ((IOS || ANDROID) && typeof File === 'function' && navigator.canShare) {
      const f = new File([text], name, { type: 'application/json' });
      if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).then(done, e => { if (!e || e.name !== 'AbortError') download(); }); return; }
    }
  } catch (e) {}
  download();
}
function pickBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json'; inp.style.display = 'none';
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) f.text().then(loadBackup, () => toast(T.bkBad)); };
  document.body.appendChild(inp); inp.click();
}
function loadBackup(text) {
  let j = null;
  try { j = JSON.parse(text); } catch (e) {}
  if (!j || j.app !== 'baozuseng' || !j.houses || typeof j.houses !== 'object' || !Object.keys(j.houses).length) { toast(T.bkBad); return; }
  const had = realHouses().length > 0, before = snap();
  S.houses = {}; for (const [id, h] of Object.entries(j.houses)) { if (h && typeof h === 'object') S.houses[id] = norm(Object.assign(h, { id })); }
  S.order = Array.isArray(j.order) ? j.order.filter(id => S.houses[id]) : Object.keys(S.houses);
  S.month = CUR; save(); go('');
  const n = Object.keys(S.houses).length;
  if (had) undoable(T.bkSwapped(n), before); else toast(T.bkDone(n));
}
// Once per month: when every house's month is fully collected, offer a backup.
function maybeSettled(m) {
  if (UI.asked === m) return;
  const hs = realHouses().filter(h => h.created <= m);
  if (!hs.length) return;
  const cs = hs.map(h => calc(h, m));
  if (!cs.some(c => c.rows.length) || !cs.every(c => !c.rows.length || settled(c))) return;
  UI.asked = m; saveUI();
  setTimeout(() => openSheet(`<div class="cf"><div class="cf-t">${esc(T.settledT(mLabel(m)))}</div><p class="cf-m">${esc(T.settledM)}</p><div class="cf-b"><button type="button" class="btn gray" data-act="close">${T.later}</button><button type="button" class="btn primary" id="cfOk">${T.saveBk}</button></div></div>`,
    sh => { $('#cfOk', sh).onclick = () => { closeSheet(); saveBackup(); }; }), 500);
}

// 全屋一条：抬头、电费怎么分、每人一行（应交 = 房租 + 电费 + 之前欠）。
function billsAll(h, c, m) {
  const lines = [T.billsHead(mLabel(m), h.estate, h.unit), c.has ? (c.sharers ? T.billsElec(money(c.elecC), c.heads, c.r.self, money(c.perC), c.rows.some(x => x.part && x.share)) : '') : T.billsElecTbd];
  for (const x of c.rows) {
    let p = (x.part ? T.bpDays(x.d) + T.c : '') + T.bpRent(money(x.rC));
    p += !x.share ? T.c + T.bpInc : c.has ? ' + ' + T.bpElec(money(x.eC)) : T.c + T.bpTbd;
    if (x.prevC) p += ' + ' + T.bpPrev(money(x.prevC));
    if (x.st === 'paid') p += T.c + T.bpPaid;
    lines.push(T.billsLine(x.name, money(x.due + x.prevC), p));
  }
  return lines.filter(Boolean).join('\n');
}
function tenantBill(c, x, m) {
  const M = mLabel(m), days = x.part ? T.billDays(x.d, money(x.fullC)) : '';
  let s, total = x.due;
  if (!x.share) s = T.billInc(x.name, M, money(x.rC), days);
  else if (!c.has) s = T.billTbd(x.name, M, money(x.rC), days);
  else s = T.billBoth(x.name, M, money(x.rC), money(x.eC), days);
  if (x.prevC) { total += x.prevC; s += T.billPrev(money(x.prevC), money(total)); }
  else s += x.share && c.has ? T.billTotal(money(total)) : T.end;
  return s;
}

  for (const x of c.rows) { const k = x.room || ''; let g = groups.find(y => y.k === k); if (!g) groups.push(g = { k, xs: [] }); g.xs.push(x); }
  groups.sort((a, b) => (a.k === '') - (b.k === ''));
  return (all ? `<div class="list lead" style="margin-bottom:16px">${all}</div>` : '') + groups.map(g => `<div class="sub-h"><span>${esc(g.k || T.noRoom)}</span><span>${T.roomSum(g.xs.length, money(g.xs.reduce((s, x) => s + x.due, 0)))}</span></div><div class="list lead">${g.xs.map(x => tenantRow(h, c, x, m, true)).join('')}</div>`).join('') + `<div class="list lead">${gone}${adds}</div>`;
}
function expRows(c) {
  let out = `<div class="row"><span class="row-main"><span class="row-t">${T.elecBill}</span><span class="row-s">${T.elecBillS}</span></span><span class="row-v${c.has ? '' : ' mute'}">${c.has ? money(c.elecC) : T.notFilled}</span></div>`;
  if (!c.r.exp.length) out += `<div class="row emptyrow">${T.noExp}</div>`;
  for (const e of c.r.exp) out += `<button type="button" class="row" data-act="exp" data-id="${esc(e.id)}"><span class="row-main"><span class="row-t">${esc(e.name)}<span class="chip">${e.fixed ? T.monthly : T.onlyThis}</span></span></span><span class="row-v">${money(toC(e.amt))}</span>${ICON.chevR}</button>`;
  return out + addRow('add-exp', T.addExp);
}

/* ---------- ledger ---------- */
function niceUp(c) { if (c <= 0) return 0; const d = c / 100, p = Math.pow(10, Math.floor(Math.log10(d))), f = d / p; return Math.round((f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p * 100); }
const axisMoney = c => (c < 0 ? '−$' : '$') + Math.round(Math.abs(c) / 100).toLocaleString('en-US');
function renderLedger() {
  const hs = housesInOrder();
  setNav({ back: T.houses, title: T.ledger });
  if (!hs.length) { view(`<div class="wrap"><div class="lt"><h1>${T.ledger}</h1></div><div class="card note-card"><p>${T.noHouseYet}</p><a class="btn gray small" href="#">${T.goBuild}</a></div></div>`); return; }
  const minY = yNum(firstMonth(hs)), maxY = yNum(CUR);
  S.year = Math.min(maxY, Math.max(minY, S.year));
  const Y = S.year, per = [];
  for (let i = 1; i <= 12; i++) {
    const m = Y + '-' + pad(i), on = hs.filter(h => h.created <= m);
    if (m > CUR || !on.length) { per.push(null); continue; }
    const cs = on.map(h => calc(h, m)), inC = sum(cs, 'inC'), outC = sum(cs, 'outC');
    per.push({ m, inC, outC, netC: inC - outC, miss: cs.filter(c => !c.has).length });
  }
  const data = per.filter(Boolean), yIn = sum(data, 'inC'), yOut = sum(data, 'outC'), yNet = yIn - yOut;
  const owedNow = hs.reduce((s, h) => s + (h.created <= CUR ? calc(h, CUR).owedC : 0), 0);
  if (!(S.sel && data.some(p => p.m === S.sel))) S.sel = data.some(p => p.m === S.month) ? S.month : (data.length ? data[data.length - 1].m : null);
  let html = `<div class="wrap"><div class="lt"><h1>${T.ledger}</h1></div>`;
  html += `<div class="mswitch" role="group" aria-label="${T.pickYear}"><button type="button" class="ms-b" data-act="y-prev" aria-label="${T.prevYear}"${Y <= minY ? ' disabled' : ''}>${ICON.chevL}</button><span class="ms-t">${T.fm.y(Y)}</span><button type="button" class="ms-b" data-act="y-next" aria-label="${T.nextYear}"${Y >= maxY ? ' disabled' : ''}>${ICON.chevRb}</button></div>`;
  html += `<div class="hero"><span class="hero-l">${T.yearNet(Y, yNet)}</span><span class="hero-n">${big(yNet)}</span><span class="hero-s">${T.inOut(money(yIn), money(yOut))}</span>${owedNow && Y === maxY ? `<span class="hero-note bad">${T.owedAll(money(owedNow))}</span>` : ''}</div>`;
  html += `<section class="chart" aria-label="${T.chartAria(Y)}"><div class="ro">${readout(per, S.sel)}</div>${plot(per, S.sel, Y)}</section>`;
  const byH = hs.map(h => {
    const ms = []; for (let i = 1; i <= 12; i++) { const m = Y + '-' + pad(i); if (m >= h.created && m <= CUR) ms.push(m); }
    if (!ms.length) return null;
    const cs = ms.map(m => calc(h, m));
    return { h, n: ms.length, netC: sum(cs, 'inC') - sum(cs, 'outC') };
  }).filter(Boolean);
  if (byH.length) html += `<section class="grp"><div class="grp-h"><h2>${T.perHouse}</h2></div><div class="list">${byH.map(x => `<a class="row" href="#${esc(x.h.id)}"><span class="row-main"><span class="row-t">${esc(x.h.unit)}${x.h.demo ? `<span class="chip demo">${T.chipDemo}</span>` : ''}</span><span class="row-s">${esc(x.h.estate)} · ${T.nMonths(x.n)}</span></span><span class="row-v">${money(x.netC)}</span>${ICON.chevR}</a>`).join('')}</div></section>`;
  if (data.length) html += `<section class="grp"><div class="grp-h"><h2>${T.perMonth}</h2></div><div class="list">${data.slice().reverse().map(p => `<button type="button" class="row" data-act="open-month" data-m="${p.m}"><span class="row-main"><span class="row-t">${mLabel(p.m)}${p.miss ? `<span class="chip warn">${T.chipNoElec}</span>` : ''}</span><span class="row-s">${T.inOut(money(p.inC), money(p.outC))}</span></span><span class="row-v">${money(p.netC)}</span>${ICON.chevR}</button>`).join('')}</div></section>`;
  else html += `<div class="card note-card" style="margin-top:16px"><p>${T.noYear}</p></div>`;
  view(html + footer() + '</div>');
}
function readout(per, sel) {
  const p = per.find(x => x && x.m === sel);
  if (!p) return `<div class="ro-m">${T.noYear}</div>`;
  return `<div class="ro-m">${mLong(p.m)}</div><div class="ro-v">${T.net(p.netC)} ${money(Math.abs(p.netC))}</div><div class="ro-s">${T.inOut(money(p.inC), money(p.outC))}</div><button type="button" class="ro-go" data-act="open-month" data-m="${p.m}">${T.gotoMonth}</button>`;
}
function plot(per, sel, Y) {
  const vals = per.map(p => (p ? p.netC : 0));
  const top = niceUp(Math.max(0, ...vals)), bot = niceUp(Math.max(0, ...vals.map(v => -v)));
  const span2 = top + bot || 1, H = 128, zy = Math.round(top / span2 * H);
  let g = '';
  if (top) g += `<div class="gl" style="top:0"></div><div class="yl" style="top:0">${axisMoney(top)}</div>`;
  g += `<div class="gl zero" style="top:${zy}px"></div><div class="yl" style="top:${zy}px">$0</div>`;
  if (bot) g += `<div class="gl" style="top:${H}px"></div><div class="yl" style="top:${H}px">${axisMoney(-bot)}</div>`;
  const cols = per.map((p, i) => {
    if (!p) return `<button type="button" class="col none" disabled aria-label="${T.noBook(mLabel(Y + '-' + pad(i + 1)))}"><span class="lbl">${T.fm.col(i + 1)}</span></button>`;
    const hgt = Math.max(2, Math.round(Math.abs(p.netC) / span2 * H)), y = p.netC >= 0 ? zy - hgt : zy;
    return `<button type="button" class="col${p.m === sel ? ' sel' : ''}" data-act="pick" data-m="${p.m}" aria-pressed="${p.m === sel}" aria-label="${T.monthNet(mLabel(p.m), p.netC)} ${money(Math.abs(p.netC))}"><span class="b ${p.netC < 0 ? 'dn' : 'up'}" style="top:${y}px;height:${hgt}px"></span><span class="lbl">${T.fm.col(i + 1)}</span></button>`;
  }).join('');
  return `<div class="plot">${g}<div class="cols">${cols}</div></div>`;
}

/* ---------- sheets ---------- */
let sheetTok = 0, sheetFrom = null;
function openSheet(inner, mount) {
  const root = $('#sheets');
  sheetTok++;
  sheetFrom = document.activeElement;
  root.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
  root.hidden = false;
  void root.offsetHeight;
  root.classList.add('open');
  fitSheet();
  if (mount) mount($('.sheet', root));
}
function closeSheet() {
  const root = $('#sheets'), tok = ++sheetTok;
  root.classList.remove('open');
  setTimeout(() => { if (tok === sheetTok) { root.hidden = true; root.innerHTML = ''; } }, 330);
  if (sheetFrom && document.contains(sheetFrom)) try { sheetFrom.focus({ preventScroll: true }); } catch (e) {}
}
function fitSheet() {
  const sh = $('#sheets .sheet'), vv = window.visualViewport;
  if (!sh || !vv) return;
  sh.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px';
  sh.style.maxHeight = Math.max(240, vv.height - 24) + 'px';
}
const head3 = (title, ok, okId, dis) => `<div class="sh-head"><button type="button" class="sh-x" data-act="close">${T.cancel}</button><div class="sh-t">${title}</div><button type="button" class="sh-ok" id="${okId}"${dis ? ' disabled' : ''}>${ok}</button></div>`;
function failer(p) { return (msg, el) => { p.textContent = msg; p.hidden = false; if (el) el.focus(); return null; }; }
function switcher(btn, hint, on, texts, onChange) {
  let v = on;
  btn.onclick = () => { v = !v; btn.setAttribute('aria-checked', String(v)); if (hint) hint.textContent = v ? texts[0] : texts[1]; if (onChange) onChange(v); };
  return () => v;
}
function enterNext(sh, ids, done) {
  ids.forEach((id, i) => { const el = $('#' + id, sh); if (el) el.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault(); const nx = ids[i + 1] && $('#' + ids[i + 1], sh); if (nx) nx.focus(); else done(); }); });
}

function tenantSheet(h, m, tid) {
  const cur = m === CUR, r = rec(h, m), mWord = cur ? T.thisM : mLabel(m);

  }

    <div class="form">
      <label class="f-row"><span class="f-k">${T.fName}</span><input id="tName" autocomplete="off" maxlength="24" enterkeyhint="next" placeholder="${T.fNamePh}" value="${esc(t ? t.name : '')}"></label>

    <div class="form"><label class="f-row"><input id="tRoom" class="left" autocomplete="off" maxlength="16" enterkeyhint="done" placeholder="${T.fRoomPh}" value="${esc(t ? t.room : '')}"></label></div>

      <label class="f-row"><span class="f-k">${T.fFrom}<small>${T.fFromS}</small></span><input id="tFrom" type="date" value="${t && t.from ? t.from : ''}"${t ? '' : ` min="${lo}" max="${hi}"`}></label>
      <label class="f-row"><span class="f-k">${T.fTo}<small>${T.fToS}</small></span><input id="tTo" type="date" value="${t && t.to ? t.to : ''}"${t ? '' : ` min="${lo}"`}></label>
    </div>
    ${t ? `<div class="form"><div class="f-row"><span class="f-k">${T.fOwe(mWord)}<small id="tOweHint">${owing ? T.oweOn : T.oweOff}</small></span><button type="button" class="switch red" role="switch" id="tOwe" aria-checked="${owing}" aria-label="${T.stOwe}"><i></i></button></div><label class="f-row" id="tOweRow"${owing ? '' : ' hidden'}><span class="f-k">${T.fOweAmt}</span><input id="tOweAmt" inputmode="decimal" autocomplete="off" placeholder="$ 0.00" value="${owing ? num(toC(t.owe)) : ''}"></label></div>` : ''}

  </div>`, sh => {

    const getShare = switcher($('#tShare', sh), $('#tHint', sh), !t || !!t.share, [T.shareOn, T.shareOff]);

      else { const taken = rec(h, m).rows.filter(x => x.id !== tid && (x.room || '').startsWith(v)).length; roomI.value = taken ? T.roomN(v, taken + 1) : v; }

      renderHouse(h, true);

    };
    $('#tOk', sh).onclick = () => { if (commit()) closeSheet(); };
    enterNext(sh, ['tName', 'tRent', 'tRoom'], () => $('#tOk', sh).click());
    const more = $('#tMore', sh);
    if (more) more.onclick = () => {
      if (!commit()) return;

      $('#tDel', sh).onclick = () => { const before = snap(); Ops.delTenant(h, m, tid); closeSheet(); renderHouse(h, true); undoable(T.deletedN(t.name), before); };
    } else nameI.focus();
  });
}

// 贴名单 → 认出来的人一张张列出来，认错的当场改（不对的标黄）。onChange(good, bad) 每次变动都回调。
function rosterEditor(ta, list, m, have, onChange) {
  let items = [];
  const valid = x => !x.dup && x.name && x.rent != null && !Number.isNaN(x.rent);
  const refresh = () => {
    const fresh = items.filter(x => !x.dup), good = fresh.filter(valid).length, bad = fresh.length - good, n = list.querySelector('.bk-bad');
    if (n) n.textContent = bad ? T.bulkBad(bad) : '';
    onChange(good, bad);
  };
  const draw = () => {
    if (!items.length) { list.innerHTML = ta.value.trim() ? `<p class="sh-tip">${T.bulkNone}</p>` : ''; refresh(); return; }
    list.innerHTML = `<div class="bk-h"><span>${T.bulkSeen(items.length)}</span><span class="bk-bad"></span></div>` + items.map((x, i) => `<div class="bk${x.dup ? ' dup' : ''}" data-i="${i}">
        <input class="bk-name" data-f="name" value="${esc(x.name)}" placeholder="${T.fName}" aria-label="${T.fName}">
        <label class="bk-rent${x.rent == null || Number.isNaN(x.rent) ? ' bad' : ''}"><span>$</span><input data-f="rent" inputmode="decimal" value="${x.rent != null && !Number.isNaN(x.rent) ? num(toC(x.rent)) : ''}" placeholder="${T.fRent}" aria-label="${T.fRent}"></label>
        <div class="bk-2"><input class="bk-room" data-f="room" value="${esc(x.room)}" placeholder="${T.roomOpt}" aria-label="${T.fRoom}">${x.from ? `<span class="chip move">${T.chipIn(md(x.from))}</span>` : ''}${x.to ? `<span class="chip move">${T.chipOut(md(x.to))}</span>` : ''}${x.dup ? `<span class="chip">${T.bulkDup}</span>` : `<button type="button" class="bk-sh${x.share ? '' : ' inc'}" data-f="share">${x.share ? T.fShare : T.rowInc}</button>`}<button type="button" class="bk-del" data-f="del" aria-label="${T.bulkDel}">${ICON.x}</button></div></div>`).join('');
    refresh();
  };
  let tm = 0, pending = false;
  const parse = () => { pending = false; items = parseRoster(ta.value, m).map(x => Object.assign(x, { dup: have.has(x.name) })); draw(); };
  ta.addEventListener('input', () => { pending = true; clearTimeout(tm); tm = setTimeout(parse, 120); });
  list.addEventListener('input', e => {
    const card = e.target.closest('.bk'), f = e.target.dataset.f; if (!card || !f) return;
    const x = items[+card.dataset.i];
    if (f === 'rent') { x.rent = parseAmt(e.target.value); e.target.parentNode.classList.toggle('bad', x.rent == null || Number.isNaN(x.rent)); }
    else x[f] = e.target.value.trim();
    if (f === 'name') { x.dup = have.has(x.name); card.classList.toggle('dup', x.dup); }
    refresh();
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('button'), card = e.target.closest('.bk'); if (!b || !card) return;
    const i = +card.dataset.i;
    if (b.dataset.f === 'del') { items.splice(i, 1); draw(); }
    else if (b.dataset.f === 'share') { const x = items[i]; x.share = !x.share; b.classList.toggle('inc', !x.share); b.textContent = x.share ? T.fShare : T.rowInc; }
  });
  // 拿结果前先把还没跑完的解析跑掉（贴完马上点「建好」也不会漏人）
  return () => { if (pending) { clearTimeout(tm); parse(); } return items.filter(valid).map(x => { const p = { id: rid('t'), name: x.name, room: x.room || '', rent: x.rent, share: x.share }; if (x.from) p.from = x.from; if (x.to) p.to = x.to; return p; }); };
}
function bulkSheet(h, m) {
  const have = new Set(rec(h, m).rows.map(x => x.name.trim()));
  openSheet(head3(T.bulkT, T.bulkOk, 'bOk', true) + `<div class="sh-body">
    <textarea class="paste" id="bText" rows="5" placeholder="${T.bulkPh}"></textarea>
    <p class="sh-tip">${T.bulkTip}</p>
    <div id="bList"></div>
    <button type="button" class="btn primary" id="bGo" disabled>${T.bulkOk}</button>
  </div>`, sh => {
    const go2 = $('#bGo', sh), ok = $('#bOk', sh), ta = $('#bText', sh);
    const take = rosterEditor(ta, $('#bList', sh), m, have, (good, bad) => {
      go2.disabled = ok.disabled = !good || bad > 0;
      go2.textContent = good && !bad ? T.bulkGo(good) : T.bulkOk;
    });
    const commit = () => {
      const add = take();
      if (!add.length) return;
      Ops.addTenants(h, m, add); closeSheet(); renderHouse(h, true); toast(T.bulkDone(add.length));
    };
    go2.onclick = commit; ok.onclick = commit;

}

function expSheet(h, m, eid) {
  const cur = m === CUR, r = rec(h, m), e = eid ? r.exp.find(x => x.id === eid) : null;
  openSheet(head3(e ? T.editE : T.addE, T.save, 'eOk') + `<div class="sh-body">
    ${e ? '' : `<div class="pick" id="eQuick">${T.quick.map(q => `<button type="button" data-n="${esc(q[0])}" data-f="${q[1]}">${esc(q[0])}</button>`).join('')}</div>`}
    <div class="form">
      <label class="f-row"><span class="f-k">${T.eName}</span><input id="eName" autocomplete="off" maxlength="24" enterkeyhint="next" placeholder="${T.eNamePh}" value="${esc(e ? e.name : '')}"></label>
      <label class="f-row"><span class="f-k">${T.eAmt}</span><input id="eAmt" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="$ 0.00" value="${e ? num(toC(e.amt)) : ''}"></label>
      ${cur ? `<div class="f-row"><span class="f-k">${T.eFix}<small id="eHint">${!e || e.fixed ? T.fixOn : T.fixOff}</small></span><button type="button" class="switch" role="switch" id="eFix" aria-checked="${!e || !!e.fixed}" aria-label="${T.eFix}"><i></i></button></div>` : ''}
    </div>
    <p class="f-err" id="eErr" hidden></p>
    ${e ? `<div class="sh-acts"><button type="button" class="btn plain danger" id="eDel">${T.delExp}</button><p class="sh-note">${e.fixed && cur ? T.delExpFix : T.delExpOnly(cur ? T.thisM : mLabel(m))}</p></div>` : ''}
  </div>`, sh => {
    const nameI = $('#eName', sh), amtI = $('#eAmt', sh), fail = failer($('#eErr', sh)), fx = $('#eFix', sh);
    const getFix = fx ? switcher(fx, $('#eHint', sh), !e || !!e.fixed, [T.fixOn, T.fixOff]) : () => (e ? !!e.fixed : false);
    const q = $('#eQuick', sh);
    if (q) q.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; nameI.value = b.dataset.n; if (fx && (fx.getAttribute('aria-checked') === 'true') !== (b.dataset.f === '1')) fx.click(); amtI.focus(); };
    const commit = () => {
      $('#eErr', sh).hidden = true;
      const name = nameI.value.trim(), amt = parseAmt(amtI.value);
      if (!name) return fail(T.errEName, nameI);
      if (amt == null || Number.isNaN(amt)) return fail(T.errAmt, amtI);
      if (e) Ops.editExp(h, m, eid, { name, amt, fixed: getFix() }); else Ops.addExp(h, m, { id: rid('e'), name, amt, fixed: getFix() });
      renderHouse(h, true); closeSheet();
    };
    $('#eOk', sh).onclick = commit;
    enterNext(sh, ['eName', 'eAmt'], commit);
    if (e) $('#eDel', sh).onclick = () => { const before = snap(); Ops.delExp(h, m, eid); closeSheet(); renderHouse(h, true); undoable(T.deletedN(e.name), before); };
    else nameI.focus();
  });
}

function newHouseSheet() {
  const estates = [...new Set(realHouses().map(h => (h.estate || '').trim()).filter(Boolean))];
  openSheet(head3(T.newHouse, T.newHouseOk, 'hOk') + `<div class="sh-body">
    ${estates.length ? `<div class="f-label">${T.knownEstates}</div><div class="pick" id="hEst">${estates.map(x => `<button type="button" data-e="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
    <div class="form">
      <label class="f-row"><span class="f-k">${T.estate}</span><input id="hEstate" autocomplete="off" maxlength="24" enterkeyhint="next" placeholder="${T.estatePh}"></label>
      <label class="f-row"><span class="f-k">${T.unit}</span><input id="hUnit" autocomplete="off" maxlength="24" enterkeyhint="next" placeholder="${T.unitPh}"></label>
      <label class="f-row"><span class="f-k">${T.headRent}<small>${T.headRentS}</small></span><input id="hHead" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="$ 0.00"></label>
      <div class="f-row"><span class="f-k">${T.selfLive}<small>${T.selfLiveS}</small></span><button type="button" class="switch" role="switch" id="hSelf" aria-checked="false" aria-label="${T.selfLive}"><i></i></button></div>
    </div>
    <div class="f-label">${T.fPaste} · ${T.fPasteS}</div>
    <textarea class="paste" id="hPaste" rows="4" placeholder="${T.bulkPh}"></textarea>
    <div id="hList"></div>
    <p class="f-err" id="hErr" hidden></p>
  </div>`, sh => {
    const estI = $('#hEstate', sh), unitI = $('#hUnit', sh), headI = $('#hHead', sh), fail = failer($('#hErr', sh));
    const getSelf = switcher($('#hSelf', sh), null, false);
    let rBad = 0;
    const take = rosterEditor($('#hPaste', sh), $('#hList', sh), CUR, new Set(), (good, bad) => { rBad = bad; });
    const pick = $('#hEst', sh);
    if (pick) pick.onclick = ev => { const b = ev.target.closest('button'); if (b) { estI.value = b.dataset.e; unitI.focus(); } };
    const commit = () => {
      $('#hErr', sh).hidden = true;
      const estate = estI.value.trim(), unit = unitI.value.trim(), head = parseAmt(headI.value);
      if (!estate) return fail(T.errEstate, estI);
      if (!unit) return fail(T.errUnit, unitI);
      if (Number.isNaN(head)) return fail(T.errHead, headI);
      const add = take();
      if (rBad) return fail(T.bulkBad(rBad), $('#hPaste', sh));
      const h = { id: rid('h-'), estate, unit, self: getSelf(), byRoom: false, created: CUR, tenants: [], fixed: [], months: {} };
      if (head > 0) h.fixed.push({ id: rid('e'), name: T.headName, amt: head });
      S.houses[h.id] = h; S.order.push(h.id); S.month = CUR;
      if (add.length) Ops.addTenants(h, CUR, add); else save();
      closeSheet();
      go(h.id);
      if (add.length) toast(T.bulkDone(add.length));
    };
    $('#hOk', sh).onclick = commit;
    enterNext(sh, ['hEstate', 'hUnit', 'hHead'], commit);
    estI.focus();
  });
}

function houseMenu(h) {
  openSheet(head3(T.thisHouse, T.save, 'mOk') + `<div class="sh-body">
    <div class="form">
      <label class="f-row"><span class="f-k">${T.estate}</span><input id="mEstate" autocomplete="off" maxlength="24" value="${esc(h.estate)}"></label>
      <label class="f-row"><span class="f-k">${T.unit}</span><input id="mUnit" autocomplete="off" maxlength="24" value="${esc(h.unit)}"></label>
      <div class="f-row"><span class="f-k">${T.selfLive}<small>${T.selfLiveS}</small></span><button type="button" class="switch" role="switch" id="mSelf" aria-checked="${!!h.self}" aria-label="${T.selfLive}"><i></i></button></div>
    </div>
    <p class="f-err" id="mErr" hidden></p>
    <div class="sh-acts"><button type="button" class="btn plain danger" id="mDel">${T.delHouse}</button></div>
  </div>`, sh => {
    const fail = failer($('#mErr', sh)), getSelf = switcher($('#mSelf', sh), null, !!h.self);
    $('#mOk', sh).onclick = () => {
      const estate = $('#mEstate', sh).value.trim(), unit = $('#mUnit', sh).value.trim();
      if (!estate) return fail(T.errEstate, $('#mEstate', sh));
      if (!unit) return fail(T.errUnit, $('#mUnit', sh));
      h.estate = estate; h.unit = unit;
      if (getSelf() !== !!h.self) Ops.setSelf(h, getSelf()); else save();
      closeSheet(); render();
    };
    $('#mDel', sh).onclick = () => {
      const before = snap(); closeSheet();
      delete S.houses[h.id]; S.order = S.order.filter(x => x !== h.id); save(); go(''); undoable(T.deletedN(h.unit), before);
    };
  });
}

function copyText(text, msg) {
  const fallback = () => openSheet(`<div class="sh-head"><span></span><div class="sh-t">${T.manualCopy}</div><button type="button" class="sh-ok" data-act="close">${T.done}</button></div><div class="sh-body"><textarea class="copybox" id="cpBox" rows="5" readonly>${esc(text)}</textarea><p class="sh-tip">${T.manualTip}</p></div>`, sh => { const b = $('#cpBox', sh); b.focus(); b.select(); });
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); return; } } catch (e) {}
  fallback();
}
let toastT = 0;
function toast(msg, actLabel, fn) {
  const t = $('#toast');
  t.textContent = '';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (actLabel) { const b = document.createElement('button'); b.type = 'button'; b.id = 'toastAct'; b.textContent = actLabel; b.onclick = () => { t.classList.remove('show', 'has-act'); fn(); }; t.appendChild(b); }
  t.classList.toggle('has-act', !!actLabel); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show', 'has-act'), actLabel ? 6000 : 2200);
}

// 右上角的切换：选了就记住（localStorage 存不了也照样切，只是下次回到默认英文）
function setLang(l) { if (!STR[l] || l === LANG) return; LANG = l; T = STR[l]; UI.lang = l; saveUI(); applyLang(); render(); }

/* ---------- routing & events ---------- */
function go(route) {
  S.route = route;
  try { if (location.hash.slice(1) !== route) location.hash = route; } catch (e) {}
  render(true);
}
const curHouse = () => (S.route.startsWith('h-') ? S.houses[S.route] : null);
function act(name, el) {
  const h = curHouse();
  switch (name) {
    case 'close': closeSheet(); break;
    case 'lang': setLang(el.dataset.l); break;
    case 'm-prev': S.month = ymAdd(S.month, -1); render(); break;
    case 'm-next': S.month = ymAdd(S.month, 1); render(); break;
    case 'm-cur': S.month = CUR; render(); break;
    case 'y-prev': S.year--; S.sel = null; render(); break;
    case 'y-next': S.year++; S.sel = null; render(); break;
    case 'pick': S.sel = el.dataset.m; render(); break;
    case 'open-month': S.month = el.dataset.m; go(''); break;
    case 'goto-created': if (h) { S.month = h.created; render(); } break;
    case 'paid':
      if (h) {
        Ops.togglePaid(h, S.month, el.dataset.id);
        const x = calc(h, S.month).rows.find(y => y.id === el.dataset.id);
        if (x) { el.className = 'paid pop' + (x.st === 'paid' ? ' on' : x.st === 'owe' ? ' owe' : ''); el.setAttribute('aria-pressed', String(x.st === 'paid')); el.firstElementChild.innerHTML = x.st === 'owe' ? T.oweMark : ICON.check; const s = el.parentNode.querySelector('.row-s .chip.owe-now'); if (s && x.st !== 'owe') s.remove(); }
        renderHouse(h, 'paid');
        if (!h.demo) maybeSettled(S.month);
      }
      break;
    case 'tenant': if (h) tenantSheet(h, S.month, el.dataset.id); break;
    case 'add-tenant': if (h) tenantSheet(h, S.month); break;
    case 'bulk': if (h) bulkSheet(h, S.month); break;
    case 'by-person': case 'by-room': if (h) { const v = name === 'by-room'; if (!!h.byRoom !== v) { h.byRoom = v; save(); renderHouse(h, true); } } break;
    case 'exp': if (h) expSheet(h, S.month, el.dataset.id); break;
    case 'add-exp': if (h) expSheet(h, S.month); break;
    case 'copy-bills': if (h) { const c = calc(h, S.month); copyText(billsAll(h, c, S.month), T.copiedBills(c.rows.length)); } break;
    case 'all-paid':
      if (h) { const before = snap(); const n = Ops.allPaid(h, S.month); renderHouse(h, true); undoable(T.allPaidDone(n), before); if (!h.demo) maybeSettled(S.month); }
      break;
    case 'house-menu': if (h) houseMenu(h); break;
    case 'new-house': newHouseSheet(); break;
    case 'bk-save': saveBackup(); break;
    case 'bk-load': pickBackup(); break;
    case 'a2hs-x': UI.a2hs = 1; saveUI(); { const c = $('#a2hs'); if (c) c.remove(); } break;
    case 'a2hs-go':
      if (St.bip) { const e = St.bip; St.bip = null; e.prompt(); (e.userChoice || Promise.resolve({})).then(r => { if (r && r.outcome === 'accepted') { UI.a2hs = 1; saveUI(); toast(T.a2hsDone); } render(); }); }
      break;
    case 'load-demo':
      for (const d of makeDemo(CUR, T.demo)) { S.houses[d.id] = d; if (!S.order.includes(d.id)) S.order.push(d.id); }
      save(); render(); break;
    case 'clear-demo': {
      const before = snap();
      for (const x of Object.values(S.houses)) if (x.demo) delete S.houses[x.id];
      S.order = S.order.filter(id => S.houses[id]); save(); render(); undoable(T.demoCleared, before);
      break;
    }
  }
}
document.addEventListener('click', e => {
  const fb = e.target.closest('a.fb');
  if (fb) { fb.href = fbHref(); return; }   // 提意见：照当前语言、设备重填一遍，然后让浏览器自己打开邮件
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b);
});
document.addEventListener('input', e => {
  const t = e.target; if (t.id !== 'elecIn') return;
  const h = curHouse(); if (!h) return;
  const v = parseAmt(t.value), f = t.closest('.elec-field'), er = $('#elecErr');
  const out = $('#elecOut');
  if (Number.isNaN(v)) { f.classList.add('bad'); t.setAttribute('aria-invalid', 'true'); if (er) er.hidden = false; if (out) out.classList.add('stale'); document.body.classList.add('stale-all'); return; }
  f.classList.remove('bad'); t.removeAttribute('aria-invalid'); if (er) er.hidden = true; if (out) out.classList.remove('stale'); document.body.classList.remove('stale-all');
  Ops.setElec(h, S.month, v);
  renderHouse(h, true);
});
document.addEventListener('change', e => {
  const t = e.target; if (t.id !== 'elecIn') return;
  const v = parseAmt(t.value); if (v != null && !Number.isNaN(v)) t.value = num(toC(v));
  const h = curHouse(); if (h && !h.demo) maybeSettled(S.month);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheets').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'elecIn') { e.preventDefault(); e.target.blur(); }
});
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r !== S.route) { S.route = r; render(true); } });
function onScroll() { $('#nav').classList.toggle('scrolled', window.scrollY > 30); }
window.addEventListener('scroll', onScroll, { passive: true });
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); St.bip = e; if (S.route === '') render(); });
window.addEventListener('appinstalled', () => { UI.a2hs = 1; saveUI(); St.bip = null; if (S.route === '') render(); });

S.route = (location.hash || '').slice(1);
uncache();
// 只有一套房：打开就进这套房（左上角「房子」回总览）。
if (!S.route) { const rh = realHouses(); if (rh.length === 1 && rh.length === housesInOrder().length) { S.route = rh[0].id; try { history.replaceState(null, '', '#' + S.route); } catch (e) {} } }
S.ready = true;
// 整页都能丢备份文件进来
let dragN = 0;
const isFileDrag = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (!isFileDrag(e)) return; e.preventDefault(); dragN++; $('#dropT').textContent = T.dropT; $('#drop').classList.add('on'); });
window.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', e => {
  if (!isFileDrag(e)) return; e.preventDefault(); dragN = 0; $('#drop').classList.remove('on');
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) f.text().then(loadBackup, () => toast(T.bkBad));
});
render();
try {
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { St.locked = !!v; if (!v && realHouses().length) lock(); syncLine(); }).catch(() => {});
} catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
// test hook (pure functions only, no data)
window.__bzs = { calc, span, dim, parseRoster, VERSION, lang: () => LANG };
})();
</script>
</body>
</html>
