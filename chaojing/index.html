<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaojing · Doc Batcher</title>
<meta name="description" content="Mail merge in your browser. A Word template plus a spreadsheet becomes one certificate, invoice or contract per row, as Word or PDF. Nothing gets uploaded.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Chaojing">
<script src="strings.js?v=0.4.3"></script>
<script>
/* 挑语言：?lang=zh|en（只管这一次）> 右上角选过的（localStorage）> 默认英文。不跟浏览器语言走（Song 11-03 22:19）。标题、简介、<html lang> 在画页面之前就换好 */
(function(){
  var q=(location.search.match(/[?&]lang=(zh|en)\b/)||[])[1], s=null;
  try{s=localStorage.getItem("chaojing.lang")}catch(e){}
  var L=q||(s==="zh"||s==="en"?s:CJ_DEFAULT_LANG), t=CJ_STRINGS[L];
  window.CJ_LANG=L; document.documentElement.lang=t.htmlLang; document.title=t.docTitle;
  document.querySelector('meta[name="description"]').content=t.metaDesc;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content=t.appleTitle;
})();
</script>
<style>
/* 千手院设计规范（_ops/设计规范.md）：一个主色（抄经僧红），其余全是灰。
   布局：没文件时一屏一件事（丢文件）；有了文件，电脑左栏 文件 / 对号入座 / 出货，右栏预览纸；手机单列，下载钮贴底 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --bad-ink:#d70015; --doubt:rgba(255,204,0,.22);
  --accent:#D63A40; --accent-fill:#D63A40; --accent-tint:rgba(229,72,77,.10); --on-accent:#ffffff;
  --r-card:18px; --r-btn:12px; --r-big:14px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  --desk:#f5f5f7; --dz:#f5f5f7; --paper-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.98); --scrim:rgba(0,0,0,.32); --toast-bg:rgba(255,255,255,.98); --toast-fg:#1d1d1f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --bad-ink:#ff6961; --shadow:none;
  --accent:#FF6369; --accent-tint:rgba(255,99,105,.16);
  --desk:#000000; --dz:#1c1c1e; --paper-shadow:0 0 0 .5px rgba(255,255,255,.1);
  --glass:rgba(28,28,30,.98); --scrim:rgba(0,0,0,.6); --toast-bg:rgba(28,28,30,.98); --toast-fg:#f5f5f7;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --bad-ink:#ff6961; --shadow:none;
  --accent:#FF6369; --accent-tint:rgba(255,99,105,.16);
  --desk:#000000; --dz:#1c1c1e; --paper-shadow:0 0 0 .5px rgba(255,255,255,.1);
  --glass:rgba(28,28,30,.98); --scrim:rgba(0,0,0,.6); --toast-bg:rgba(28,28,30,.98); --toast-fg:#f5f5f7;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg-group);color:var(--fg);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.empty{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}

/* 顶栏：毛玻璃 */
.bar-top{position:sticky;top:0;z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;height:52px;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--fg)}
.brand img{width:28px;height:28px;display:block}
.brand-x{font-weight:400;color:var(--fg-2)}
@media (max-width:520px){.brand-x{display:none}}
.privacy{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--fg-2)}
.privacy svg{width:14px;height:14px}
.privacy .ps{display:none}
@media (max-width:520px){.privacy .pl{display:none}.privacy .ps{display:inline}}
.bar-r{display:flex;align-items:center;gap:12px;min-width:0}
/* 右上角 EN / 中文：小号分段控件，点的范围撑到 44 高 */
.lang-seg{display:flex;gap:2px;padding:2px;border-radius:var(--r-chip);background:var(--fill);flex:none}
.lang-seg button{position:relative;min-width:40px;height:26px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--fg-2);transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.lang-seg button::after{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.lang-seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
:root[data-theme="dark"] .lang-seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lang-seg button[aria-pressed="true"]{background:#636366}}

.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}

/* 空状态：一句大标题、一句副标题、丢文件 */
.hero{max-width:980px;margin:0 auto;padding:72px 0 32px;text-align:center}
.hero h1{margin:0;font-size:clamp(40px,6vw,64px);line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:16px auto 0;max-width:620px;font-size:21px;line-height:1.4;color:var(--fg-2);text-wrap:balance;white-space:pre-line}
html[lang="en"]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif}
html[lang="en"] .hero h1{letter-spacing:-.02em}
/* 中文只在标点处折行，词不拆开（「一行｜抄一份」这种） */
html[lang^="zh"] .hero p,html[lang^="zh"] .dropzone>b,html[lang^="zh"] .dropzone .ds{word-break:keep-all;overflow-wrap:anywhere}
.dropzone{max-width:640px;margin:0 auto;background:var(--dz);border-radius:var(--r-card);padding:48px 24px;text-align:center;transition:background var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.dropzone .di{width:56px;height:56px;margin:0 auto 16px;color:var(--accent)}
.dropzone>b{display:block;font-size:22px;font-weight:600;line-height:1.25;text-wrap:balance}
.dropzone .ds{margin:8px 0 24px;color:var(--fg-2);font-size:15px;text-wrap:balance}
.dropzone .acts{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.dropzone .err{margin:24px auto 0;font-size:15px}
.samples-line{margin:24px 0 0;font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;justify-content:center;column-gap:24px}
.samples-line .sl{white-space:nowrap}
.samples-line button{color:var(--accent);font-size:13px;padding:12px 4px}
body.dragging .dropzone{background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:640px){.hero{padding:48px 0 24px}.hero p{font-size:17px}.dropzone{padding:32px 16px}}

/* 干活界面 */
.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start;padding-top:32px;
  grid-template-areas:"files pv" "map pv" "out pv" ". pv"}
#cFiles{grid-area:files}#cMap{grid-area:map}#cOut{grid-area:out}#cPv{grid-area:pv}
@media (max-width:900px){
  body{font-size:17px}
  .grid{grid-template-columns:minmax(0,1fr);gap:24px;padding-top:24px;grid-template-areas:"files" "pv" "map" "out"}
}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 8px}
.sec-h h2{margin:0;font-size:13px;font-weight:400;color:var(--fg-2)}
.sec-h .meta{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.sec-h .meta.warn{color:var(--fg)}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}

/* 分组列表（iOS 设置） */
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;position:relative}
.row+.row::before,.row+.sub::before,.sub+.row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--line)}
.row.plain+.row::before{left:16px}
.ficon{width:32px;height:32px;flex:none;color:var(--fg-2)}
.ficon.on{color:var(--accent)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span.missing{color:var(--fg-3)}
@media (max-width:900px){.rt b{font-size:17px}}
.row .tool{flex:none}
.sub{position:relative;padding:0 16px 16px 60px}
.restore{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg-2);padding:12px 16px;border-top:.5px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;padding:4px 16px 8px}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-size:15px}
.link.sm{font-size:13px;min-height:32px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-btn);font-size:15px;font-weight:600;background:var(--fill);color:var(--fg);transition:background var(--t) var(--ease),opacity var(--t) var(--ease),transform 120ms var(--ease);white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{width:100%;height:52px;font-size:17px;border-radius:var(--r-big)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.text{background:none;color:var(--accent);padding:0 8px}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:var(--r-chip)}

/* 分段控件 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:var(--r-field);background:var(--fill)}
.seg button{height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg);transition:background var(--t) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--fill-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}

/* 下拉：重画 */
.pick{position:relative;display:block;min-width:0}
.pick select{width:100%;height:32px;border-radius:var(--r-chip);border:0;background:var(--fill);padding:0 28px 0 12px;font-size:13px;-webkit-appearance:none;appearance:none;cursor:pointer;text-overflow:ellipsis;color:var(--fg)}
.pick::after{content:"";position:absolute;right:12px;top:11px;width:6px;height:6px;border-right:1.5px solid var(--fg-2);border-bottom:1.5px solid var(--fg-2);transform:rotate(45deg);pointer-events:none}

/* 表格 */
.tbl-wrap{max-height:196px;overflow:auto;border-top:.5px solid var(--line);overscroll-behavior:contain;--fr:0px;--fb:0px;
  /* 放不下的那边渐隐，不把字硬切成半个：右边还能横着滚、下面还有行时才隐 */
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - var(--fr)),transparent),linear-gradient(to bottom,#000 calc(100% - var(--fb)),transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,#000 calc(100% - var(--fr)),transparent),linear-gradient(to bottom,#000 calc(100% - var(--fb)),transparent);mask-composite:intersect}
table.data{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
table.data th,table.data td{padding:8px 12px;text-align:left;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;border-bottom:.5px solid var(--line)}
table.data th{position:sticky;top:0;background:var(--card);font-weight:600;color:var(--fg-2);z-index:1}
table.data td.n,table.data th.n{color:var(--fg-3);width:1%;padding-right:4px;text-align:right;font-variant-numeric:tabular-nums}
/* 等宽数字只给行号、计数、进度开：Inter 这类字体开了 tabular-nums 会把连字符也撑宽（One‑Slide 变 One - Slide），文件名、表头、正文都不开 */
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:var(--fill)}
table.data tbody tr.sel td{background:var(--accent-tint)}
table.data tbody tr.sel td.n{color:var(--accent);font-weight:600}
.more{padding:8px 12px;font-size:13px;color:var(--fg-2)}

/* 对号入座 */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);align-items:center;gap:8px;min-height:44px;padding:6px 16px;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.mrow.doubt{background:var(--doubt)}
.tagname{font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--fg-3);width:14px;height:14px}
.foot{padding:12px 16px;font-size:13px;color:var(--fg-2);border-top:.5px solid var(--line)}
.foot .btn{margin-left:4px}
.grp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mrow.fold{display:flex;justify-content:space-between}
.mline{min-width:0;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapnone{padding:16px;font-size:13px;color:var(--fg-2)}

/* 出货 */
.out-in{padding:16px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13px;color:var(--fg-2);margin:0 0 8px 4px}
.inp{width:100%;height:40px;border-radius:var(--r-field);border:0;background:var(--fill);padding:0 12px;font-family:var(--mono);font-size:13px;outline:none;color:var(--fg)}
.inp:focus{box-shadow:0 0 0 2px var(--accent)}
.namepv{margin:8px 4px 0;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo{margin:8px 4px 0;font-size:12px;color:var(--fg-3)}
.prog{margin-top:12px}
.pbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width 200ms var(--ease)}
.prog-t{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.done{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;animation:rise var(--t) var(--ease)}
.done .ok{display:inline-flex;align-items:center;gap:8px}
.done .ok svg{width:20px;height:20px;color:var(--ok)}
.done .ok svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 360ms var(--ease) 80ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.err{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13px;color:var(--fg);background:var(--fill);border-radius:var(--r-field);padding:12px;max-width:520px}
.err svg{width:16px;height:16px;flex:none;color:var(--bad);margin-top:2px}
.err b{font-weight:600}
.card .err{margin:0 16px 16px;background:var(--fill)}
@media (max-width:900px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  body.work{padding-bottom:150px}
  .out-in .dock .done,.out-in .dock .prog{margin-top:8px}
}

/* 预览 */
#cPv{position:sticky;top:76px;background:var(--card)}
@media (min-width:901px){.pv-body{min-height:320px}}
.pv-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px;border-bottom:.5px solid var(--line)}
.pv-h .tt{min-width:0;font-size:13px;color:var(--fg-2)}
#pvOf{font-variant-numeric:tabular-nums}
.pv-h .tt b{display:block;font-size:15px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rownav{display:flex;align-items:center;gap:4px;flex:none}
.rn-b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.rn-b:hover{background:var(--fill)}
.rn-b:disabled{color:var(--fg-3);cursor:default;background:none}
.rn-b svg{width:9px;height:15px}
.pv-body{padding:24px;min-height:120px;max-height:calc(100vh - 210px);overflow:auto;overscroll-behavior:contain;background:var(--desk)}
@media (max-width:900px){#cPv{position:static}.pv-body{padding:16px;max-height:none}}
.pv-stage{margin:0 auto;transform-origin:top left}
.pv-scale{transform-origin:top left;transition:opacity 200ms var(--ease)}
.pv-scale section.docx{background:#fff;box-shadow:var(--paper-shadow)!important;margin:0 0 16px!important}
.pv-scale [data-qf=s]{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif!important}
.pv-scale [data-qf=r]{font-family:QSerif,"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif!important}
.pv-scale .docx-tab-stop[data-qn]{word-spacing:0!important;font-size:0!important}
.pv-scale [data-qf=k]{font-family:QKai,"Kaiti SC","STKaiti","KaiTi","LXGW WenKai",serif!important}
.pv-err,.pv-empty{padding:48px 24px;text-align:center;color:var(--fg-2);font-size:15px}
.pv-foot{display:flex;gap:16px;justify-content:center;padding:4px 16px;border-top:.5px solid var(--line)}
.pv-loading{opacity:.5}

footer{max-width:1120px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
footer a{color:var(--fg-2)}
footer .mail{-webkit-user-select:text;user-select:text}

"use strict";
/* ============ 界面文字：全在 strings.js（中文一套、英文一套），这里只挑一套用 ============ */

/* ============ 提意见：一个 mailto 链接，收件人、标题、正文都填好；正文最后一行带上版本和设备，人不用自己打。不接第三方表单，不收任何数据 ============ */

let fbHi=null;   // Chromium 的 UA-CH 能分出 Windows 10 / 11、macOS 和安卓的真版本号；拿不到就只看 UA
function fbDevice(){
  const u=navigator.userAgent, pv=fbHi&&fbHi.platformVersion?parseInt(fbHi.platformVersion,10):NaN;

  if(/Windows/.test(u))os=/Windows NT 10/.test(u)?(pv>=13?"Windows 11":pv>0?"Windows 10":"Windows"):(m=/Windows NT (\d+\.\d+)/.exec(u))?"Windows "+({"6.1":"7","6.2":"8","6.3":"8.1"}[m[1]]||m[1]):"Windows";
  else if((m=/(iPhone|iPad|iPod).*? OS (\d+)(?:_(\d+))?/.exec(u)))os=(m[1]==="iPad"?"iPadOS ":"iOS ")+m[2]+(m[3]&&m[3]!=="0"?"."+m[3]:"");
  else if(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)os="iPadOS";

  else if(/Mac OS X/.test(u))os="macOS"+(pv>0?" "+pv:"");
  else if(/Linux/.test(u))os="Linux";
  const B=[[/MicroMessenger\/(\d+(?:\.\d+)?)/,"WeChat"],[/Edg(?:A|iOS)?\/(\d+)/,"Edge"],[/OPR\/(\d+)/,"Opera"],[/SamsungBrowser\/(\d+)/,"Samsung Internet"],[/(?:Firefox|FxiOS)\/(\d+)/,"Firefox"],[/(?:CriOS|Chrome)\/(\d+)/,"Chrome"],[/Version\/(\d+(?:\.\d+)?).*Safari\//,"Safari"]];
  let br="Other";
  for(const [re,name] of B){const x=re.exec(u);if(x){br=name+" "+x[1];break}}

}
function fbHref(){
  const body=[...T.fbBody,`${VER} · ${fbDevice()}`].join("\r\n");

const fbFill=()=>document.querySelectorAll("a.fb").forEach(a=>{a.href=fbHref()});

/* ============ 小工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function toast(msg,ms=2600,act,fn){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");const s=document.createElement("span");s.textContent=msg;d.appendChild(s);if(!act)d.classList.add("plain");if(act){const b=document.createElement("button");b.textContent=act;b.onclick=()=>{d.remove();fn()};d.appendChild(b)}document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

const norm=s=>String(s).toLowerCase().replace(/[\s　_\-－—:：()（）\[\]【】]/g,"");

/* ============ 状态 ============ */
const S={
  tpl:null,   // {name, buf:ArrayBuffer, tags:[], source:'example'|'word'|'editor', html, orient, sample}
  data:null,  // {name, headers:[], rows:[[]], source, sheets?, wb?}
  map:{},     // tag -> col index | -1 没对上 | -2 留空
  row:0, fmt:"docx", rule:"", ruleTouched:false, busy:false, stop:false, lastZip:null, restored:false, err:null

/* ============ Word 模板：认空位 ============ */
const TAG_RE=/\{\{\s*([^{}]+?)\s*\}\}/g;
function decodeXml(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&")}
function extractTags(buf){
  const zip=new PizZip(buf); const tags=[]; const seen=new Set();
  const files=Object.keys(zip.files).filter(f=>/^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(f)).sort((a,b)=>(a.includes("document")?-1:0)-(b.includes("document")?-1:0));
  for(const f of files){
    const xml=zip.file(f).asText();
    const paras=xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[];
    for(const p of paras){
      const text=(p.match(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>/g)||[]).map(t=>decodeXml(t.replace(/<[^>]+>/g,""))).join("");
      let m; TAG_RE.lastIndex=0;
      while((m=TAG_RE.exec(text))){const k=m[1].trim(); if(/^[#^\/]/.test(k)) continue; if(!seen.has(k)){seen.add(k);tags.push(k)}}
    }
  }
  return tags;
}
function pageBorder(buf){
  try{
    const xml=new PizZip(buf).file("word/document.xml").asText(); const m=xml.match(/<w:pgBorders([^>]*)>([\s\S]*?)<\/w:pgBorders>/); if(!m)return null;
    const top=m[2].match(/<w:top\b[^>]*>/); if(!top)return null; const a=k=>(top[0].match(new RegExp(`w:${k}="([^"]*)"`))||[])[1];
    const val=a("val")||"single"; if(val==="none"||val==="nil")return null;
    const fromPage=/w:offsetFrom="page"/.test(m[1]); const space=+a("space")||0; const w=Math.max(.5,(+a("sz")||4)/8);
    let inset=space; if(!fromPage){const mar=xml.match(/<w:pgMar[^>]*w:top="(\d+)"/);inset=Math.max(4,(mar?+mar[1]/20:72)-space-w)}
    const col=a("color"); return{inset,w,style:/double/.test(val)?"double":/dash/.test(val)?"dashed":/dot/.test(val)?"dotted":"solid",color:col&&col!=="auto"?"#"+col:"#000"};
  }catch(e){return null}
}
function borderCss(b){return b?`section.docx{position:relative}section.docx::before{content:"";position:absolute;inset:${b.inset}pt;border:${b.style==="double"?Math.max(3,b.w):b.w}pt ${b.style} ${b.color};pointer-events:none;z-index:0}`:""}
function applyBorderCss(doc){let st=doc.getElementById("pgb");if(!st){st=doc.createElement("style");st.id="pgb";doc.head.appendChild(st)}st.textContent=borderCss(S.tpl&&S.tpl.pgb)}
function pageSize(buf){
  try{const xml=new PizZip(buf).file("word/document.xml").asText();const m=xml.match(/<w:pgSz[^>]*>/);if(m){const w=+(m[0].match(/w:w="(\d+)"/)||[])[1],h=+(m[0].match(/w:h="(\d+)"/)||[])[1];if(w&&h)return{w:w/20,h:h/20}}}catch(e){}
  return{w:595.3,h:841.9};
}

/* ============ 填一份 ============ */
function rowValues(i){
  const r=S.data.rows[i]||[]; const o={};
  for(const t of S.tpl.tags){const c=S.map[t]; o[t]= c>=0 ? String(r[c]??"") : c===-2 ? "" : `{{${t}}}`}
  return o;
}
function unitValues(u){
  const rows=S.units[u]||[u]; const o=rowValues(rows[0]);
  if(grouping()){const lt=loopTags();o.__g=rows.map(i=>{const v=rowValues(i),x={};for(const t of lt)x[t]=v[t];return x})}

}
function makeDoc(buf){
  return new docxtemplater(new PizZip(buf),{
    delimiters:{start:"{{",end:"}}"}, paragraphLoop:true, linebreaks:true,

}

/* ============ 一张发票多行商品：哪几行表头一样、模板里又有表格行，就自动并成一份 ============ */
function textOfXml(x){return (x.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[]).map(p=>(p.match(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>/g)||[]).map(t=>decodeXml(t.replace(/<[^>]+>/g,""))).join("")).join("\n")}
const TR_RE=/<w:tr[ >][\s\S]*?<\/w:tr>/g;
function trTags(buf){

function pool(){

  const ws=pool(); const w=ws.reduce((a,b)=>b.q.size<a.q.size?b:a);
  for(const fam in FAMS)if(FAMS[fam].raw&&!w.idx.has(fam)){w.postMessage({type:"idx",fam,r:FAMS[fam].raw});w.idx.add(fam)}

/* ============ 批量生成 ============ */
async function generate(){
  if(S.busy||!S.data||!S.units.length)return;
  S.busy=true; S.stop=false; showErr(null); renderOut();
  const units=S.units.map((_,i)=>i), n=units.length, fmt=S.fmt, wantDocx=fmt!=="pdf", wantPdf=fmt!=="docx";
  $("#done").hidden=true; $("#prog").hidden=false; $("#bStop").hidden=false;
  const bar=$("#barI"), pt=$("#progT"); const t0=performance.now();
  const sec=()=>((performance.now()-t0)/1000).toFixed(1);
  const zip=new JSZip(); const used={};
  const uniq=b=>{let k=b.toLowerCase();if(!used[k]){used[k]=1;return b}let j=++used[k];return `${b}(${j})`};
  let made=0, err=null; const jobs=[];
  const show=()=>{bar.style.width=(made/n*100)+"%";pt.textContent=T.progress(made,n,sec())};
  try{
    let sess=null;
    if(wantPdf){pt.textContent=T.pdfNote;sess=await pdfSession(units)}
    let lastYield=performance.now();
    for(const u of units){
      if(S.stop||err)break;
      const base=uniq(fileBase(u));
      if(wantDocx)zip.file((fmt==="both"?"Word/":"")+base+".docx",fillDocx(u,true));
      if(wantPdf){
        const list=await sess.layout(u);
        jobs.push(pdfJob(sess,list,base).then(pdf=>{zip.file((fmt==="both"?"PDF/":"")+base+".pdf",pdf);made++},e=>{err=err||e}));
        while(inflight()>POOL.ws.length*6&&!err)await sleep(2);
      }else made++;
      if(performance.now()-lastYield>60){show();await tick();lastYield=performance.now()}
    }
    while(jobs.length){await jobs.shift();show()}
    if(err)throw err;
    show();
    if(made){
      pt.textContent=T.packing; $("#bStop").hidden=true; await tick();
      const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
      const tname=S.tpl.name.replace(/\.docx$/i,"");
      const zname=T.zipName(tname,made);
      S.lastZip={blob,name:zname};
      download(blob,zname);
      $("#doneT").textContent=S.stop?T.stopped(made):T.doneMsg(made,sec()); $("#done").hidden=false; S.lastSig=sig();
      window.__lastRun={n:made,seconds:+sec(),fmt,bytes:blob.size,threads:POOL.ws.length,fast:sess?sess.fast:null};
    }
  }catch(e){console.error(e);showErr(T.errGen(e.message||String(e)))}
  $("#prog").hidden=true; S.busy=false; renderOut();
}

async function downloadOne(kind){
  if(!S.data||!S.units.length)return;
  const u=S.row, base=fileBase(u);
  try{
    if(kind==="docx")download(new Blob([fillDocx(u,true)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}),base+".docx");
    else{
      const slow=setTimeout(()=>toast(T.pdfNote,2200),400);
      const sess=await pdfSession([u]); const pdf=await pdfJob(sess,await sess.layout(u),base); clearTimeout(slow);
      download(new Blob([pdf],{type:"application/pdf"}),base+".pdf");
    }
  }catch(e){console.error(e);showErr(T.errGen(e.message||String(e)))}
}
async function docxToPdf(u){const sess=await pdfSession([u]);return pdfJob(sess,await sess.layout(u),fileBase(u))}

/* ============ 丢文件：模板和表格一起丢、一起选，按后缀自己分 ============ */
async function onTemplateFile(file){
  try{
    const buf=await file.arrayBuffer(); new PizZip(buf).file("word/document.xml").asText();
    S.restored=false;
    return setTemplate({name:file.name,buf,source:"word"});
  }catch(e){console.warn(e);showErr(T.errTpl);return false}
}
async function onDataFile(file){
  try{const d=await readTable(file);d.source="file";S.restored=false;setData(d);return true}
  catch(e){console.warn(e);showErr(T.errData);return false}
}
async function takeFiles(list){
  const fs=[...list]; if(!fs.length)return;
  const docs=fs.filter(f=>/\.docx$/i.test(f.name)), tabs=fs.filter(f=>/\.(xlsx|xls|xlsm|csv|tsv|txt|ods)$/i.test(f.name)), other=fs.filter(f=>!docs.includes(f)&&!tabs.includes(f));
  if(docs.length)await onTemplateFile(docs[0]); // 先模板后表格：对号一次到位
  if(tabs.length)await onDataFile(tabs[0]);
  if(other.length&&!docs.length&&!tabs.length)showErr(T.errWhat(other[0].name));
}

/* 上回的文件：开机自己接上；「清掉」能撤销 */
async function restoreLast(){
  const t=await kv("tpl"), d=await kv("data");
  if(!t&&!d)return false;
  S.restored=true; S.restoredAt=Math.max(t?.at||0,d?.at||0);
  if(t)setTemplate({name:t.name,buf:t.buf,source:t.source,html:t.html,orient:t.orient,border:t.border});
  if(d)setData({name:d.name,headers:d.headers,rows:d.rows,source:d.source});
  S.restored=true; renderAll();
  return true;
}
$("#bForget").onclick=async()=>{
  const t=await kv("tpl"), d=await kv("data");
  await kv("tpl",null); await kv("data",null);
  S.tpl=null; S.data=null; S.restored=false; S.map={}; computeUnits(); showErr(null); renderAll();
  toast(T.forgot,6000,T.undo,async()=>{if(t)await kv("tpl",t);if(d)await kv("data",d);restoreLast()});
};

/* ============ 粘贴表格 ============ */
function openPaste(){
  const L=$("#layer");
  L.innerHTML=`<div class="scrim"><div class="sheet small" role="dialog" aria-label="${T.pasteTitle}"><div class="sh-h"><button class="btn text l" id="pX">${T.cancel}</button><b>${T.pasteTitle}</b><button class="btn primary sm r" id="pOk">${T.pasteOk}</button></div><textarea class="paste" id="pTa" spellcheck="false" placeholder="${esc(T.pastePh).replace(/\n/g,"&#10;")}"></textarea><div class="sh-foot">${T.pasteHint}</div></div></div>`;
  const close=()=>L.innerHTML=""; $("#pX").onclick=close; L.querySelector(".scrim").onclick=e=>{if(e.target.classList.contains("scrim"))close()};
  $("#pTa").focus();
  $("#pOk").onclick=()=>{const v=$("#pTa").value;if(!v.trim()){close();return}const d=parseText(v.replace(/^﻿/,""),T.pasted);d.source="paste";close();S.restored=false;setData(d)};
}
$("#bPaste").onclick=openPaste; $("#bPaste0").onclick=openPaste;

/* ============ 在线编辑器 ============ */
const ICON={
  b:'<b style="font-size:15px">B</b>', i:'<i style="font-size:15px;font-family:Georgia,serif">I</i>', u:'<u style="font-size:15px">U</u>',
  l:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8"/></svg>',
  c:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M4 12.5h8"/></svg>',
  r:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8"/></svg>',
};
function openEditor(){
  const t=S.tpl; const L=$("#layer");
  const startHtml=t&&t.html?t.html:T.edStart;
  let orient=t&&t.html?(t.orient||"portrait"):"portrait"; let border=t&&t.html?t.border||null:null;
  const sw=c=>`<button class="tb" data-color="${c}" title="${c}"><span class="sw" style="background:${c}"></span></button>`;
  L.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-label="${T.edTitle}" style="height:100%">
    <div class="sh-h"><button class="btn text l" id="eX">${T.cancel}</button><b>${T.edTitle}</b><button class="btn primary sm r" id="eOk">${T.use}</button></div>
    <div class="toolbar" id="eTb">
      <button class="tb ins" id="eField">{{ }} ${T.edField}</button><span class="tbsep"></span>
      <button class="tb" data-block="h1">${T.edH1}</button><button class="tb" data-block="h2">${T.edH2}</button><button class="tb" data-block="h3">${T.edH3}</button><button class="tb" data-block="p">${T.edP}</button><button class="tb" data-block="h6">${T.edSmall}</button><span class="tbsep"></span>
      <button class="tb" data-cmd="bold">${ICON.b}</button><button class="tb" data-cmd="italic">${ICON.i}</button><button class="tb" data-cmd="underline">${ICON.u}</button><span class="tbsep"></span>
      <button class="tb" data-cmd="justifyLeft">${ICON.l}</button><button class="tb" data-cmd="justifyCenter">${ICON.c}</button><button class="tb" data-cmd="justifyRight">${ICON.r}</button><span class="tbsep"></span>
      ${sw(INK)}${sw(GOLD)}${sw("#D63A40")}${sw("#C0392B")}${sw("#8E8E93")}<span class="tbsep"></span>
      <button class="tb" id="eHr">${T.edHr}</button><button class="tb" id="eBd">${T.edBorder}</button><button class="tb" id="eOr"></button>
    </div>
    <div class="ed-desk" id="eDesk"><div class="ed-stage" id="eStage"><div class="page" id="ePage" contenteditable="true" spellcheck="false"></div></div></div>
  </div></div>`;
  const page=$("#ePage"); page.innerHTML=startHtml;
  try{document.execCommand("defaultParagraphSeparator",false,"p");document.execCommand("styleWithCSS",false,true)}catch(e){}
  const setOr=()=>{page.className="page "+orient+(border?" bordered":"");page.style.setProperty("--bd",border||GOLD);$("#eBd").classList.toggle("on",!!border);$("#eOr").textContent=orient==="portrait"?T.edLandscape:T.edPortrait;fitEd()};
  const fitEd=()=>{const desk=$("#eDesk");if(!desk)return;const pw=orient==="portrait"?794:1123;const avail=desk.clientWidth-parseFloat(getComputedStyle(desk).paddingLeft)*2;const k=Math.min(1,avail/pw);page.style.transform=`scale(${k})`;$("#eStage").style.width=pw*k+"px";$("#eStage").style.height=page.offsetHeight*k+"px"};
  setOr(); new ResizeObserver(fitEd).observe(page); addEventListener("resize",fitEd);
  const close=()=>{L.innerHTML="";removeEventListener("resize",fitEd)};
  $("#eX").onclick=close;
  $("#eOr").onclick=()=>{orient=orient==="portrait"?"landscape":"portrait";setOr()};
  $("#eBd").onclick=()=>{border=border?null:GOLD;setOr()};
  const tb=$("#eTb");
  tb.addEventListener("mousedown",e=>{if(e.target.closest(".tb"))e.preventDefault()});
  tb.addEventListener("click",e=>{
    const b=e.target.closest(".tb"); if(!b)return;
    if(document.activeElement!==page&&!page.contains(document.activeElement))page.focus();
    if(b.dataset.block)document.execCommand("formatBlock",false,b.dataset.block);
    else if(b.dataset.cmd)document.execCommand(b.dataset.cmd);
    else if(b.dataset.color)document.execCommand("foreColor",false,b.dataset.color);
  });
  $("#eHr").onclick=()=>{page.focus();document.execCommand("insertHorizontalRule")};
  page.addEventListener("paste",e=>{e.preventDefault();const tx=(e.clipboardData||window.clipboardData).getData("text/plain");document.execCommand("insertText",false,tx)});
  let saved=null;
  const keep=()=>{const s=getSelection();if(s.rangeCount&&page.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange()};
  document.addEventListener("selectionchange",keep);
  const insert=txt=>{page.focus();if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}document.execCommand("insertText",false,txt)};
  $("#eField").onclick=e=>{
    keep(); const r=e.currentTarget.getBoundingClientRect();
    const m=document.createElement("div"); m.className="menu"; m.style.left=Math.min(r.left,innerWidth-200)+"px"; m.style.top=r.bottom+6+"px";
    const cols=S.data?S.data.headers:[];
    m.innerHTML=cols.map((h,i)=>`<button data-i="${i}"><span class="mono">{{${esc(h)}}}</span></button>`).join("")+`<div class="newf"><input id="eNew" placeholder="${T.edNewField}" spellcheck="false"><button class="btn primary sm" id="eNewOk">${T.edAdd}</button></div>`;
    document.body.appendChild(m);
    const off=ev=>{if(!m.contains(ev.target)){m.remove();document.removeEventListener("mousedown",off,true)}};
    setTimeout(()=>document.addEventListener("mousedown",off,true));
    m.addEventListener("mousedown",ev=>{if(!ev.target.closest("input"))ev.preventDefault()});
    const addNew=()=>{const k=$("#eNew").value.trim();m.remove();document.removeEventListener("mousedown",off,true);if(k)insert(`{{${k}}}`)};
    $("#eNew").onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();addNew()}};
    m.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;if(b.id==="eNewOk"){addNew();return}m.remove();document.removeEventListener("mousedown",off,true);
      insert(`{{${cols[+b.dataset.i]}}}`)};
  };
  $("#eOk").onclick=()=>{
    const html=page.innerHTML; document.removeEventListener("selectionchange",keep);
    const name=t&&t.source!=="word"?t.name:T.editorName+".docx";
    S.restored=false; const ok=setTemplate({name,buf:htmlToDocx(html,orient,border),source:"editor",html,orient,border,rule:t&&t.html?S.rule:null});
    if(ok)close();
  };
}
