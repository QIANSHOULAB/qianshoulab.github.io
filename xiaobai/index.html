<script type="module">
import * as THREE from 'three';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* ---------- 换皮：以后有了画好的球图，把地址填在这里（或者网址后面加 ?matcap=…&matcapRed=…），不用改别的 ---------- */
const QS = new URLSearchParams(location.search);
const MATCAP_URL = { purple: QS.get('matcap') || null, red: QS.get('matcapRed') || null };

/* ---------- 固定种子 ---------- */
function rngOf(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = rngOf(0x0420B1A0);
const rr = (a, b) => a + (b - a) * rng();

/* ---------- 参数 ---------- */
const pick = (k, list, def) => list.includes(QS.get(k)) ? QS.get(k) : def;
const P = { mode: 'idle', bg: pick('bg', ['black', 'light', 'dark'], 'black'),
  iso: pick('iso', ['none', 'fog', 'dim', 'hole', 'eclipse'], 'hole'),      // 隔离：无 / 灰雾（042 的暗场）/ 熄灯 / 开洞 / 日食。048：默认开洞
  dimDepth: 0.3, holeR: 1.2, eclMode: 'auto',                                 // 熄灯深度、洞口半径（单位 R）、日食：自动 / 强制日食 / 强制恒星
  holeFall: 2.0, ring: false, slow: false,                                    // 048：吸暗范围（外缘，单位 R）、洞口亮环（默认关）、慢放（0.25 倍速）
  lens: true, skin: 'A', shards: 9, debris: 24, speed: 1, bright: 1, lensK: 0.7, vol: 0 };
/* 给测试脚本用：停住模拟时间、把某一类东西藏起来；noFall：开洞不吸暗（量吸暗时拿来对照） */
const dbg = { freeze: false, noCore: false, noShards: false, noParts: false, noArcs: false, noRings: false, noFall: false };
const eclU = { value: 0 };          // 日食程度 0..1，所有材质共用
const MAX_MAIN = 14, MAX_DEBRIS = 40, N_PART = 600;

/* ---------- 渲染器 ---------- */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('err').textContent = '这台设备打不开 WebGL：' + e.message; throw e; }
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
let W = 1, H = 1, DPR = 1, R = 1, BW = 1, BH = 1, CAMD = 6;

const AddBlend = m => { m.transparent = true; m.depthWrite = false; m.blending = THREE.CustomBlending;
  m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneFactor; m.blendSrcAlpha = THREE.ZeroFactor; m.blendDstAlpha = THREE.OneFactor; return m; };
/* 加色和普通混合两用（预乘）：着色器输出 alpha = 0 就是加色（和上面那种算出来一样），alpha > 0 就盖住后面。日食时用。 */
const MixBlend = m => { m.transparent = true; m.depthWrite = false; m.blending = THREE.CustomBlending;
  m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneMinusSrcAlphaFactor; m.blendSrcAlpha = THREE.OneFactor; m.blendDstAlpha = THREE.OneMinusSrcAlphaFactor; return m; };

const V3 = THREE.Vector3;

/* ---------- 颜色（线性） ---------- */
const C = {
  purple: 'vec3(0.43,0.07,1.0)', crimson: 'vec3(1.0,0.012,0.06)',
};

/* ---------- 球图（皮 B）：代码画 ---------- */
function drawMatcap(red) {
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s; const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.save(); g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 1, 0, Math.PI * 2); g.clip();
  let gr = g.createRadialGradient(s * .45, s * .4, 4, s / 2, s / 2, s / 2); gr.addColorStop(0, '#0d0a12'); gr.addColorStop(1, '#020103');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  const hi = red ? ['255,40,70', '255,120,130'] : ['150,60,255', '200,140,255'];
  g.save(); g.translate(s * .3, s * .36); g.rotate(-0.9); g.scale(1, .22);       // 一侧：电光紫条状高光
  gr = g.createRadialGradient(0, 0, 0, 0, 0, s * .42); gr.addColorStop(0, `rgba(${hi[1]},1)`); gr.addColorStop(.35, `rgba(${hi[0]},.85)`); gr.addColorStop(1, `rgba(${hi[0]},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, s * .42, 0, Math.PI * 2); g.fill(); g.restore();
  g.save(); g.translate(s * .5, s * .98); g.scale(1, .35);                      // 底部一抹暗红
  gr = g.createRadialGradient(0, 0, 0, 0, 0, s * .5); gr.addColorStop(0, red ? 'rgba(200,0,30,.95)' : 'rgba(150,0,28,.9)'); gr.addColorStop(1, 'rgba(120,0,24,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, s * .5, 0, Math.PI * 2); g.fill(); g.restore();
  g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineCap = 'round'; g.shadowColor = red ? 'rgba(255,90,110,.9)' : 'rgba(200,150,255,.9)'; g.shadowBlur = 14;
  g.lineWidth = 9; g.beginPath(); g.moveTo(s * .16, s * .36); g.quadraticCurveTo(s * .3, s * .12, s * .6, s * .1); g.stroke();   // 一道粗白反光
  g.lineWidth = 4; g.globalAlpha = .8; g.beginPath(); g.moveTo(s * .78, s * .5); g.quadraticCurveTo(s * .86, s * .68, s * .74, s * .86); g.stroke();   // 一道细的
  g.globalAlpha = 1; g.shadowBlur = 0;
  g.restore();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const matP = drawMatcap(false), matR = drawMatcap(true);
const loader = new THREE.TextureLoader();
for (const [k, tex] of [['purple', matP], ['red', matR]]) if (MATCAP_URL[k]) loader.load(MATCAP_URL[k], t => {
  t.colorSpace = THREE.SRGBColorSpace; shardU[k === 'purple' ? 'tMatP' : 'tMatR'].value = t; }, undefined, () => {});

/* ---------- 壁纸画在这张画布上（碎片登场时要用它的花纹，所以提前建好；怎么画见后面 drawBg） ---------- */
const bgCanvas = document.createElement('canvas');
const bgTex = new THREE.CanvasTexture(bgCanvas); bgTex.colorSpace = THREE.SRGBColorSpace;
bgTex.wrapS = bgTex.wrapT = THREE.MirroredRepeatWrapping; bgTex.generateMipmaps = false; bgTex.minFilter = THREE.LinearFilter;

/* ---------- 黑曜石碎片 ---------- */
/* 048：开洞登场时，碎片是从屏幕上崩出来的那几块：刚飞出来还贴着原来那块壁纸的花纹（uBurn = 1），一秒内烧成黑曜石（uBurn → 0）。
   uW0 是它崩出来那一刻平躺在屏幕上的位姿：花纹按那一刻每个顶点落在屏幕上的位置去取，所以花纹粘在碎片上跟着飞。每块碎片一份材质。 */
const shardU = { uCoreI: { value: 1 }, uCrimson: { value: 0 }, uSkin: { value: 0 }, uCam: { value: new THREE.Vector3() },
  tMatP: { value: matP }, tMatR: { value: matR }, uEcl: eclU, uCrackI: { value: 0 },
  tBg: { value: bgTex }, uBurn: { value: 0 }, uW0: { value: new THREE.Matrix4() } };
const shardMat = new THREE.ShaderMaterial({ uniforms: shardU, extensions: { derivatives: true },
  vertexShader: `attribute vec3 aEdge; attribute float aCut; uniform mat4 uW0; uniform float uBurn;
  varying vec3 vN; varying vec3 vWP; varying vec3 vVN; varying vec3 vE; varying float vCut; varying vec2 vBgUv;
  void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz; vN = normalize(mat3(modelMatrix)*normal);
    vVN = normalize(normalMatrix*normal); vE = aEdge; vCut = aCut; gl_Position = projectionMatrix*viewMatrix*wp;
    vBgUv = vec2(0.0);
    if (uBurn > 0.0) { vec4 c0 = projectionMatrix*viewMatrix*uW0*vec4(position,1.0); vBgUv = c0.xy/c0.w*0.5 + 0.5; } }`,
  fragmentShader: `uniform float uCoreI,uCrimson,uSkin,uEcl,uCrackI,uBurn; uniform vec3 uCam; uniform sampler2D tMatP,tMatR,tBg;
  varying vec3 vN; varying vec3 vWP; varying vec3 vVN; varying vec3 vE; varying float vCut; varying vec2 vBgUv;
  /* 合成时整个场景要过一道 ACES 曲线；带花纹的碎片先反算回去，过完曲线才和原来的壁纸一个颜色 */
  vec3 invAces(vec3 y){ y = clamp(y, 0.0, 0.98); vec3 A = 2.51 - 2.43*y, B = 0.03 - 0.59*y, Cc = -0.14*y;
    return (-B + sqrt(B*B - 4.0*A*Cc))/(2.0*A); }
  void main(){
    if (vCut > 0.5) {                                                                    // 切面：被缝里的红光照亮。缝口暗，越往里越亮
      float deep = smoothstep(0.0, 0.45, min(vE.x, min(vE.y, vE.z)));
      float lump = 0.72 + 0.28*sin(dot(vWP, vec3(83.0,61.0,47.0)));                      // 沿着缝有明有暗，不是一根匀称的灯管
      gl_FragColor = vec4(vec3(1.0,0.004,0.012)*uCrackI*6.0*mix(0.08, 1.0, deep)*lump, 1.0); return; }
    float lit = 1.0 - uEcl;                                                              // 日食时核心不发光
    vec3 N = normalize(vN); vec3 L = -vWP; float d = length(L); L /= max(d,1e-4);
    vec3 V = normalize(uCam - vWP);
    float ndl = dot(N,L), facing = max(ndl,0.0);
    vec3 glow = mix(${C.purple}, ${C.crimson}, uCrimson);
    float att = uCoreI/(0.30 + 3.2*d*d);
    float rim = pow(1.0 - clamp(dot(N,V),0.0,1.0), 3.0);
    vec3 col;
    if (uSkin < 0.5) {
      vec3 Hh = normalize(L+V);
      float spec = pow(max(dot(N,Hh),0.0), 120.0) * step(0.0, ndl);
      vec3 specC = mix(vec3(0.95,0.8,1.0), vec3(1.0,0.6,0.6), uCrimson);
      col = vec3(0.0035,0.003,0.005) + glow*pow(facing,1.4)*att*1.1*lit + specC*spec*att*4.0*lit;
    } else {
      vec2 muv = normalize(vVN).xy*0.48 + 0.5;
      vec3 mc = mix(texture2D(tMatP,muv).rgb, texture2D(tMatR,muv).rgb, uCrimson);
      col = mc*(0.45 + 1.5*pow(facing,1.3)*lit)*(0.35 + 0.65*min(att,1.6)*lit)*1.3;
    }
    col += mix(vec3(0.32,0.0,0.035), vec3(0.5,0.0,0.03), uCrimson) * rim * 0.16 * min(uCoreI,1.6);
    float front = dot(vWP, normalize(uCam));
    col *= mix(1.0, 0.25, smoothstep(0.15, -0.65, front));
    if (uBurn > 0.0) {                                                                   // 048：还贴着壁纸的花纹，正在烧
      float sh = 0.68 + 0.42*max(dot(N, normalize(vec3(-0.45,0.62,0.64))), 0.0);          // 一点明暗，看得出是一块有厚度的碎片
      vec3 wall = invAces(min(texture2D(tBg, vBgUv).rgb*sh, vec3(0.84)));                // 不超过辉光的门槛，不发光
      col = mix(col, wall, uBurn);
      float e = 1.0 - smoothstep(0.0, 0.1, min(vE.x, min(vE.y, vE.z)));                  // 贴着棱的一圈
      col += vec3(0.42,0.0,0.012)*e*uBurn*(1.0 - uBurn)*4.0*2.2;                         // 烧到一半时边上闪一下暗红
    }
    gl_FragColor = vec4(col,1.0);
  }` });

/* 切面用：每个三角形记下「离真的棱（也就是缝口）有多远」；同一个平面上拼起来的两个三角形之间那条边不算棱 */
function addEdgeAttr(geo) {
  const p = geo.attributes.position, nor = geo.attributes.normal, nT = p.count / 3, map = new Map(), E = new Float32Array(p.count * 3);
  const key = i => `${Math.round(p.getX(i) * 1e5)},${Math.round(p.getY(i) * 1e5)},${Math.round(p.getZ(i) * 1e5)}`;
  const ek = (a, b) => { const ka = key(a), kb = key(b); return ka < kb ? ka + '|' + kb : kb + '|' + ka; };
  for (let t = 0; t < nT; t++) for (let e = 0; e < 3; e++) { const k = ek(t * 3 + (e + 1) % 3, t * 3 + (e + 2) % 3); if (!map.has(k)) map.set(k, []); map.get(k).push(t); }
  for (let t = 0; t < nT; t++) {
    for (let v = 0; v < 3; v++) E[(t * 3 + v) * 3 + v] = 1;
    for (let e = 0; e < 3; e++) {                                   // 第 e 条边对着第 e 个顶点
      const o = map.get(ek(t * 3 + (e + 1) % 3, t * 3 + (e + 2) % 3)).find(x => x !== t);
      const flat = o !== undefined && nor.getX(t * 3) * nor.getX(o * 3) + nor.getY(t * 3) * nor.getY(o * 3) + nor.getZ(t * 3) * nor.getZ(o * 3) > 0.9995;
      if (flat) { E[(t * 3 + (e + 1) % 3) * 3 + e] = 1; E[(t * 3 + (e + 2) % 3) * 3 + e] = 1; }
    }
  }
  geo.setAttribute('aEdge', new THREE.BufferAttribute(E, 3));
}

function bladeGeometry(L) {
  const w = L * rr(0.22, 0.36), t = L * rr(0.08, 0.14), V = THREE.Vector3, pts = [];
  pts.push(new V(L * 0.5, rr(-0.15, 0.15) * w, rr(-0.2, 0.2) * t));                       // 尖头
  pts.push(new V(-L * 0.5 * rr(0.55, 1.0), rr(-0.5, 0.5) * w, rr(-0.4, 0.4) * t));       // 断口那头
  const n = 7 + Math.floor(rng() * 5);
  for (let i = 0; i < n; i++) {
    const x = L * rr(-0.42, 0.38), prof = Math.pow(1 - Math.abs(x / (L * 0.52)), 0.9);
    const side = i % 2 ? 1 : -1;
    pts.push(new V(x, side * w * prof * rr(0.35, 1.0), (rng() * 2 - 1) * t * prof));
  }
  pts.push(new V(L * rr(-0.15, 0.15), rr(0.9, 1.5) * w * (rng() < .5 ? 1 : -1), 0));         // 一个倒刺
  const geo = new ConvexGeometry(pts);
  const uniq = []; const pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++) { const v = new V().fromBufferAttribute(pa, i); if (!uniq.some(u => u.distanceToSquared(v) < 1e-8)) uniq.push(v); }
  return { geo, verts: uniq };
}
function orbitBasis(tiltMax) {
  const n = new THREE.Vector3(0, 1, 0)
    .applyAxisAngle(new THREE.Vector3(1, 0, 0), rr(-tiltMax, tiltMax))
    .applyAxisAngle(new THREE.Vector3(0, 0, 1), rr(-0.45, 0.45)).normalize();
  const u = new THREE.Vector3(1, 0, 0).cross(n).normalize(); if (u.lengthSq() < 1e-6) u.set(0, 0, 1);
  const v = n.clone().cross(u).normalize(); return { u, v };

/* ---------- 施工态裂开：主碎片预先真的切成 3 到 5 瓣（不是在表面画纹路） ---------- */

  {                                               // 048：吸暗的外缘跟着洞口一起缩放（退场三档、聆听外扩都跟着），登场时从洞口往外漫开
    const holePx = st.holeR * R * DPR, fullOut = holePx * Math.max(P.holeFall, P.holeR * 1.1) / P.holeR;
    compU.uFallOut.value = dbg.noFall ? holePx : holePx + (fullOut - holePx) * st.fallSp;
    compU.uRingOn.value = P.ring ? 1 : 0;
    compU.uBumpA.value = st.bump; compU.uBumpR.value = R * DPR;
    compU.uCrkR.value = st.crkR * R * DPR; compU.uCrkA.value = st.crkA; compU.uHair.value = st.hair;
  }
  compU.uRingA.value = st.simT * 0.26 + 0.9; compU.uRingI.value = 3.4 * P.bright; compU.uT.value = st.simT; compU.uCrk.value = ck > 0 && !hid ? 0.34 : 0;
  compU.uExp.value = 1 + st.flash * 0.3; compU.uSeed.value = (st.simT * 60) % 97;
  pass(compM, null);

  // 面板（每 0.15 秒刷新一次）
  uiClock -= rawDt;
  if (uiClock <= 0) {
    uiClock = 0.15;
    fpsEl.textContent = `${fpsShow.toFixed(0)} fps`;
    for (const k in sliders) { const s = sliders[k]; if (k !== 'vol' || !(volDragging || now < volManualUntil)) s.inp.value = P[k];
      s.val.textContent = s.fmt ? s.fmt(P[k]) : (s.step < 1 ? (+P[k]).toFixed(2) : P[k]); }
    if (st.phase === 'exit') { exitBtn.firstChild.textContent = `退场 ${Math.max(1, Math.ceil(3 - st.t))}`; exitBar.style.width = `${Math.min(100, st.t / 3 * 100)}%`; badge.textContent = `面板 · 退场 ${Math.max(1, Math.ceil(3 - st.t))}`; }
    else { exitBtn.firstChild.textContent = '退场'; exitBar.style.width = '0'; badge.textContent = '面板'; }
    const phaseName = { enter: '登场', exit: '退场倒计时', implode: '退场', hidden: '空屏', live: NAMES[st.mode] }[st.phase];
    document.getElementById('eclHint').textContent = P.iso !== 'eclipse' ? '选了「日食」这一档才用得上'
      : P.eclMode === 'eclipse' ? '强制日食：不管壁纸亮不亮，都是黑芯白冕'
      : P.eclMode === 'star' ? '强制恒星：不管壁纸亮不亮，都是原来那颗发光的核'
      : `自动：它脚下的壁纸亮度 ${st.bgLum.toFixed(2)}，` + (st.bgLum > 0.45 ? '高于 0.45 算亮，现在是日食（黑芯白冕）' : '不到 0.45 算暗，现在是恒星（原来那颗发光的核）');
    const j = JSON.stringify({ 状态: phaseName, 背景: P.bg, 隔离: { none: '无', fog: '灰雾', dim: '熄灯', hole: '开洞', eclipse: '日食' }[P.iso],
      熄灯深度: P.dimDepth, 洞口半径: P.holeR, 吸暗范围: P.holeFall, 亮环: P.ring, 慢放: P.slow, 日食档: P.eclMode, 脚下亮度: +st.bgLum.toFixed(2), 掰弯: P.lens, 皮: P.skin, 主碎片: P.shards, 碎屑: P.debris,
      转速: P.speed, 亮度: P.bright, 掰弯强度: P.lensK, 音量: +st.vol.toFixed(2), 陀螺仪: par.gyro, dpr: DPR, R: Math.round(R) });
    if (document.activeElement !== jsonEl) jsonEl.value = j;
  }
}
resize();
/* 048：所有材质开场前先编好（看不见的碎片、核心、电弧、缝里红光那遍都算），编的时候对准真画时的那张画布，
   编出来的才是同一份。不然破屏那一下碎片和核心头一回出现才去编，掌机上那两帧卡 60 毫秒 */
try {
  renderer.setRenderTarget(rtScene); renderer.compile(scene, camera);
  renderer.setRenderTarget(rtCrk); renderer.compile(new THREE.Mesh(new THREE.BufferGeometry(), crkMat), camera);
  renderer.setRenderTarget(null);
} catch (e) { console.warn('precompile', e); }
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

/* 给测试脚本用 */
window.__xb = { sig: () => shards.map(s => s.verts.reduce((a, v) => a + v.x * 3 + v.y * 5 + v.z * 7, 0) + s.r + s.w + s.ph).reduce((a, b) => a + b, 0).toFixed(9), setMode, P, st, fpsLog, ui, drawBg, fold, setBg: b => { P.bg = b; drawBg(); ui(); },
  setIso, dbg, punch: { BRK, PEND }, bgCanvas, bgTex,          // 048：量吸暗时把壁纸刷成一片灰（只给测试脚本用）
  geom: () => ({ cx: W / 2, cy: H / 2 - (st.offY || 0), R, dpr: DPR, W, H, holePx: st.holeR * R }),
  mainShards: () => shards.filter(s => s.main && s.on).map(s => { const v = s.pos.clone().project(camera);
    return { i: shards.indexOf(s), x: (v.x * 0.5 + 0.5) * W, y: (0.5 - v.y * 0.5) * H, r: s.L * 0.5 * R }; }),
  cracks: () => shards.filter(s => s.crk).map(s => ({ 瓣: s.crk.pieces.filter(p => !p.plug).length, 缝: s.crk.seams.length, 厚: +s.crk.thick.toFixed(4), 缝宽: s.crk.seams.map(m => +(m.gap / s.crk.thick).toFixed(3)) })) };
</script>
