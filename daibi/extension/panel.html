<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>代笔僧</title>
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icons/icon-128.png" alt="">
  <div class="top-t">
    <h1 data-t="app.name"></h1>
    <p id="status"></p>
  </div>
</header>

<main id="main">
  <!-- 空状态：一句话 + 用示例试试 -->
  <section class="qs-sec" id="drop">
    <div class="empty">
      <svg class="empty-i" viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="7" width="30" height="34" rx="6"/><path d="M9 17h30M9 27h30M20 7v34"/></svg>
      <h2 data-t="table.drop"></h2>
      <p data-t="table.dropSub"></p>
      <div class="empty-a">
        <button class="qs-btn gray" id="btnDemo" data-t="table.demo"></button>
        <button class="qs-btn plain" id="btnPaste" data-t="table.paste"></button>
      </div>
    </div>
  </section>
  <section class="qs-sec" id="pasteBox" hidden>
    <div class="qs-card paste">
      <textarea id="pasteText" data-t-ph="table.pastePh" spellcheck="false"></textarea>
      <div class="paste-a">
        <button class="qs-btn plain" id="pasteCancel" data-t="table.cancel"></button>
        <button class="qs-btn gray" id="pasteOk" data-t="table.pasteOk"></button>
      </div>
    </div>
  </section>

  <!-- 表格 -->
  <section class="qs-sec" id="tableInfo" hidden>
    <div class="qs-card">
      <div class="tinfo">
        <svg class="tinfo-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3.5"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>
        <div class="tinfo-t"><b id="tName"></b><span id="tMeta"></span></div>
        <button class="qs-btn plain sm" id="btnReload" data-t="table.reload" hidden></button>
        <button class="qs-btn plain sm" id="btnChange" data-t="table.change"></button>
      </div>
      <div class="sheets" id="sheetSeg" role="tablist" data-t-aria="table.sheet" hidden></div>
      <div id="attRow" class="att" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 7.5l-6.7 6.7a1.9 1.9 0 002.7 2.7l7-7a3.8 3.8 0 00-5.4-5.4l-7.2 7.2a5.6 5.6 0 007.9 7.9l6.1-6.1"/></svg>
        <span id="attTxt"></span>
        <button class="qs-btn plain sm" id="btnAttClr" data-t="att.clear" hidden></button>
        <button class="qs-btn gray sm" id="btnAtt" data-t="att.add"></button>
      </div>
    </div>
  </section>
  <input type="file" id="attFile" multiple hidden>
  <input type="file" id="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt,.xls" hidden>

  <!-- 字段 -->
  <section class="qs-sec" id="fieldSec" hidden>
    <div class="qs-sec-h"><span><span data-t="fields.title"></span><span class="host" id="host"></span></span><button class="qs-link" id="btnRematch" data-t="fields.rematch" hidden></button></div>
    <div class="qs-card">
      <div id="fieldEmpty" class="fempty">
        <p id="fieldEmptyTxt" data-t="fields.none"></p>
        <button class="qs-btn gray" id="btnMatch" data-t="fields.match"></button>
      </div>
      <div id="fieldList" class="flist" hidden></div>
    </div>
    <p class="note" id="fieldNote" hidden></p>
  </section>

  <!-- 进度 -->
  <section class="qs-sec" id="rowSec" hidden>
    <div class="qs-sec-h"><span data-t="rows.title"></span><button class="qs-link" id="btnExport" data-t="rows.export"></button></div>
    <div class="qs-card">
      <div class="prog">
        <div class="bar"><i id="barDone"></i><i id="barErr"></i></div>
        <div class="prog-t"><span id="sum"></span>
          <div class="seg" role="tablist" id="seg">
            <button role="tab" data-f="all" aria-selected="true" data-t="rows.all"></button>
            <button role="tab" data-f="error" aria-selected="false"><span data-t="rows.err"></span> <span id="errN"></span></button>
          </div>
        </div>
      </div>
      <ol id="rowList" class="rlist"></ol>
    </div>
  </section>

  <footer class="qs-foot">
    <span data-t="foot.by"></span> · <a id="homeLink" target="_blank" rel="noopener" data-t="common.home"></a><br>
    <span data-t="common.contact"></span> <span class="mail" data-t="common.email"></span>
  </footer>
</main>

<div class="dock" id="dock">
  <div class="qs-card" id="setBox"></div>
  <div class="warn" id="warn" hidden>
    <p id="warnTxt"></p>
    <div class="warn-a"><button class="qs-btn plain sm" id="warnGo" data-t="warn.go"></button><button class="qs-btn gray sm" id="warnPick" data-t="warn.pick"></button></div>
  </div>
  <button class="qs-btn big pri" id="btnMain"></button>
  <button class="qs-btn plain retry" id="btnRetry" hidden></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastAct" hidden></button></div>
<div class="dropmask" aria-hidden="true"><span data-t="table.dropHere"></span></div>

<script src="lib/i18n.js"></script>
<script src="lib/store.js"></script>
<script src="lib/table.js"></script>
<script src="lib/files.js"></script>
<script src="strings.js"></script>
<script src="match.js"></script>
<script src="panel.js"></script>
</body>
</html>
