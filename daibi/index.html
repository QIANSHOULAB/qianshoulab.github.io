<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daibi · Form Filler</title>
<meta name="description" content="Browser extension that fills web forms from Excel or CSV, one row at a time. Columns find their fields on their own; dropdowns, date pickers and iframes included. Your data stays in your browser.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<!-- 字全在 extension/strings.js（site.*，跟侧栏同一个文件）。语言：?lang=zh|en（只管这一次）> 右上角选过的（localStorage daibi.lang）> 默认英文。
     不跟浏览器语言走（Song 11-03 22:19）。<html lang>、<title>、简介在画页面之前就换好 -->
<script src="extension/lib/i18n.js?v=0.4.1"></script>
<script src="extension/strings.js?v=0.4.1"></script>
<script src="extension/lib/feedback.js?v=0.4.1"></script>
<script>
(function(){
  var q=(location.search.match(/[?&]lang=(zh|en)\b/)||[])[1], s=null;
  try{s=localStorage.getItem("daibi.lang")}catch(e){}
  QSLib.i18n.setLang(q||s||"en");
  document.title=QSLib.i18n.t("site.title");
  document.querySelector('meta[name="description"]').content=QSLib.i18n.t("site.desc");
})();
</script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --doubt:rgba(255,204,0,.22);
  --accent:#3A4150; --on-accent:#ffffff; --accent-fg:#3A4150;
  --r-card:18px; --r-btn:12px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  --glass:rgba(255,255,255,.98);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --shadow:none;
  --accent:#E6E9EF; --on-accent:#0b0d12; --accent-fg:#C3CAD6;
  --glass:rgba(28,28,30,.98);
  color-scheme:dark;
}}
/* 英文：西文字体在前（Windows 上英文不走雅黑的西文字形）；中文不变 */
html[lang=en]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent-fg);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;height:auto;display:block}
h1,h2,.lede,.sub,.note,.num span{text-wrap:balance}
.card p,.steps li>div{text-wrap:pretty}
.nav{position:sticky;top:0;z-index:10;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc(50% - 490px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);font-size:13px}
.nav b{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.nav b img{width:24px;height:24px}
.nav a{color:var(--fg-2);min-height:44px;display:flex;align-items:center}
.nav-r{display:flex;align-items:center;gap:16px}
.lang-seg{display:flex;flex:none;gap:2px;padding:2px;border-radius:var(--r-chip);background:var(--fill)}
.lang-seg button{position:relative;min-width:40px;height:26px;padding:0 8px;border:0;border-radius:6px;background:none;font:600 12px/1 var(--font);color:var(--fg-2);cursor:pointer}
.lang-seg button::after{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.lang-seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
@media (prefers-color-scheme:dark){.lang-seg button[aria-pressed=true]{background:#636366;box-shadow:none}}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:64px 0 0}
.hero .icon{width:96px;height:96px;margin:0 auto 24px}
.hero h1{font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1.1;margin:0}
html[lang=en] .hero h1,html[lang=en] h2,html[lang=en] .num b{letter-spacing:-.02em}
.hero .tag{font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.2;margin:8px 0 0}
.hero .lede{max-width:600px;margin:16px auto 0;color:var(--fg-2);font-size:17px}
.hero .lede span{display:inline-block}
.cta{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border-radius:14px;font-size:17px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{text-decoration:none;filter:brightness(1.12)}
.more{font-size:17px;min-height:44px;display:inline-flex;align-items:center}
.meta{margin-top:16px;color:var(--fg-3);font-size:13px}
.shot{margin:48px auto 0}
.shot img{border-radius:12px;box-shadow:0 0 0 .5px var(--line),0 24px 64px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.shot img{box-shadow:0 0 0 .5px var(--line)}}
section{padding:96px 0 0}
h2{font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.15;margin:0;text-align:center}
.sub{text-align:center;color:var(--fg-2);font-size:17px;margin:12px auto 0;max-width:600px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{background:var(--bg-group);border-radius:var(--r-card);padding:24px}
@media (prefers-color-scheme:dark){.card{background:var(--card)}}
.card svg{width:32px;height:32px;fill:none;stroke:var(--accent-fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:600}
.card p{margin:0;color:var(--fg-2);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
.num{text-align:center;padding:8px}
.num b{display:block;font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{display:block;margin-top:8px;color:var(--fg-2);font-size:13px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;align-items:start}
.four figure{margin:0}
.four img{border-radius:var(--r-card);box-shadow:0 0 0 .5px var(--line),0 8px 24px rgba(0,0,0,.06)}
.four figcaption{margin-top:12px;color:var(--fg-2);font-size:13px;text-align:center}
.steps{list-style:none;padding:0;margin:48px auto 0;max-width:680px;background:var(--bg-group);border-radius:var(--r-card);overflow:hidden;counter-reset:s}
@media (prefers-color-scheme:dark){.steps{background:var(--card)}}
.steps li{counter-increment:s;position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:16px 24px;font-size:15px}
.steps li+li::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--line)}
.steps li::after{content:counter(s);grid-row:1;grid-column:1;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--fg);font-weight:600;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.steps li>div{grid-column:2;grid-row:1}
.steps code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--fill);padding:2px 8px;border-radius:var(--r-chip);user-select:all}
.steps small{display:block;color:var(--fg-2);font-size:13px;margin-top:4px}
.note{text-align:center;color:var(--fg-2);font-size:15px;margin:24px auto 0;max-width:600px}
footer{margin-top:96px;padding:32px 16px 48px;border-top:.5px solid var(--line);text-align:center;color:var(--fg-3);font-size:12px;line-height:2}
footer .mail{user-select:text;-webkit-user-select:text;color:var(--fg-2)}
footer a{color:var(--fg-2)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,1fr);row-gap:32px}
  .four{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:480px){
  .hero{padding-top:48px}
  section{padding-top:64px}
  .four{grid-template-columns:1fr;max-width:320px;margin-left:auto;margin-right:auto}
  .num b{font-size:32px}
}
</style>
</head>
<body>
<nav class="nav"><b><img src="img/icon.png" alt=""><span data-t="app.name"></span></b><span class="nav-r"><a href="https://qianshoulab.github.io/" data-t="site.home"></a><span class="lang-seg" id="langSeg"></span></span></nav>

<main class="wrap">
  <header class="hero">
    <img class="icon" src="img/icon.png" width="96" height="96" alt="">
    <h1 data-t="app.name"></h1>
    <p class="tag" data-t="app.tag"></p>
    <p class="lede"><span data-t="site.lede1"></span> <span data-t="site.lede2"></span></p>
    <div class="cta">
      <a class="btn pri" id="dl" href="dist/daibi-0.4.1.zip" download data-t="site.download"></a>
      <a class="more" href="#install" data-t="site.how"></a>
    </div>
    <p class="meta" data-t="site.meta"></p>
    <div class="shot"><img data-img="hero.jpg" width="1600" height="1000" data-t-alt="site.heroAlt"></div>
  </header>

  <section>
    <h2 data-t="site.s1h"></h2>
    <p class="sub" data-t="site.s1p"></p>
    <div class="grid">
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="4" width="20" height="24" rx="4"/><path d="M6 12h20M6 20h20M13 4v24"/></svg>
        <h3 data-t="site.c1h"></h3>
        <p data-t="site.c1p"></p>
      </div>
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="16" cy="16" r="3.5"/></svg>
        <h3 data-t="site.c2h"></h3>
        <p data-t="site.c2p"></p>
      </div>
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 17l5 5 11-12"/></svg>
        <h3 data-t="site.c3h"></h3>
        <p data-t="site.c3p"></p>
      </div>
    </div>
  </section>

  <section>
    <h2 data-t="site.s2h"></h2>
    <p class="sub" data-t="site.s2p"></p>
    <div class="nums">
      <div class="num"><b data-t="site.n1"></b><span data-t="site.n1t"></span></div>
      <div class="num"><b data-t="site.n2"></b><span data-t="site.n2t"></span></div>
      <div class="num"><b data-t="site.n3"></b><span data-t="site.n3t"></span></div>
      <div class="num"><b data-t="site.n4"></b><span data-t="site.n4t"></span></div>
    </div>
  </section>

  <section>
    <h2 data-t="site.s3h"></h2>
    <p class="sub" data-t="site.s3p"></p>
    <div class="four">
      <figure><img data-img="panel-ready.png" width="760" height="1520" loading="lazy" data-t-alt="site.f1"><figcaption data-t="site.f1"></figcaption></figure>
      <figure><img data-img="panel-run.png" width="760" height="1520" loading="lazy" data-t-alt="site.f2"><figcaption data-t="site.f2"></figcaption></figure>
      <figure><img data-img="panel-error.png" width="760" height="1520" loading="lazy" data-t-alt="site.f3"><figcaption data-t="site.f3"></figcaption></figure>
      <figure><img data-img="panel-dark.png" width="760" height="1520" loading="lazy" data-t-alt="site.f4"><figcaption data-t="site.f4"></figcaption></figure>
    </div>
  </section>

  <section id="install">
    <h2 data-t="site.s4h"></h2>
    <p class="sub" data-t="site.s4p"></p>
    <ol class="steps">
      <li><div data-th="site.i1"></div></li>
      <li><div data-th="site.i2"></div></li>
      <li><div data-th="site.i3"></div></li>
      <li><div data-th="site.i4"></div></li>
      <li><div data-th="site.i5"></div></li>
    </ol>
    <p class="note" data-t="site.note"></p>
  </section>
</main>

<footer>
  <span data-t="site.foot"></span> · <a href="https://qianshoulab.github.io/" data-t="common.home"></a> · <a class="fb" id="fb" href="#" data-t="fb.label"></a><br>
  <span data-t="common.contact"></span> <span class="mail" data-t="common.email"></span>
</footer>
<script>
/* 画字、换语言。截图按语言各一套：英文在 img/en/，中文在 img/ */
(function () {
  const I = QSLib.i18n, VER = '0.4.1';
  // 提意见：mailto 全填好，标题和正文照当前语言，最后一行版本 · 系统 · 浏览器
  const fbSet = QSFeedback.wire(document.getElementById('fb'), () => ({ subject: I.t('fb.subject', { v: VER }), body: I.t('fb.body'), version: VER }));
  function draw() {
    I.apply(document, { v: VER });
    document.title = I.t('site.title');
    document.querySelector('meta[name="description"]').content = I.t('site.desc');
    const dir = I.lang === 'en' ? 'img/en/' : 'img/';
    document.querySelectorAll('img[data-img]').forEach(im => { const u = dir + im.dataset.img; if (im.getAttribute('src') !== u) im.src = u; });
    I.toggle(document.getElementById('langSeg'), l => { I.setLang(l); try { localStorage.setItem('daibi.lang', I.lang); } catch (e) {} draw(); });
    fbSet();
  }
  draw();
})();
</script>
</body>
</html>
