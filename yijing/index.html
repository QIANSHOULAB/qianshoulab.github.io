<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>译经僧</title>
<meta name="description" content="把 A 系统导出的文件翻成 B 系统的导入格式：自动对列、改日期、拆姓名、加国家码、换值，预览后一键导出。文件不出浏览器。">
<meta name="apple-mobile-web-app-title" content="译经僧">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Layout: glass nav; hero; two "ends" cards (source → target); mapping list (one row per target column); preview table; sticky export dock */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --elev:#F2F2F7; --elev-card:#FFFFFF;
  --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16);
  --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --sep:rgba(60,60,67,.17);
  --accent:#0071E3; --accent-tint:rgba(0,113,227,.10); --on-accent:#FFFFFF;
  --amber:#FF9500; --amber-ink:#A85100; --amber-tint:rgba(255,149,0,.14);
  --good:#1F7A36; --good-mark:#34C759; --good-tint:rgba(52,199,89,.16);
  --bad:#D70015; --bad-mark:#FF3B30; --bad-tint:rgba(255,59,48,.10);
  --glass:rgba(242,242,247,.8); --glass2:rgba(255,255,255,.78); --scrim:rgba(0,0,0,.3);
  --toast-bg:rgba(29,29,31,.92); --toast-fg:#F5F5F7;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 20px rgba(0,0,0,.05);
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --elev:#1C1C1E; --elev-card:#2C2C2E;
    --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32);
    --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:rgba(84,84,88,.6);
    --accent:#0A84FF; --accent-tint:rgba(10,132,255,.18);
    --amber:#FF9F0A; --amber-ink:#FFB340; --amber-tint:rgba(255,159,10,.18);
    --good:#30D158; --good-mark:#30D158; --good-tint:rgba(48,209,88,.20);
    --bad:#FF6961; --bad-mark:#FF453A; --bad-tint:rgba(255,69,58,.18);
    --glass:rgba(18,18,20,.72); --glass2:rgba(28,28,30,.78); --scrim:rgba(0,0,0,.55);
    --toast-bg:rgba(58,58,60,.95); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --elev:#1C1C1E; --elev-card:#2C2C2E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32);
  --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-tint:rgba(10,132,255,.18);
  --amber:#FF9F0A; --amber-ink:#FFB340; --amber-tint:rgba(255,159,10,.18);
  --good:#30D158; --good-mark:#30D158; --good-tint:rgba(48,209,88,.20);
  --bad:#FF6961; --bad-mark:#FF453A; --bad-tint:rgba(255,69,58,.18);
  --glass:rgba(18,18,20,.72); --glass2:rgba(28,28,30,.78); --scrim:rgba(0,0,0,.55);
  --toast-bg:rgba(58,58,60,.95); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:400 17px/1.35 var(--f-text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
button:focus:not(:focus-visible){outline:none}
svg{display:block}

/* nav */
.nav{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:50px;padding:0 max(16px,calc(50% - 520px));transition:background-color .2s,box-shadow .2s}
.nav.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-back{justify-self:start;display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:17px;height:44px;margin-left:-4px}
.nav-back svg{width:11px;height:19px}
.nav-t{font-weight:600;opacity:0;transition:opacity .2s}
.nav.scrolled .nav-t{opacity:1}
.nav-a{justify-self:end;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:15px;font-weight:600;height:34px;padding:0 14px;border-radius:999px;background:var(--fill)}
.nav-a svg{width:16px;height:16px}
.nav-a .n{font-size:13px;color:var(--fg2);font-weight:600}

/* page */
.wrap{max-width:1072px;margin:0 auto;padding:0 16px 128px}
.lt{padding:4px 4px 20px}
.lt h1{margin:0;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.005em}
.tag{margin:4px 0 0;color:var(--fg2);font-size:17px}
.hint{margin:10px 0 0;color:var(--fg2);font-size:13px;display:flex;align-items:center;gap:6px}
.hint svg{width:14px;height:14px;color:var(--good-mark);flex:none}
@media (min-width:760px){.lt{padding:20px 4px 28px}.lt h1{font-size:48px;letter-spacing:-.01em}.tag{font-size:21px}}

/* ends */
.ends{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch}
@media (min-width:760px){.ends{grid-template-columns:1fr 36px 1fr;gap:0}}
.end{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px 16px 16px 18px;box-shadow:var(--shadow);min-width:0;transition:box-shadow .2s,transform .2s}
.end-ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.end-ico svg{width:22px;height:22px}
.end.tgt .end-ico{background:var(--good-tint);color:var(--good)}
.end-main{flex:1;min-width:0}
.end-k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg2)}
.end-t{font-size:17px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end-s{font-size:13px;color:var(--fg2);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{display:grid;place-items:center;color:var(--fg3)}
.arrow svg{width:18px;height:18px}
@media (max-width:759px){.arrow{display:none}}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;background:var(--fill);color:var(--fg2)}
.chip.demo{background:var(--accent-tint);color:var(--accent)}
.chip.rec{background:var(--good-tint);color:var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:var(--accent-tint);color:var(--accent)}
.btn.plain{color:var(--accent)}
.btn.small{min-height:34px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}

/* groups */
.grp{margin-top:32px}
.grp-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px 10px}
.grp-h h2{margin:0;font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp-sub{font-size:15px;font-weight:400;color:var(--fg2);font-variant-numeric:tabular-nums}
.grp-sub b{font-weight:600}
.grp-sub .g{color:var(--good)} .grp-sub .a{color:var(--amber-ink)} .grp-sub .r{color:var(--bad)}
.grp-foot{margin:10px 0 0;padding:0 16px;font-size:13px;color:var(--fg2)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

/* mapping rows */
.mhead{display:none}
.mrow{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) 12px;grid-template-areas:"st t ch" ". s ch" ". x ch";column-gap:12px;row-gap:2px;align-items:center;width:100%;padding:12px 16px;min-height:60px;transition:background-color .15s}
.mrow:active,.mrow:hover{background:var(--fill)}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.st{grid-area:st;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.st svg{width:12px;height:12px}
.st.sure{background:var(--good-mark)} .st.guess{background:var(--amber)} .st.blank{background:var(--fill2);color:var(--fg2)} .st.req{background:var(--bad-mark)} .st.user{background:var(--accent)}
.m-t{grid-area:t;font-weight:600;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.m-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-t .ty{flex:none;font-style:normal;font-size:11px;font-weight:600;color:var(--fg2);background:var(--fill);border-radius:5px;padding:1px 5px}
.m-s{grid-area:s;font-size:15px;color:var(--fg2);min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m-s .from{color:var(--fg)}
.m-s .op{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-tint);border-radius:5px;padding:1px 6px}
.m-s .none{color:var(--fg3)}
.m-s .note{width:100%;font-size:12px;color:var(--amber-ink)}
.m-s .note.r{color:var(--bad)}
.m-x{grid-area:x;font-size:13px;color:var(--fg2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.m-x b{font-weight:500;color:var(--fg)}
.m-x i{font-style:normal;color:var(--fg3);margin:0 4px}
.m-x .bc{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--amber-ink);background:var(--amber-tint);border-radius:5px;padding:1px 6px}
.chev{grid-area:ch;color:var(--fg3)}
.chev svg{width:8px;height:13px}
@media (min-width:760px){
  .mhead{display:grid;grid-template-columns:26px minmax(150px,1fr) minmax(190px,1.25fr) minmax(200px,1.35fr) 12px;column-gap:16px;padding:10px 16px 8px;font-size:12px;font-weight:600;color:var(--fg2);border-bottom:.5px solid var(--sep)}
  .mrow{grid-template-columns:26px minmax(150px,1fr) minmax(190px,1.25fr) minmax(200px,1.35fr) 12px;grid-template-areas:"st t s x ch";column-gap:16px;min-height:54px;padding:10px 16px}
  .m-x{font-size:15px}
}

/* preview table */
.tbl{overflow:auto;max-height:560px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
th,td{padding:8px 12px;text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;border-bottom:.5px solid var(--sep)}
th{position:sticky;top:0;z-index:1;background:var(--card);font-weight:600;color:var(--fg);box-shadow:0 .5px 0 var(--sep)}
th small{display:block;font-weight:400;color:var(--fg2);font-size:11px}
td.n,th.n{color:var(--fg3);text-align:right;padding-right:4px;position:sticky;left:0;background:var(--card);z-index:1}
th.n{z-index:2}
td.e{color:var(--fg3)}
td.bad{background:var(--amber-tint);color:var(--amber-ink)}
tr:last-child td{border-bottom:0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass2);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding:10px 16px max(10px,env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock-f{flex:1;min-width:0;font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{min-height:44px}
@media (max-width:759px){.dock-f{display:none}.dock .btn.primary{flex:1}}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill);flex:none}
.seg button{min-height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* footer */
.foot{margin-top:48px;padding:0 4px;font-size:12px;line-height:1.8;color:var(--fg2);text-align:center}
.foot a{color:var(--accent)}
.mail{-webkit-user-select:all;user-select:all;color:var(--fg)}

/* sheets */
#sheets{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;background:var(--elev);border-radius:24px 24px 0 0;transform:translateY(104%);transition:transform .42s cubic-bezier(.32,.72,0,1);padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
#sheets.open .scrim{opacity:1}
#sheets.open .sheet{transform:none}
@media (min-width:760px){
  .sheet{top:50%;bottom:auto;max-height:84vh;border-radius:20px;transform:translateY(-46%) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;box-shadow:0 30px 80px rgba(0,0,0,.25)}
  #sheets.open .sheet{transform:translateY(-50%);opacity:1}
  .grab{display:none}
}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);opacity:.6;margin:6px auto 0}
.sh-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:0 16px;background:var(--elev)}
.sh-x{justify-self:start;color:var(--accent);font-size:17px;min-height:44px}
.sh-ok{justify-self:end;color:var(--accent);font-size:17px;font-weight:600;min-height:44px}
.sh-t{font-size:17px;font-weight:600;text-align:center;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{display:flex;flex-direction:column;gap:10px;padding:4px 16px 8px}
.lab{font-size:13px;color:var(--fg2);padding:8px 16px 0;display:flex;justify-content:space-between;gap:8px}
.form{background:var(--elev-card);border-radius:14px;overflow:hidden}
.f-row{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px}
.form>.f-row+.f-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.f-k{flex:none;font-size:17px}
.f-row input,.f-row select{flex:1;min-width:0;height:46px;border:0;background:transparent;outline:none;text-align:right;font-size:17px;color:var(--fg)}
.f-row select{text-align:right;text-align-last:right;cursor:pointer;color:var(--accent);-webkit-appearance:none;appearance:none}
.f-row input::placeholder{color:var(--fg3)}
.f-row .x{color:var(--fg3);flex:none;width:28px;height:28px;display:grid;place-items:center}
.f-row .x svg{width:14px;height:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:34px;padding:0 13px;border-radius:999px;background:var(--elev-card);font-size:15px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);margin-left:auto;transition:background-color .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .22s}
.switch[aria-checked="true"]{background:var(--good-mark)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.vmap .f-row{gap:10px}
.vmap .vk{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.vmap .vk small{color:var(--fg3);margin-left:6px;font-variant-numeric:tabular-nums}
.vmap input{flex:0 0 42%;text-align:left;border-radius:8px;background:var(--fill);height:34px;padding:0 10px;font-size:15px}
.vmap .ar{color:var(--fg3);flex:none}
.vmap .vnil{flex:0 0 42%;height:34px;line-height:34px;padding:0 10px;font-size:15px;color:var(--fg3)}
.vmap select.vm{flex:none;width:auto;height:34px;font-size:13px;font-weight:500;color:var(--fg2);text-align:right;text-align-last:right;padding:0 0 0 4px}
.vmap .f-row.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:2px 16px 10px;font-size:13px;color:var(--fg2)}
.vmap .f-row.rule::before{display:none}
.vmap .f-row.rule select,.vmap .f-row.rule input{width:100%;min-width:0;height:34px;font-size:15px;text-align:left;text-align-last:left;border-radius:8px;background:var(--fill);padding:0 10px}
.vmap .f-row.rule .ar{text-align:right}
.tidy{background:var(--card)}
.tidy .f-row{min-height:62px}
.list.tidy .li b,.list.tidy .li small{white-space:normal}
.tidy .li{gap:2px}
.pv{font-size:13px}
.pv .f-row{min-height:38px;font-variant-numeric:tabular-nums}
.pv .a{flex:1;min-width:0;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .b{flex:1;min-width:0;text-align:right;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .b.bad{color:var(--amber-ink)}
.pv .ar{color:var(--fg3);flex:none}
.list .f-row{min-height:56px}
.list .li{flex:1;min-width:0;padding:8px 0;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.list .li b{font-weight:400;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .li small{font-size:13px;color:var(--fg2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .ck{color:var(--accent);flex:none}
.list .ck svg{width:16px;height:16px}
.empty-note{font-size:15px;color:var(--fg2);text-align:center;padding:24px 16px}
.sh-foot{font-size:13px;color:var(--fg2);padding:0 16px}

/* drop overlay */
#drop{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.dz{border-radius:24px;border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700;text-align:center;transition:background-color .15s}
.dz small{display:block;font-size:15px;font-weight:400;opacity:.85;margin-top:6px}
.dz.on{background:rgba(0,113,227,.45);border-style:solid}

/* toast & busy */
.toast{position:fixed;left:50%;bottom:86px;z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--toast-bg);color:var(--toast-fg);font-size:15px;transition:opacity .2s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#64B5FF;font-weight:600;white-space:nowrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

function guessFmt(ex) {

  if (/^\d{4}-\d{2}-\d{2}$/.test(ex)) return 'YYYY-MM-DD';
  if (/^\d{4}\/\d{1,2}\/\d{1,2}/.test(ex)) return 'YYYY/MM/DD';

  if (k === 'unit') { m.op.unit = el.value; return refreshCol(true); }
  if (k === 'mmode') {
    const p = m.op.pairs[+el.dataset.k], v = el.value;
    if (v === 'v') p[1] = ''; else if (v === 'nil') p[1] = null;
    else { const H = S.src.headers, aj = H.findIndex(h => (conceptOf(h) || {}).c === 'acode'); p[1] = { by: H[aj >= 0 ? aj : H.findIndex((_, x) => x !== m.src[0])] || H[0], pre: '', v: '', els: '' }; }
    return refreshCol(true);
  }
  if (k === 'rby') { m.op.pairs[+el.dataset.k][1].by = el.value; return refreshCol(false); }
  if (k === 'dfrom') m.op.from = el.value;
  if (k === 'dto') m.op.to = el.value;
  if (k === 'dec') m.op.dec = el.value === 'keep' ? 'keep' : +el.value;
  if (['dfrom', 'dto', 'dec'].includes(k)) refreshCol(false);
});
sheetEl.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in; if (!k || sheetCol < 0) return;
  const m = S.maps[sheetCol];
  if (k === 'const') m.cnst = el.value;
  else if (k === 'sep') m.op.sep = el.value;
  else if (k === 'cc') m.op.cc = el.value.replace(/\D/g, '');
  else if (k === 'map') m.op.pairs[+el.dataset.k][1] = el.value;
  else if (k === 'lsep') m.op.sep = el.value;
  else if (k === 'rpre' || k === 'rv' || k === 'rels') m.op.pairs[+el.dataset.k][1][{ rpre: 'pre', rv: 'v', rels: 'els' }[k]] = el.value;
  else return;
  refreshCol(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && sheetKind === 'save' && e.target.id === 'recName') { e.preventDefault(); $('.sh-ok', sheetEl).click(); }
});
$('#fSrc').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadFile(f, 'src'); });
$('#fTgt').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadFile(f, 'tgt'); });
$('#fRec').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); const list = Array.isArray(d) ? d : d.recipes;
    if (!Array.isArray(list) || !list.every(r => r && r.tgt && Array.isArray(r.maps))) throw 0;
    const rs = recipes(), ids = new Set(rs.map(r => r.id));
    list.forEach(r => { if (!ids.has(r.id)) rs.push(r); });
    saveRecipes(rs); render(); if (sheetKind === 'rec') openRecipes(); toast(STR.recImported(list.length));
  } catch (_) { toast(STR.recBadFile); }
});
// 拖放
const drop = $('#drop'); let dragN = 0;
drop.querySelector('[data-zone="src"]').innerHTML = `<div>${STR.dropSrc}<small>${STR.dropSrcS}</small></div>`;
drop.querySelector('[data-zone="tgt"]').innerHTML = `<div>${STR.dropTgt}<small>${STR.dropTgtS}</small></div>`;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN++; drop.hidden = false; });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragN <= 0) { dragN = 0; drop.hidden = true; } });
window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); drop.querySelectorAll('.dz').forEach(z => z.classList.toggle('on', z.contains(e.target))); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; drop.hidden = true;
  const z = e.target.closest && e.target.closest('[data-zone]'); const f = e.dataTransfer.files[0];
  if (f) loadFile(f, z && z.dataset.zone === 'tgt' ? 'tgt' : 'src');
});
// 导航
const nav = $('#nav');
$('#navBack').innerHTML = `${ICON.chevL}<span>${STR.home}</span>`;
$('#navT').textContent = STR.app;
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 30), { passive: true });

/* ================= 开张 ================= */
S.tgt = tplFrom('crm'); S.fmt = 'csv';
setSource(demoSource(), false);
window.__yj = { S, loadFile, autoMap, parseDate, splitName, fmtPhone, parseNum, parseCSV, splitList, listPlan, outRow };
</script>
