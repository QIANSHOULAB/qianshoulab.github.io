<script>
  (function () {
    var S = window.QS_STRINGS, QS = window.QS;
    var addr = ['oilsongchengmin', 'gmail.com'].join('@');       // 拼起来写，少招点垃圾邮件
    function pick(o, path) { return path.split('.').reduce(function (x, k) { return x == null ? x : x[k]; }, o); }
    // 提意见那封信最后一行带上系统和浏览器（简写），人不用自己打
    function device() {
      var u = navigator.userAgent;
      var os = /Windows/.test(u) ? 'Windows' : /iPhone|iPad|iPod/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android'
        : /Mac OS X/.test(u) ? 'macOS' : /CrOS/.test(u) ? 'ChromeOS' : /Linux/.test(u) ? 'Linux' : 'other';
      var br = /Edg\//.test(u) ? 'Edge' : /Firefox\//.test(u) ? 'Firefox' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'other';
      return os + ' · ' + br;
    }
    function fill() {
      var T = S[QS.lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var v = pick(T, el.getAttribute('data-i18n'));
        if (typeof v === 'string') el.innerHTML = v;
      });
      document.querySelectorAll('[data-i18n-attr]').forEach(function (el) {
        el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
          var i = pair.indexOf(':'), v = pick(T, pair.slice(i + 1));
          if (typeof v === 'string') el.setAttribute(pair.slice(0, i), v);
        });
      });
      // 随喜 / Tips：收款页开好（QS_TIP_URL 有值）才变成链接
      if (window.QS_TIP_URL) document.querySelectorAll('.tip').forEach(function (el) {
        var a = document.createElement('a'); a.href = window.QS_TIP_URL; a.target = '_blank'; a.rel = 'noopener'; a.textContent = el.textContent;
        el.replaceWith(a);
      });
      var mail = document.getElementById('mail');
      mail.href = 'mailto:' + addr + '?subject=' + encodeURIComponent(T.mailSubject);
      mail.title = addr;
      var fb = 'mailto:' + addr + '?subject=' + encodeURIComponent(T.fbSubject)
        + '&body=' + encodeURIComponent(T.fbBody.join('\n') + '\n\n\n——\n' + T.fbTag + ' · ' + device());
      document.querySelectorAll('a.fb').forEach(function (a) { a.href = fb; });
      document.querySelectorAll('.lang button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === QS.lang));
      });
    }
    function relayout() {
      if (document.documentElement.getAttribute('data-skin') !== 'b') window.qsRing();
      window.dispatchEvent(new Event('resize'));      // 两个 3D 场景都听 resize：禅圈跟着字重新摆
    }
    QS.fill = fill;
    QS.setLang = function (l) {
      if (!S[l] || l === QS.lang) return;
      QS.lang = l;
      try { localStorage.setItem(QS.key, l); } catch (e) {}
      QS.head(); fill(); relayout();
    };
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () { QS.setLang(b.getAttribute('data-l')); });
    });
    fill();
    if (document.documentElement.getAttribute('data-skin') !== 'b') window.qsRing();
  })();
</script>
<script type="module">
  import('./scene-' + (document.documentElement.getAttribute('data-skin') || 'a') + '.js');
</script>
