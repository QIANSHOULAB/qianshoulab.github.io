<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zhike · Inbox Sorter — orders and invoices, straight into Excel</title>
<meta name="description" content="Zhike is a free Windows app that sorts your inbox. Connect your mailbox, it drafts the rules, you hit Accept. Order numbers, amounts and dates land in Excel, the right emails get forwarded, replies get drafted but never sent. Your mail never leaves your PC.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="app/ui/strings.js?v=0.4.1"></script>
<style>
/* 照 _ops/设计规范.md：系统字、一个主色（知客僧赭）、其余全灰；居中单栏最宽 980；首屏一句大标题、一句副标题、主操作 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --accent:#c2552a; --accent-press:#b04a22; --link:#ad4a22; --on-accent:#ffffff;
  --r-card:18px; --r-btn:12px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  --glass:rgba(255,255,255,.98);   /* 顶栏压在滚过去的字上：压到 .98，底下的字看不清 */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --accent:#c2552a; --accent-press:#cf6236; --link:#f08a5d;
  --shadow:none; --glass:rgba(28,28,30,.98); color-scheme:dark;
}}
/* 英文：西文字体排前面（Windows 上不然会用雅黑的西文字形）；中文那套不变 */
html[lang="en"]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg-group);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%;height:auto}
p{text-wrap:pretty}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.nav{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:48px;font-size:13px}
.nav a{color:var(--fg-2);display:inline-flex;align-items:center;min-height:44px;white-space:nowrap}
.nav a:hover{color:var(--fg);text-decoration:none}
.nav b{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:600;font-size:15px;margin:0 auto;white-space:nowrap}
.nav b img{width:24px;height:24px}
/* 右上角 EN / 中文：选过就记住（localStorage 的 zhike.lang）；网址带 ?lang=zh|en 先听网址 */
.lang{display:flex;flex:none;background:var(--fill);border-radius:var(--r-field);padding:2px;gap:2px}
.lang button{position:relative;height:28px;min-width:44px;padding:0 10px;border:0;border-radius:var(--r-chip);background:none;color:var(--fg);font:400 13px/1 var(--font);cursor:pointer;transition:background-color var(--t) var(--ease)}
.lang button::after{content:"";position:absolute;inset:-8px -1px}  /* 点得到的地方够 44 高 */
.lang button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.lang button[aria-pressed="true"]{background:#636366}}
.hero{text-align:center;padding:64px 0 32px}
.hero .ic{width:96px;height:96px;margin:0 auto 24px}
.hero h1{margin:0;font-size:clamp(40px,6vw,64px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.hero h1 span{white-space:nowrap}
.hero .sl{margin:12px 0 0;font-size:clamp(22px,3vw,28px);line-height:1.2;font-weight:600;text-wrap:balance}
:lang(zh) .hero .sl span{white-space:nowrap}   /* 中文：「快递单」别被拆成两行；英文本来就在空格处换行 */
.hero .tg{margin:12px auto 0;max-width:560px;font-size:17px;color:var(--fg-2);text-wrap:balance}
:lang(en) .hero h1,:lang(en) h2{letter-spacing:-.02em}
h2{text-wrap:balance}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:14px;font-size:17px;font-weight:600;background:var(--fill);color:var(--fg);white-space:nowrap;transition:background var(--t) var(--ease)}
.btn:hover{background:var(--fill-2);text-decoration:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-press)}
.btn svg{width:20px;height:20px}
.meta{margin-top:12px;font-size:13px;color:var(--fg-3)}
.shot{margin:48px auto 0;border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
@media (prefers-color-scheme:dark){.shot,.pic{box-shadow:0 0 0 1px var(--line)}}
.sec{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:center;padding:64px 0}
.sec+.sec{border-top:1px solid var(--line)}
.sec.flip{grid-template-columns:1.3fr 1fr}
.sec.flip .txt{order:2}
.sec h2{margin:0;font-size:clamp(28px,4vw,34px);line-height:1.2;font-weight:700}
.sec p{margin:12px 0 0;color:var(--fg-2)}
.pic{border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow)}
.steps li b{display:block;font-weight:600}
.steps li span{display:block;color:var(--fg-2);font-size:15px}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:600 15px/1 var(--font);font-style:normal;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:32px 0 64px;border-radius:var(--r-card);overflow:hidden;background:var(--line);box-shadow:var(--shadow)}
.g{background:var(--card);padding:24px}
.g b{display:block;font-size:17px;font-weight:600}
.g span{display:block;margin-top:4px;font-size:15px;color:var(--fg-2)}
.inst{background:var(--card);border-radius:var(--r-card);padding:32px clamp(16px,5vw,48px);box-shadow:var(--shadow)}
.inst h2{margin:0;font-size:28px;line-height:1.2}
.inst .sub{margin:8px 0 0;color:var(--fg-2)}
.inst ol{list-style:none;counter-reset:s;margin:24px 0 0;padding:0;display:grid;gap:16px}
.inst li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.inst li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fg);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.inst li b{margin-right:4px}
.boxes{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.boxes span{padding:4px 12px;border-radius:var(--r-chip);background:var(--fill);font-size:13px}
details{margin-top:24px;border-top:1px solid var(--line)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;font-size:22px;color:var(--fg-2)}
details[open] summary::after{content:"–"}
details ul{margin:0;padding:0 0 0 20px;color:var(--fg-2);font-size:15px}
details li{margin:8px 0;overflow-wrap:anywhere}
.privacy{text-align:center;max-width:640px;margin:0 auto;padding:64px 0 0}
.privacy h2{margin:0;font-size:clamp(28px,4vw,34px)}
.privacy p{color:var(--fg-2)}
.foot{margin:64px 0 0;padding:32px 0 calc(48px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;font-size:13px;line-height:1.9;color:var(--fg-2)}
.foot .mail{user-select:all;-webkit-user-select:all;color:var(--fg)}
/* 提意见：点的地方够 44 高，排版上不撑开这一行 */
.foot a.fb{display:inline-block;padding:12px 8px;margin:-12px -4px;color:var(--accent);font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.foot a.fb:hover{text-decoration:underline}}
.foot a.fb:focus-visible{outline:2px solid var(--accent);outline-offset:-8px;border-radius:var(--r-chip)}
@media (max-width:760px){
  .hero{padding-top:48px}
  .sec,.sec.flip{grid-template-columns:1fr;gap:24px;padding:48px 0}
  .sec.flip .txt{order:0}
  .grid{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.nav .dl{display:none}}   /* 手机上首屏就有大下载按钮，顶栏留给名字和语言 */
@media (max-width:440px){.grid{grid-template-columns:1fr}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- 字全在 app/ui/strings.js 的 SITE 里（程序界面的字也在那个文件）。默认英文；右上角 EN / 中文，选过就记住 -->
<nav class="nav"><div class="wrap">
  <a href="https://qianshoulab.github.io/" data-s="home">QIANSHOU LAB</a>
  <b><img src="icon.svg" alt=""><span data-s="navName">Zhike</span></b>
  <a class="dl" href="#dl" data-s="navDl">Download</a>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button></div>
</div></nav>
<div class="wrap">
  <header class="hero">
    <img class="ic" src="icon.svg" width="96" height="96" alt="">
    <h1 data-sh="h1"></h1>
    <p class="sl" data-sh="sl"></p>
    <p class="tg" data-s="tg"></p>
    <div class="cta" id="dl">
      <a class="btn pri" href="https://github.com/QIANSHOULAB/qianshoulab.github.io/releases/download/zhike-latest/Zhike.exe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-s="dl"></span></a>
      <a class="btn" href="#how" data-s="how"></a>
    </div>
    <div class="meta" data-s="meta"></div>
    <div class="shot">
      <picture><source data-img="app-dark" srcset="img/app-dark-en.webp" media="(prefers-color-scheme: dark)"><img data-img="app-light" data-alt="alt1" src="img/app-light-en.webp" width="2360" height="1520" alt=""></picture>
    </div>
  </header>

  <section class="sec">
    <div class="txt"><h2 data-sh="s1h"></h2><p data-s="s1p1"></p><p data-s="s1p2"></p></div>
    <div class="pic"><picture><source data-img="recs-dark" srcset="img/recs-dark-en.webp" media="(prefers-color-scheme: dark)"><img data-img="recs-light" data-alt="alt2" src="img/recs-light-en.webp" width="1920" height="1520" alt="" loading="lazy"></picture></div>
  </section>

  <section class="sec flip">
    <div class="txt"><h2 data-sh="s2h"></h2><p data-s="s2p1"></p><p data-s="s2p2"></p></div>
    <ol class="steps" data-aria="stepsLabel">
      <li><i>1</i><div><b data-s="st1b"></b><span data-s="st1"></span></div></li>
      <li><i>2</i><div><b data-s="st2b"></b><span data-s="st2"></span></div></li>
      <li><i>3</i><div><b data-s="st3b"></b><span data-s="st3"></span></div></li>
    </ol>
  </section>

  <section class="grid" data-aria="gridLabel">
    <div class="g"><b data-s="g1b"></b><span data-s="g1"></span></div>
    <div class="g"><b data-s="g2b"></b><span data-s="g2"></span></div>
    <div class="g"><b data-s="g3b"></b><span data-s="g3"></span></div>
    <div class="g"><b data-s="g4b"></b><span data-s="g4"></span></div>
    <div class="g"><b data-s="g5b"></b><span data-s="g5"></span></div>
    <div class="g"><b data-s="g6b"></b><span data-s="g6"></span></div>
    <div class="g"><b data-s="g7b"></b><span data-s="g7"></span></div>
    <div class="g"><b data-s="g8b"></b><span data-s="g8"></span></div>
    <div class="g"><b data-s="g9b"></b><span data-s="g9"></span></div>
  </section>

  <section class="inst" id="how">
    <h2 data-s="instH"></h2>
    <p class="sub" data-s="instS"></p>
    <ol>
      <li><span data-sh="i1"></span></li>
      <li><span data-sh="i2"></span></li>
    </ol>
    <div class="boxes"><span data-s="bx1"></span><span data-s="bx2"></span><span data-s="bx3"></span><span data-s="bx4"></span><span data-s="bx5"></span><span data-s="bx6"></span><span data-s="bx7"></span><span data-s="bx8"></span><span data-s="bx9"></span></div>
    <details>
      <summary data-s="pwQ"></summary>
      <ul>
        <li data-sh="pw1"></li>
        <li data-sh="pw2"></li>
        <li data-sh="pw3"></li>
        <li data-sh="pw4"></li>
        <li data-sh="pw5"></li>
      </ul>
    </details>
  </section>

  <section class="privacy">
    <h2 data-s="privH"></h2>
    <p data-s="priv"></p>
  </section>

  <footer class="foot">
    <div data-s="footName"></div>
    <div><span data-s="footMail"></span><span class="mail">oilsongchengmin@gmail.com</span></div>
    <div><span data-str="fb_line"></span> <a class="fb" href="mailto:oilsongchengmin@gmail.com" data-str="btn_feedback">Feedback</a></div>
    <div><a href="https://qianshoulab.github.io/" data-s="footHome"></a></div>
  </footer>
</div>
<script>
// 默认英文；右上角 EN / 中文，选过就记住（localStorage 的 zhike.lang）；网址带 ?lang=zh|en 先听网址。不跟浏览器语言走。
(() => {
  const SITE = window.SITE, STR = window.STR, LK = 'zhike.lang', V = '0.4.1';
  /* 提意见：mailto 打开用户自己的邮件程序，标题、正文填好（字在 strings.js 的 fb_*，跟程序里同一套）；不接表单，不收数据。
     正文最后一行「版本 · 系统 · 浏览器」简写，比如 0.4.1 · Windows 11 · Edge 130 */
  const UA = navigator.userAgent || '';
  function deviceTag() {
    let os = 'other', br = 'other', m;
    if ((m = /Windows NT (\d+\.\d+)/.exec(UA))) os = m[1] === '10.0' ? 'Windows' : 'Windows ' + ({ '6.3': '8.1', '6.2': '8', '6.1': '7' }[m[1]] || m[1]);
    else if ((m = /(?:iPhone|CPU) OS (\d+)_/.exec(UA))) os = (/iPad/.test(UA) ? 'iPadOS ' : 'iOS ') + m[1];
    else if (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1) os = 'iPadOS';
    else if ((m = /Android (\d+)/.exec(UA))) os = 'Android ' + m[1];
    else if (/Mac OS X/.test(UA)) os = 'macOS';
    else if (/CrOS/.test(UA)) os = 'ChromeOS';
    else if (/Linux/.test(UA)) os = 'Linux';
    if ((m = /MicroMessenger\/(\d+)/.exec(UA))) br = 'WeChat ' + m[1];
    else if ((m = /Edg(?:A|iOS)?\/(\d+)/.exec(UA))) br = 'Edge ' + m[1];
    else if ((m = /OPR\/(\d+)/.exec(UA))) br = 'Opera ' + m[1];
    else if ((m = /(?:Firefox|FxiOS)\/(\d+)/.exec(UA))) br = 'Firefox ' + m[1];
    else if ((m = /(?:Chrome|CriOS)\/(\d+)/.exec(UA))) br = 'Chrome ' + m[1];
    else if ((m = /Version\/(\d+).*Safari/.exec(UA))) br = 'Safari ' + m[1];
    else if (/Safari/.test(UA)) br = 'Safari';
    return os + ' · ' + br;
  }
  let DEVICE = deviceTag();
  const FB_TO = ['oilsongchengmin', 'gmail.com'].join('@');
  const fbHref = () => {
    const L = STR[lang] || STR.en;
    return 'mailto:' + FB_TO + '?subject=' + encodeURIComponent(L.fb_subject.split('{v}').join(V))
      + '&body=' + encodeURIComponent([L.fb_q1, L.fb_q2, L.fb_q3].join('\n\n') + '\n\n\n——\n' + V + ' · ' + DEVICE);
  };
  const fbFill = () => { for (const a of document.querySelectorAll('a.fb')) a.href = fbHref(); };
  // Chromium 的 UA 里 Windows 10 / 11、macOS、Android 的版本是冻住的，问得到真版本就换上（问不到就用上面的简写）
  try {
    const ud = navigator.userAgentData;
    if (ud && /^(Windows|macOS|Android)$/.test(ud.platform) && ud.getHighEntropyValues) ud.getHighEntropyValues(['platformVersion']).then((v) => {
      const pv = String(v.platformVersion || '').split(/[._]/), maj = parseInt(pv[0], 10);
      if (!(maj > 0) || DEVICE.indexOf(ud.platform) !== 0) return;
      // Windows：platformVersion 13 起是 11，1–10 是 10；macOS 10.x 带上小版本，11 起只写大版本
      const os = ud.platform === 'Windows' ? (maj >= 13 ? 'Windows 11' : 'Windows 10') : ud.platform + ' ' + (ud.platform === 'macOS' && maj === 10 && pv[1] ? '10.' + pv[1] : maj);
      DEVICE = DEVICE.replace(/^(Windows|macOS|Android)( \d+)?/, os);
      fbFill();
    }).catch(() => {});
  } catch (e) {}
  const save = (l) => { try { localStorage.setItem(LK, l); } catch (e) {} };
  let lang = null;
  try { lang = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (SITE[lang]) save(lang);
  else { try { lang = localStorage.getItem(LK); } catch (e) {} if (!SITE[lang]) lang = 'en'; }
  function apply() {
    const s = SITE[lang], suf = lang === 'en' ? '-en' : '';
    document.documentElement.lang = s.htmlLang;
    document.title = s.title;
    document.querySelector('meta[name=description]').content = s.desc;
    for (const el of document.querySelectorAll('[data-s]')) el.textContent = s[el.dataset.s];
    for (const el of document.querySelectorAll('[data-sh]')) el.innerHTML = s[el.dataset.sh];
    for (const el of document.querySelectorAll('[data-str]')) el.textContent = (STR[lang] || STR.en)[el.dataset.str];
    fbFill();
    for (const el of document.querySelectorAll('[data-alt]')) el.alt = s[el.dataset.alt];
    for (const el of document.querySelectorAll('[data-aria]')) el.setAttribute('aria-label', s[el.dataset.aria]);
    for (const el of document.querySelectorAll('[data-img]')) el[el.tagName === 'IMG' ? 'src' : 'srcset'] = 'img/' + el.dataset.img + suf + '.webp';
    const g = document.querySelector('.lang');
    g.setAttribute('aria-label', s.langLabel);
    for (const b of g.children) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  document.querySelector('.lang').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; save(lang);
    if (location.search) history.replaceState(null, '', location.pathname + location.hash);
    apply();
  });
  apply();
})();
</script>
</body>
</html>
