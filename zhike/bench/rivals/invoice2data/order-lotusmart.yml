issuer: 订单
keywords:
  - "@lotus-mart.example"
  - "Subject: Your Lotus Mart order"
fields:
  订单号: Order Number\s+(\S+)
  金额:
    parser: regex
    regex: Total\s+US\$\s?([\d,.]+)
    type: float
  下单日期:
    parser: regex
    regex: Order Date\s+([A-Z][a-z]{2} \d{1,2}, \d{4})
    type: date
required_fields: [订单号]
options:
  date_formats: ["%b %d, %Y"]
