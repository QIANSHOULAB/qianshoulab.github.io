issuer: 订单
keywords:
  - "@shanmen-shop.example"
  - "Subject: 订单确认"
fields:
  订单号: 订单号：\s*(\S+)
  金额:
    parser: regex
    regex: 实付金额：¥([\d,.]+)
    type: float
  下单日期:
    parser: regex
    regex: 下单时间：(\d{4}-\d{2}-\d{2})
    type: date
required_fields: [订单号]
options:
  date_formats: ["%Y-%m-%d"]
