<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xunshan</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><img src="icons/48.png" alt=""><div><b data-t="app"></b><span class="duty"><i class="dot on" id="dutyDot"></i><span id="duty"></span></span></div></div>
    <div class="tools">
      <button class="btn txt" id="readAll" hidden data-t="unreadAll"></button>
      <button class="btn" id="addBtn" data-t-aria="addMany"></button>
      <button class="btn icon" id="gear" data-t-title="settings"></button>
      <div class="lang" id="lang" role="group"></div>
    </div>
  </div>
</header>

<div class="shell">
  <section class="sheet group" id="settings" hidden>
    <div class="row"><div class="grow"><div class="t" data-t="defaultIv"></div><div class="s" data-t="defaultIvSub"></div></div><button class="pick" id="sIv"></button></div>
    <div class="row"><div class="grow"><div class="t" data-t="siteGap"></div><div class="s" data-t="siteGapSub"></div></div><div class="seg" id="sGap"></div></div>
    <div class="row"><div class="grow"><div class="s" data-t="privacy" style="white-space:normal"></div></div><button class="btn txt" id="imp"></button><button class="btn txt" id="exp"></button></div>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </section>

  <section class="sheet group add" id="add" hidden>
    <div class="add-h"><h2 data-t="addManyTitle"></h2><p data-t="addManySub"></p></div>
    <textarea class="inp" id="urls" rows="5" spellcheck="false" data-t-ph="addManyPh" data-t-aria="urlsLabel"></textarea>
    <div class="add-f">
      <label class="lim"><span data-t="belowAll"></span><input class="inp" id="lim" inputmode="decimal" data-t-ph="belowAllPh"></label>
      <button class="btn pri" id="addGo" disabled></button>
    </div>
    <div class="add-msg" id="addMsg" role="status"></div>
  </section>

  <section class="banner" id="permBar" hidden>
    <span data-t="importPerm"></span><button class="btn pri" id="grant" data-t="grant"></button>
  </section>

  <main class="main" id="main">
    <nav class="side">
      <div class="sec-h"><span data-t="all"></span><span id="cnt" class="tn"></span></div>
      <div class="group lst" id="lst"></div>
    </nav>
    <article class="det" id="det"></article>
  </main>

  <section class="hero" id="hero" hidden>
    <img src="icons/128.png" width="96" height="96" alt="">
    <h1 data-t="emptyTitle"></h1>
    <p data-t="emptySub"></p>
    <div class="hero-acts"><button class="btn pri lg" id="demo" data-t="tryDemo"></button><button class="btn lg" id="heroAdd" data-t="batchLink"></button></div>
  </section>

  <footer class="foot">
    <div><span data-t="lab"></span> · <span data-t="appFull"></span> <span id="ver" class="tn"></span></div>
    <div><span data-t="mailLine"></span><span class="mail">oilsongchengmin@gmail.com</span></div>
    <div><a href="https://qianshoulab.github.io/" target="_blank" rel="noopener" data-t="hq"></a></div>
  </footer>
</div>
<script src="lib/strings.js"></script>
<script src="lib/store.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/diff.js"></script>
<script src="core/rules.js"></script>
<script src="app.js"></script>
</body>
</html>
