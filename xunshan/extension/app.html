<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巡山僧</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img src="icons/128.png" alt=""><div><h1 data-t="app"></h1><p data-t="slogan"></p></div></div>
    <div class="tools">
      <button class="btn" id="readAll" hidden data-t="unreadAll"></button>
      <button class="btn" id="imp"></button>
      <button class="btn" id="exp"></button>
      <button class="btn round" id="gear" data-t-title="settings"></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="card settings" id="settings" hidden>
    <div class="srow"><span data-t="defaultIv"></span><select class="sel" id="sIv"></select></div>
    <div class="sep"></div>
    <div class="srow"><span><span data-t="siteGap"></span><small data-t="siteGapSub"></small></span><select class="sel" id="sGap"></select></div>
    <div class="sep"></div>
    <div class="srow note" data-t="privacy"></div>
  </section>

  <section class="card banner" id="permBar" hidden>
    <span data-t="importPerm"></span><button class="btn pri" id="grant" data-t="grant"></button>
  </section>

  <main class="main" id="main">
    <nav class="side">
      <div class="side-h"><b data-t="all"></b><span id="cnt"></span></div>
      <div class="lst card" id="lst"></div>
    </nav>
    <article class="det" id="det"></article>
  </main>

  <section class="hero card" id="hero" hidden>
    <img src="icons/128.png" alt="">
    <h2 data-t="emptyTitle"></h2>
    <p data-t="emptySub"></p>
    <ol class="steps"><li data-t="step1"></li><li data-t="step2"></li><li data-t="step3"></li></ol>
  </section>

  <footer class="foot">
    <div>千手院 · 巡山僧 <span id="ver"></span></div>
    <div><span data-t="mailLine"></span><span class="mail">oilsongchengmin@gmail.com</span></div>
    <div><a href="https://qianshoulab.github.io/" target="_blank" rel="noopener" data-t="hq"></a></div>
  </footer>
</div>
<script src="lib/strings.js"></script>
<script src="lib/store.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/diff.js"></script>
<script src="core/rules.js"></script>
<script src="app.js"></script>
</body>
</html>
