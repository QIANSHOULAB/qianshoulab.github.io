<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xunshan · Price Watch</title>
<meta name="description" content="A Chrome / Edge extension that watches pages for price drops, restocks and new posts, and pings you the moment something moves. Free. Your list never leaves your browser.">
<script src="extension/lib/strings.js?v=0.4.1"></script>
<script src="extension/lib/feedback.js?v=0.4.1"></script>
<script>
/* 挑语言：?lang=zh|en（只管这一次）> 右上角选过的（localStorage xunshan.lang）> 默认英文。不跟浏览器语言走（Song 11-03 22:19）。
   字全在 extension/lib/strings.js；这里只在画页面之前把 <html lang>、标题、简介换好 */
(function(){var t=QS.t;document.documentElement.lang=t("htmlLang");document.title=t("iTitle");document.querySelector('meta[name="description"]').content=t("iDesc")})();
</script>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="extension/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="extension/icons/32.png" sizes="32x32">
<link rel="apple-touch-icon" href="extension/icons/128.png">
<style>
/* 照 _ops/设计规范.md：系统字、一个主色（巡山僧靛）、其余全灰；居中单栏最宽 980；首屏一句大标题、一句副标题、主操作 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --accent:#4e5bd6; --accent-press:#4350c4; --link:#4e5bd6; --on-accent:#ffffff;
  --r-card:18px; --r-btn:12px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  --glass:rgba(255,255,255,.72);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --accent:#5562de; --accent-press:#6470ea; --link:#8c9aff;
  --shadow:none; --glass:rgba(22,22,24,.72); color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-group);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.nav{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:48px;font-size:13px}
.nav a{color:var(--fg-2);display:inline-flex;align-items:center;min-height:44px}
.nav a:hover{color:var(--fg)}
.nav b{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:600;font-size:15px}
.nav b img{width:24px;height:24px}
.hero{text-align:center;padding:64px 0 32px}
.hero .ic{width:96px;height:96px;margin:0 auto 24px}
.hero h1{margin:0;font-size:clamp(40px,6vw,64px);line-height:1.1;font-weight:700;letter-spacing:-.02em}
.hero .sl{margin:12px 0 0;font-size:clamp(22px,3vw,28px);line-height:1.2;font-weight:600}
.hero .tg{margin:12px auto 0;max-width:560px;font-size:17px;color:var(--fg-2)}
/* 中文只在标点、空格处换行，词不拆开 */
.hero h1,.hero .sl,.hero .tg{word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:14px;font-size:17px;font-weight:600;background:var(--fill);color:var(--fg);transition:background var(--t) var(--ease)}
.btn:hover{background:var(--fill-2)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-press)}
.btn svg{width:20px;height:20px}
.meta{margin-top:12px;font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.shot{margin:48px auto 0;border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
@media (prefers-color-scheme:dark){.shot,.pic{box-shadow:0 0 0 1px var(--line)}}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:64px 0}
.sec+.sec{border-top:1px solid var(--line)}
.sec.flip .txt{order:2}
.sec h2{margin:0;font-size:clamp(28px,4vw,34px);line-height:1.2;font-weight:700}
.sec p{margin:12px 0 0;color:var(--fg-2)}
.pic{border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.pic.phone{max-width:380px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:32px 0 64px;border-radius:var(--r-card);overflow:hidden;background:var(--line);box-shadow:var(--shadow)}
.g{background:var(--card);padding:24px}
.g b{display:block;font-size:17px;font-weight:600}
.g span{display:block;margin-top:4px;font-size:15px;color:var(--fg-2)}
.inst{background:var(--card);border-radius:var(--r-card);padding:32px clamp(16px,5vw,48px);box-shadow:var(--shadow)}
.inst h2{margin:0;font-size:28px;line-height:1.2}
.inst .sub{margin:8px 0 0;color:var(--fg-2)}
.inst ol{list-style:none;counter-reset:s;margin:24px 0 0;padding:0;display:grid;gap:16px}
.inst li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.inst li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fg);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
code{font:400 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--fill);padding:2px 8px;border-radius:var(--r-chip);user-select:all;-webkit-user-select:all}
.inst .later{margin-top:24px;font-size:15px;color:var(--fg-2)}
.foot{margin:48px 0 0;padding:32px 0 calc(48px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;font-size:13px;line-height:1.9;color:var(--fg-2)}
.foot .mail{user-select:all;-webkit-user-select:all;color:var(--fg)}
@media (max-width:760px){
  .hero{padding-top:48px}
  .sec{grid-template-columns:1fr;gap:24px;padding:48px 0}
  .sec.flip .txt{order:0}
  .grid{grid-template-columns:1fr 1fr}
}
@media (max-width:440px){.grid{grid-template-columns:1fr}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nav .r{display:flex;align-items:center;gap:16px}
.nav .bx{color:var(--fg-2);font-weight:400}
.sec h2{white-space:pre-line}
.hero h1 .x{display:block;color:var(--fg-3)}
.hero h1 .x:empty{display:none}
html[lang="en"] .hero .sl,html[lang="en"] .sec h2{letter-spacing:-.01em}
.lang{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-chip);background:var(--fill);flex:none}
.lang button{position:relative;min-width:36px;height:26px;padding:0 8px;border:0;border-radius:6px;background:none;font:600 12px/1 var(--font);color:var(--fg-2);cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.lang button::after{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
@media (prefers-color-scheme:dark){.lang button[aria-pressed="true"]{background:#636366;box-shadow:none}}
@media (max-width:440px){.nav .bx,.nav .r a{display:none}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap"><a href="https://qianshoulab.github.io/" data-t="iHome"></a><b><img src="extension/icons/icon.svg" alt=""><span id="bn"></span></b><span class="r"><a href="#install" data-t="iInstall"></a><span class="lang" id="lang" role="group"></span></span></div></nav>
<div class="wrap">
  <header class="hero">
    <img class="ic" src="extension/icons/icon.svg" width="96" height="96" alt="">
    <h1><span data-t="app"></span><span class="x" id="h1x"></span></h1>
    <p class="sl" data-t="slogan"></p>
    <p class="tg" data-t="iTagline"></p>
    <div class="cta">
      <a class="btn pri" id="dl" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="iDownload"></span></a>
      <a class="btn" href="#install" data-t="iHowTo"></a>
    </div>
    <div class="meta" id="meta"></div>
    <div class="shot">
      <picture><source data-img="app" media="(prefers-color-scheme: dark)"><img data-img="app" data-alt="iAltApp" width="1280" height="800" alt=""></picture>
    </div>
  </header>

  <section class="sec">
    <div class="txt"><h2 data-t="iS1T"></h2><p data-t="iS1P"></p></div>
    <div class="pic phone"><picture><source data-img="popup" media="(prefers-color-scheme: dark)"><img data-img="popup" data-alt="iAltPopup" width="380" height="640" alt=""></picture></div>
  </section>

  <section class="sec flip">
    <div class="txt"><h2 data-t="iS2T"></h2><p data-t="iS2P"></p></div>
    <div class="pic"><picture><source data-img="batch" media="(prefers-color-scheme: dark)"><img data-img="batch" data-alt="iAltBatch" width="1104" height="383" alt=""></picture></div>
  </section>

  <section class="sec">
    <div class="txt"><h2 data-t="iS3T"></h2><p data-t="iS3P"></p></div>
    <div class="pic"><picture><source data-img="compare" media="(prefers-color-scheme: dark)"><img data-img="compare" data-alt="iAltCompare" width="732" height="297" alt=""></picture></div>
  </section>

  <section class="grid" id="grid"></section>

  <section class="inst" id="install">
    <h2 data-t="iInstT"></h2>
    <p class="sub" data-t="iInstSub"></p>
    <ol id="steps"></ol>
    <p class="later" data-t="iLater"></p>
  </section>

  <footer class="foot">
    <div data-t="iFootName"></div>
    <div><span data-t="iFootMail"></span><span class="mail">oilsongchengmin@gmail.com</span></div>
    <div><a href="https://qianshoulab.github.io/" data-t="hq"></a> · <a class="fb" id="fb" href="#" data-t="fb"></a></div>
  </footer>
</div>
<script>
/* 换语言（右上角 EN / 中文）：字、图、标题一起换，记住选的 */
(function(){
  var VER="0.4.1", ZIP="dist/xunshan-"+VER+".zip", t=QS.t, $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function draw(){
    var L=QS.lang(), dir=L==="en"?"img/en/":"img/";
    document.documentElement.lang=t("htmlLang"); document.title=t("iTitle"); document.querySelector('meta[name="description"]').content=t("iDesc");
    document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.dataset.t)});
    var full=t("appFull").split(" · ");
    $("#bn").innerHTML=esc(full[0])+(full[1]?'<span class="bx"> · '+esc(full[1])+"</span>":""); $("#h1x").textContent=full[1]||"";
    $("#dl").href=ZIP; $("#meta").textContent=t("iMeta",VER);
    document.querySelectorAll("source[data-img]").forEach(function(el){el.srcset=dir+el.dataset.img+"-dark.webp"});
    document.querySelectorAll("img[data-img]").forEach(function(el){el.src=dir+el.dataset.img+".webp";el.alt=t(el.dataset.alt)});
    $("#grid").setAttribute("aria-label",t("iMore"));
    $("#grid").innerHTML=t("iG").map(function(g){return '<div class="g"><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></div>'}).join("");
    $("#steps").innerHTML=t("iSteps").map(function(x){return "<li><span>"+x.replace("{zip}",ZIP).replace("{zipName}","xunshan-"+VER+".zip")+"</span></li>"}).join("");
    var ls=$("#lang"); ls.setAttribute("aria-label",t("langLabel"));
    ls.innerHTML=QS.LANGS.map(function(x){return '<button type="button" data-l="'+x.code+'" lang="'+QS.STR[x.code].htmlLang+'" aria-pressed="'+(x.code===L)+'">'+x.label+"</button>"}).join("");
  }
  /* 提意见：mailto 全填好，标题和正文照当前语言，最后一行版本 · 系统 · 浏览器 */
  var fbSet=QSFeedback.wire($("#fb"),function(){return{subject:t("fbSubject",VER),body:t("fbBody"),version:VER}});
  QS.onLang(fbSet);
  $("#lang").addEventListener("click",function(e){var b=e.target.closest("[data-l]");if(b&&b.dataset.l!==QS.lang())QS.setLang(b.dataset.l)});
  QS.onLang(draw); draw();
})();
</script>
</body>
</html>
