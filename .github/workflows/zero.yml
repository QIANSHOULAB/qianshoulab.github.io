name: 零肉身造物
# 零肉身造物（Zero-Flesh Creation）：首页 /zero/ 和 /zahuopu、/specimens、/artifacts、/codex 的源码在 _zero/（Astro + MDX + Tailwind + three.js）。
# 改了 _zero/ 就在这里构建，再把产物提交到仓库根目录：只动 _zero/scripts/publish.mjs 里 OWNED 那几样。
# 首页发到 /zero/；根目录 / 是千手院，不碰——除非有人把 _zero/home.mjs 里 HOME_AT_ROOT 改成 true（那一行就是换根目录的开关）。
# 千手院 /qianshou/、每个工具的文件夹、_ops 一概不碰。GitHub Pages 照旧从 main 根目录发（Jekyll 不发下划线开头的文件夹，_zero/ 源码不会上线）。
# 发完再对着真网址验一遍（_zero/scripts/live-check.mjs）：老网址全 200，根目录还是该是的那个，零肉身页面不报错、不横向溢出。
# 拉最新 main 再放产物，推不上再拉再推，最多 5 次，不许 --force。提交作者沿用触发这次构建的那个提交的作者。
# 分支（zero-v3 这种）推上来只跑 preview：构建、在工作流机器上本地起服务、三个内核截图、传附件——不发版，不碰 main。
# 发版那两步（build、live）只在 main 上跑：在分支上手动触发也不会把分支产物提交到 main。
on:
  push:
    branches: [main, zero-v3]
    paths:
      - '_zero/**'
      - '.github/workflows/zero.yml'
  workflow_dispatch:
    inputs:
      commit_shots:
        description: '把造物之门七幕的线上截图提交到 _ops/零肉身造物/造物之门截图/（只在 main 上有用）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: zero-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装依赖
        working-directory: _zero
        run: npm ci

      - name: 构建
        working-directory: _zero
        env:
          ZERO_BUILD: ${{ github.sha }}
        run: npm run build

      - name: 装三个内核（Chromium、WebKit、Firefox）
        working-directory: _zero
        run: npx playwright install --with-deps chromium webkit firefox

      - name: 本地起服务（跟线上一样排：零肉身造物那几样从 dist 出，别的从仓库根目录出）
        working-directory: _zero
        run: |
          nohup node scripts/serve.mjs 4321 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4321/zero/ && break; sleep 1; done
          code=0
          for p in / /zero/ /qianshou/ /zahuopu/ /zhahuopu/ /specimens/ /specimens/001-cinderfall-arena/ /artifacts/ /codex/ /codex/web-audio-formulas/ \
                   /yijing/ /chaojing/ /zhike/ /saodi/ /huayuan/ /xunshan/ /daibi/ /baozuseng/ /tiexie/ /xiaobai/ /privacy/ /apps.json; do
            s=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$p")
            echo "$s $p"; [ "$s" = "200" ] || code=1
          done
          exit $code

      - name: 三个内核 × 七幕截图（Chromium 11 个尺寸，WebKit、Firefox 各 4 个），查溢出、报错、字出框
        working-directory: _zero
        run: node scripts/genesis-shots.mjs --base http://127.0.0.1:4321 --out "${{ github.workspace }}/preview-shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-preview-shots
          path: preview-shots
          if-no-files-found: ignore

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装依赖
        working-directory: _zero
        run: npm ci

      - name: 构建
        working-directory: _zero
        env:
          ZERO_BUILD: ${{ github.sha }}
        run: npm run build

      - name: 产物提交到根目录（根目录 index.html 只在 HOME_AT_ROOT = true 时才动）
        id: publish
        run: |
          NAME="$(git log -1 --format=%an)"; MAIL="$(git log -1 --format=%ae)"
          git config user.name "$NAME"
          git config user.email "$MAIL"
          ROOT="$(node _zero/scripts/publish.mjs --root)"
          echo "HOME_AT_ROOT: $ROOT"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main          # _zero/dist、node_modules 被 .gitignore 管着，不受影响
            node _zero/scripts/publish.mjs
            git add -A -- $(node _zero/scripts/publish.mjs --list)
            CHANGED="$(git diff --cached --name-only)"
            # 保险：千手院、_ops、工作流永远不许被产物提交碰到；根目录 index.html 只有开关打开才许动
            if echo "$CHANGED" | grep -qE '^(qianshou/|_ops/|_zero/|\.github/)'; then
              echo "::error::产物提交碰到了不归零肉身造物管的文件："; echo "$CHANGED" | grep -E '^(qianshou/|_ops/|_zero/|\.github/)'; exit 1
            fi
            if [ "$ROOT" != "yes" ] && echo "$CHANGED" | grep -qx 'index.html'; then
              echo "::error::HOME_AT_ROOT 是 false，根目录 index.html（千手院）不许动"; exit 1
            fi
            if git diff --cached --quiet; then
              echo "产物跟线上一样，不用提交"
              echo "published=same" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "零肉身造物：构建产物（源码 ${GITHUB_SHA::7}）"
            if git push -q origin HEAD:main; then
              echo "published=yes" >> "$GITHUB_OUTPUT"
              git log -1 --stat --format='%h %s' | head -40
              exit 0
            fi
            echo "推不上（别人先推了），第 $i 次重来"
            sleep 8
          done
          exit 1

      - name: 请 Pages 重新发一次（保险：机器人提交一般会自己触发）
        if: steps.publish.outputs.published == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "没请动也没关系，推送本身会触发"

  live:
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.outputs.published == 'yes' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 等 Pages 发到这一版（看 /zero/ 上的构建记号）
        if: github.event_name != 'workflow_dispatch'
        run: |
          for i in $(seq 1 60); do
            got=$(curl -s "https://qianshoulab.github.io/zero/?v=$RANDOM$i" | grep -o 'name="zero:build" content="[^"]*"' | sed 's/.*content="//; s/"//')
            if [ "$got" = "$GITHUB_SHA" ]; then echo "线上已经是 ${GITHUB_SHA::7}"; exit 0; fi
            echo "线上还是 ${got:-（没读到）}，等 15 秒（第 $i 次）"
            sleep 15
          done
          echo "::error::等了 15 分钟 Pages 还没发到这一版"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装 Playwright
        working-directory: _zero
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit firefox

      - name: 线上验收
        working-directory: _zero
        env:
          SHOTS: ${{ github.workspace }}/live-shots
        run: node scripts/live-check.mjs

      - name: 造物之门线上截图（七幕 × 1440×900、390×844，2 倍图；顺带查溢出、报错、字出框）
        working-directory: _zero
        run: |
          node scripts/genesis-shots.mjs --base https://qianshoulab.github.io --engines chromium --sizes 1440x900,390x844 --dpr 2 --out "${{ github.workspace }}/live-shots/造物之门截图"
          node scripts/genesis-shots.mjs --base https://qianshoulab.github.io --engines chromium --sizes 1440x900,390x844 --langs zh --out "${{ github.workspace }}/live-shots/中文"

      - name: 线上三个内核再走一遍（Chromium 11 个尺寸，WebKit、Firefox 各 4 个）
        working-directory: _zero
        run: node scripts/genesis-shots.mjs --base https://qianshoulab.github.io --out "${{ github.workspace }}/live-shots/三内核"

      - name: 截图提交到 _ops（只有手动跑、勾了 commit_shots 才提交）
        if: github.event_name == 'workflow_dispatch' && inputs.commit_shots
        run: |
          git config user.name "QIANSHOULAB"
          git config user.email "oilsongchengmin@gmail.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p "_ops/零肉身造物/造物之门截图"
            cp -f live-shots/造物之门截图/* "_ops/零肉身造物/造物之门截图/"
            git add "_ops/零肉身造物/造物之门截图"
            if git diff --cached --quiet; then echo "截图没变"; exit 0; fi
            git commit -q -m "零肉身造物：造物之门七幕线上验收截图（$(date -u +%m-%d\ %H:%M) UTC）"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 8
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-live-shots
          path: live-shots
          if-no-files-found: ignore
