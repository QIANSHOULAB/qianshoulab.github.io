name: 零肉身造物
# 零肉身造物（Zero-Flesh Creation）：首页 /zero/ 和 /zahuopu、/specimens、/artifacts、/codex 的源码在 _zero/（Astro + MDX + Tailwind + three.js）。
# 改了 _zero/ 就在这里构建，再把产物提交到仓库根目录：只动 _zero/scripts/publish.mjs 里 OWNED 那几样。
# 首页发到 /zero/；根目录 / 是千手院，不碰——除非有人把 _zero/home.mjs 里 HOME_AT_ROOT 改成 true（那一行就是换根目录的开关）。
# 千手院 /qianshou/、每个工具的文件夹、_ops 一概不碰。GitHub Pages 照旧从 main 根目录发（Jekyll 不发下划线开头的文件夹，_zero/ 源码不会上线）。
# 发完再对着真网址验一遍（_zero/scripts/live-check.mjs）：老网址全 200，根目录还是该是的那个，零肉身页面不报错、不横向溢出。
# 拉最新 main 再放产物，推不上再拉再推，最多 5 次，不许 --force。提交作者沿用触发这次构建的那个提交的作者。
# v3.4（手机竖屏上造出来的东西别挤在一起）在分支 zero-v3-4 上做：推分支只跑 preview（三个内核各开一台机器同时跑：
# 本地构建、本地起服务、v3.4 验收（重叠检查、名字、电脑跟线上比一个数不差、黑屏回归）、v3.4 交货截图、七幕截图、WebKit iPhone 真点、
# v3.3 交互验收），再由 preview-commit 把总览图、结果提交回分支；不发版。
# 并进 main 以后才走 build → live 这条发版的路。（v3 到 v3.3 当时用的分支 zero-v3-alt、zero-v3-1、zero-v3-2、zero-v3-3 已经并进 main，不再认它们。）
on:
  push:
    branches: [main, zero-v3-4]
    paths:
      - '_zero/**'
      - '.github/workflows/zero.yml'
  workflow_dispatch:
    inputs:
      commit_shots:
        description: '把造物之门的验收截图（v3.4 交货图和总览、v3.4 验收结果、v3.3 交互验收结果、七幕总览、真点）提交到 _ops/零肉身造物/v3.4截图/线上/'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: zero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装依赖
        working-directory: _zero
        run: npm ci

      - name: 构建
        working-directory: _zero
        env:
          ZERO_BUILD: ${{ github.sha }}
        run: npm run build

      - name: 产物提交到根目录（根目录 index.html 只在 HOME_AT_ROOT = true 时才动）
        id: publish
        run: |
          NAME="$(git log -1 --format=%an)"; MAIL="$(git log -1 --format=%ae)"
          git config user.name "$NAME"
          git config user.email "$MAIL"
          ROOT="$(node _zero/scripts/publish.mjs --root)"
          echo "HOME_AT_ROOT: $ROOT"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main          # _zero/dist、node_modules 被 .gitignore 管着，不受影响
            node _zero/scripts/publish.mjs
            git add -A -- $(node _zero/scripts/publish.mjs --list)
            CHANGED="$(git diff --cached --name-only)"
            # 保险：千手院、_ops、工作流永远不许被产物提交碰到；根目录 index.html 只有开关打开才许动
            if echo "$CHANGED" | grep -qE '^(qianshou/|_ops/|_zero/|\.github/)'; then
              echo "::error::产物提交碰到了不归零肉身造物管的文件："; echo "$CHANGED" | grep -E '^(qianshou/|_ops/|_zero/|\.github/)'; exit 1
            fi
            if [ "$ROOT" != "yes" ] && echo "$CHANGED" | grep -qx 'index.html'; then
              echo "::error::HOME_AT_ROOT 是 false，根目录 index.html（千手院）不许动"; exit 1
            fi
            if git diff --cached --quiet; then
              echo "产物跟线上一样，不用提交"
              echo "published=same" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "零肉身造物：构建产物（源码 ${GITHUB_SHA::7}）"
            if git push -q origin HEAD:main; then
              echo "published=yes" >> "$GITHUB_OUTPUT"
              git log -1 --stat --format='%h %s' | head -40
              exit 0
            fi
            echo "推不上（别人先推了），第 $i 次重来"
            sleep 8
          done
          exit 1

      - name: 请 Pages 重新发一次（保险：机器人提交一般会自己触发）
        if: steps.publish.outputs.published == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "没请动也没关系，推送本身会触发"

  # 分支 zero-v3-4：只构建、在工作流机器上本地起服务、跑验收和截图。三个内核各一台机器同时跑，不碰 main，不发版。
  preview:
    if: github.ref == 'refs/heads/zero-v3-4'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装依赖、构建
        working-directory: _zero
        env:
          ZERO_BUILD: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: 本地起服务（摆成线上的样子：/zero/ 是首页；千手院 /qianshou/ 也摆上，点「千手院」落到真页面）
        run: |
          mkdir -p site/zero
          cp -r _zero/dist/* site/
          cp _zero/dist/index.html site/zero/index.html
          cp -r qianshou site/qianshou
          (cd site && nohup python3 -m http.server 4321 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:4321/zero/ && echo "本地服务起来了"

      - name: 装 Playwright（${{ matrix.engine }}）
        working-directory: _zero
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: v3.4 验收（重叠检查、名字、电脑跟线上 v3.3 比一个数不差、黑屏回归；${{ matrix.engine }}）
        working-directory: _zero
        env:
          BASE: http://127.0.0.1:4321
          BEFORE: https://qianshoulab.github.io
          ENGINE: ${{ matrix.engine }}
        run: node scripts/v34-check.mjs "${{ github.workspace }}/preview/${{ matrix.engine }}/v34" || echo "::error::v3.4 验收没过，见 v34-${{ matrix.engine }}.json"

      - name: v3.4 交货截图（四个手机竖屏 × 第二到第七幕，390×844 英文一套，Song 那一幕改前改后）
        if: matrix.engine != 'firefox'
        working-directory: _zero
        env:
          BASE: http://127.0.0.1:4321
          BEFORE: https://qianshoulab.github.io
          ENGINES: ${{ matrix.engine }}
        run: node scripts/v34-shots.mjs "${{ github.workspace }}/preview/${{ matrix.engine }}/v34图" || echo "::warning::交货截图有报错或溢出，见 shots.json"

      - name: 七幕截图（各尺寸不报错、不横向溢出、天上名字不打架）
        working-directory: _zero
        env:
          BASE: http://127.0.0.1:4321
          ENGINES: ${{ matrix.engine }}
        run: node scripts/genesis-shots.mjs "${{ github.workspace }}/preview/${{ matrix.engine }}/门" || echo "::warning::有报错或溢出，见 验收.json"

      - name: WebKit iPhone 真点（目录、天上五个名字、造物本身、第二到第六幕「进去」、后退回到天上、退路 B）
        if: matrix.engine == 'webkit'
        working-directory: _zero
        env:
          BASE: http://127.0.0.1:4321
          ENGINE: webkit
        run: node scripts/tap-test.mjs "${{ github.workspace }}/preview/webkit/真点" || echo "::warning::真点没全过，见 真点.json"

      - name: v3.3 交互验收（停手以后自己走到展示位置；这次没动，照样跑一遍；${{ matrix.engine }}）
        working-directory: _zero
        env:
          BASE: http://127.0.0.1:4321
          ENGINE: ${{ matrix.engine }}
        run: node scripts/v33-test.mjs "${{ github.workspace }}/preview/${{ matrix.engine }}/v33" || echo "::warning::v3.3 交互验收没全过，见 v33-${{ matrix.engine }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-preview-${{ matrix.engine }}
          path: preview
          if-no-files-found: ignore

  # 三台机器跑完：拼总览图，连同验收结果提交回分支（_ops/零肉身造物/v3.4截图/预览/）
  preview-commit:
    needs: preview
    if: always() && github.ref == 'refs/heads/zero-v3-4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zero-preview-*
          path: preview
          merge-multiple: true

      - name: 拼总览图
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || sudo apt-get install -y -q python3-pil
          mkdir -p sheets merged
          # 七幕：三个内核的 验收.json 并成一份再拼
          python3 - <<'PY'
          import json, os, shutil
          rows = []
          for eng in ('chromium', 'webkit', 'firefox'):
              d = f'preview/{eng}/门'
              p = os.path.join(d, '验收.json')
              if not os.path.exists(p):
                  continue
              rows += json.load(open(p, encoding='utf-8'))['rows']
              for f in os.listdir(d):
                  if f.endswith('.jpg'):
                      shutil.copy(os.path.join(d, f), 'merged/' + f)
          json.dump({'rows': rows, 'total': len(rows), 'problems': sum(1 for r in rows if r.get('errors') or r.get('overflow') or r.get('clipped') or r.get('clash'))}, open('merged/验收.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
          python3 _zero/scripts/shots-sheet.py merged sheets || true
          # v3.4 交货图：总览（四个竖屏 × 第二到第七幕）、英文一套、Song 那一幕改前改后、原图（JPG）
          for e in chromium webkit; do
            [ -f "preview/$e/v34图/shots.json" ] && python3 _zero/scripts/v34-sheet.py "preview/$e/v34图" sheets || true
          done
          ls -la sheets

      - name: 提交回分支
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          for i in 1 2 3 4 5; do
            git fetch -q origin zero-v3-4
            git reset -q --hard origin/zero-v3-4
            D="_ops/零肉身造物/v3.4截图/预览"
            mkdir -p "$D"
            rm -rf "$D"/*
            cp sheets/*.jpg "$D/" 2>/dev/null || true
            mkdir -p "$D/原图" && cp sheets/原图/*.jpg "$D/原图/" 2>/dev/null || true
            cp merged/验收.json "$D/七幕验收.json" 2>/dev/null || true
            for e in chromium webkit firefox; do
              cp preview/$e/v34/v34-$e.json "$D/" 2>/dev/null || true
              [ -f "preview/$e/v34图/shots.json" ] && cp "preview/$e/v34图/shots.json" "$D/交货-$e.json" || true
              cp preview/$e/v33/v33-$e.json "$D/" 2>/dev/null || true
              mkdir -p "$D/黑屏回归-$e" && cp preview/$e/v34/黑屏回归-*.png "$D/黑屏回归-$e/" 2>/dev/null || true
              rmdir "$D/黑屏回归-$e" 2>/dev/null || true
            done
            mkdir -p "$D/真点" && cp preview/webkit/真点/* "$D/真点/" 2>/dev/null || true
            git add -A "$D"
            if git diff --cached --quiet; then echo "截图没变"; exit 0; fi
            git commit -q -m "零肉身造物 v3.4：分支预览截图、验收结果（源码 ${GITHUB_SHA::7}）"
            if git push -q origin HEAD:zero-v3-4; then exit 0; fi
            sleep 8
          done
          exit 1

  # 发版以后对着真网址：三个内核各一台机器同时跑（老网址、v3.4 验收和交货截图、七幕截图、WebKit 真点、v3.3 交互验收）
  live:
    needs: build
    if: ${{ always() && (needs.build.outputs.published == 'yes' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 等 Pages 发到这一版（看 /zero/ 上的构建记号）
        if: github.event_name != 'workflow_dispatch'
        run: |
          for i in $(seq 1 60); do
            got=$(curl -s "https://qianshoulab.github.io/zero/?v=$RANDOM$i" | grep -o 'name="zero:build" content="[^"]*"' | sed 's/.*content="//; s/"//')
            if [ "$got" = "$GITHUB_SHA" ]; then echo "线上已经是 ${GITHUB_SHA::7}"; exit 0; fi
            echo "线上还是 ${got:-（没读到）}，等 15 秒（第 $i 次）"
            sleep 15
          done
          echo "::error::等了 15 分钟 Pages 还没发到这一版"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _zero/package-lock.json

      - name: 装 Playwright（${{ matrix.engine }}）
        working-directory: _zero
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: 线上验收（老网址全 200、根目录还是该是的那个、零肉身造物页面不报错不溢出、千手院两套皮）
        if: matrix.engine == 'chromium'
        working-directory: _zero
        env:
          SHOTS: ${{ github.workspace }}/live/chromium/线上
        run: node scripts/live-check.mjs

      - name: v3.4 验收（对着线上：重叠检查、名字、黑屏回归；线上就是这一版，不跟改前比）
        if: always()
        working-directory: _zero
        env:
          BEFORE: none
          ENGINE: ${{ matrix.engine }}
        run: node scripts/v34-check.mjs "${{ github.workspace }}/live/${{ matrix.engine }}/v34"

      - name: v3.4 交货截图（对着线上）
        if: always() && matrix.engine != 'firefox'
        working-directory: _zero
        env:
          BEFORE: none
          ENGINES: ${{ matrix.engine }}
        run: node scripts/v34-shots.mjs "${{ github.workspace }}/live/${{ matrix.engine }}/v34图" || echo "::warning::交货截图有报错或溢出，见 shots.json"

      - name: 七幕截图（对着线上）
        if: always()
        working-directory: _zero
        env:
          ENGINES: ${{ matrix.engine }}
        run: node scripts/genesis-shots.mjs "${{ github.workspace }}/live/${{ matrix.engine }}/门"

      - name: WebKit iPhone 真点（对着线上）
        if: always() && matrix.engine == 'webkit'
        working-directory: _zero
        env:
          ENGINE: webkit
        run: node scripts/tap-test.mjs "${{ github.workspace }}/live/webkit/真点"

      - name: v3.3 交互验收（对着线上；${{ matrix.engine }}）
        if: always()
        working-directory: _zero
        env:
          ENGINE: ${{ matrix.engine }}
        run: node scripts/v33-test.mjs "${{ github.workspace }}/live/${{ matrix.engine }}/v33"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-live-${{ matrix.engine }}
          path: live
          if-no-files-found: ignore

  # 手动跑、勾了 commit_shots：线上的总览图、验收结果、交货原图提交到 _ops/零肉身造物/v3.4截图/线上/
  live-commit:
    needs: live
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.commit_shots }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zero-live-*
          path: live
          merge-multiple: true

      - name: 拼总览图
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || sudo apt-get install -y -q python3-pil
          mkdir -p sheets merged
          python3 - <<'PY'
          import json, os, shutil
          rows = []
          for eng in ('chromium', 'webkit', 'firefox'):
              d = f'live/{eng}/门'
              p = os.path.join(d, '验收.json')
              if not os.path.exists(p):
                  continue
              rows += json.load(open(p, encoding='utf-8'))['rows']
              for f in os.listdir(d):
                  if f.endswith('.jpg'):
                      shutil.copy(os.path.join(d, f), 'merged/' + f)
          json.dump({'rows': rows, 'total': len(rows), 'problems': sum(1 for r in rows if r.get('errors') or r.get('overflow') or r.get('clipped') or r.get('clash'))}, open('merged/验收.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
          python3 _zero/scripts/shots-sheet.py merged sheets || true
          for e in chromium webkit; do
            [ -f "live/$e/v34图/shots.json" ] && python3 _zero/scripts/v34-sheet.py "live/$e/v34图" sheets || true
          done
          ls -la sheets

      - name: 截图提交到 _ops
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            D="_ops/零肉身造物/v3.4截图/线上"
            mkdir -p "$D/原图" "$D/真点"
            cp -f sheets/*.jpg "$D/" 2>/dev/null || true
            cp -f sheets/原图/*.jpg "$D/原图/" 2>/dev/null || true
            cp -f merged/验收.json "$D/七幕验收.json" 2>/dev/null || true
            for e in chromium webkit firefox; do
              cp -f live/$e/v34/v34-$e.json "$D/" 2>/dev/null || true
              [ -f "live/$e/v34图/shots.json" ] && cp -f "live/$e/v34图/shots.json" "$D/交货-$e.json" || true
              cp -f live/$e/v33/v33-$e.json "$D/" 2>/dev/null || true
            done
            cp -f live/webkit/真点/* "$D/真点/" 2>/dev/null || true
            git add "$D"
            if git diff --cached --quiet; then echo "截图没变"; exit 0; fi
            git commit -q -m "零肉身造物：v3.4 线上验收截图（$(date -u +%m-%d\ %H:%M) UTC）"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 8
          done
          exit 1
