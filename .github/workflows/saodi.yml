# 戒尺僧（原扫地僧，文件夹和 exe 名照旧 saodi / SaodiSeng）：在真 Windows 上跑测试 → 打 exe → exe 自检 + 界面冒烟 + 托盘冒烟 → 发到 Release
# 只在 saodi/ 变动时触发；其他罗汉的改动不会惊动它。
name: saodi-build

on:
  push:
    branches: [main]
    paths:
      - "saodi/**"
      - ".github/workflows/saodi.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saodi-build
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: saodi/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.16.0

      - name: 核心测试（真 NTFS、真回收站、隐藏属性、开机自启注册表；0.4.0 中英两套）
        run: python -m pytest -q tests/test_core.py tests/test_v02.py tests/test_v021.py tests/test_v03.py tests/test_v04.py

      - name: 打包 exe
        run: |
          $v = python -c "from saodi import VERSION; print(VERSION)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pyinstaller --noconfirm --onefile --windowed --name SaodiSeng --icon assets/icon.ico `
            --add-data "ui;ui" --add-data "assets;assets" --collect-submodules webview `
            --hidden-import pystray._win32 main.py
          Get-Item dist/SaodiSeng.exe | Select-Object Name, Length

      - name: exe 自检（1000 个文件计时、占用、超长路径、回收站、续传、标签、复制、解压、盯下载、开机自启）
        run: |
          $out = Join-Path $pwd "selftest.json"
          $p = Start-Process -FilePath dist/SaodiSeng.exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }

      - name: 界面冒烟（开窗、界面渲染、JS 能调 Python、自动关）
        run: |
          $env:SAODI_HOME = "$env:RUNNER_TEMP\saodi-ui-home"
          $env:SAODI_DOWNLOADS = "$env:RUNNER_TEMP\saodi-ui-dl"
          New-Item -ItemType Directory -Force $env:SAODI_DOWNLOADS | Out-Null
          $out = Join-Path $pwd "smoke.txt"
          $p = Start-Process -FilePath dist/SaodiSeng.exe -ArgumentList "--smoke-ui", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw "smoke timeout" }
          if (-not (Test-Path $out)) { throw "smoke: UI never became ready (exit $($p.ExitCode))" }
          Get-Content $out

      - name: 托盘冒烟（--tray 不开窗、默认盯下载（新装的英文，分进 Documents）、浏览器式下载落地就分、占位和隐藏不碰、开机自启那项、托盘菜单跟着换语言、第二次双击叫出窗口）
        run: |
          $env:SAODI_HOME = "$env:RUNNER_TEMP\saodi-tray-home"
          $env:SAODI_DOWNLOADS = "$env:RUNNER_TEMP\saodi-tray-dl"
          New-Item -ItemType Directory -Force $env:SAODI_DOWNLOADS | Out-Null
          $out = Join-Path $pwd "tray.json"
          $p = Start-Process -FilePath dist/SaodiSeng.exe -ArgumentList "--tray", "--smoke-tray", "`"$out`"" -PassThru
          for ($i = 0; $i -lt 300 -and -not (Test-Path "$out.ready") -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path "$out.ready")) {
            if (Test-Path $out) { Get-Content $out -Encoding utf8 }
            if (-not $p.HasExited) { $p.Kill() }
            throw "tray smoke never got ready (exited: $($p.HasExited))"
          }
          # 第二次双击：已经在托盘里跑着 → 叫它把窗口亮出来，自己马上退
          $p2 = Start-Process -FilePath dist/SaodiSeng.exe -PassThru
          if (-not $p2.WaitForExit(30000)) { $p2.Kill(); throw "second instance did not hand over and exit" }
          "second instance exit code: $($p2.ExitCode)"
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "tray smoke did not finish" }
          Get-Content $out -Encoding utf8
          $r = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
          Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "QianshouSaodi" -ErrorAction SilentlyContinue
          if (-not $r.ok) { throw "tray smoke failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: SaodiSeng-${{ env.VERSION }}
          path: |
            saodi/app/dist/SaodiSeng.exe
            saodi/app/selftest.json
            saodi/app/tray.json

      - name: 发到 Release（tag saodi-v版本号，不抢 latest）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "saodi-v$env:VERSION"
          $asset = "dist/SaodiSeng-$env:VERSION.exe"
          Copy-Item dist/SaodiSeng.exe $asset
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber -R $env:GITHUB_REPOSITORY
          } else {
            # Release 说明中英两套：英文在前（默认英文），中文跟着
            $notes = @"
          Jiechi · File Sweeper for Windows, from QIANSHOU LAB. Grab SaodiSeng-$env:VERSION.exe and run it, no installer. It starts with Windows and quietly sorts your Downloads folder from the tray. English by default; switch to 中文 bottom-left.

          千手院 · 戒尺僧（原扫地僧）Windows 版。下载 SaodiSeng-$env:VERSION.exe 双击就跑，不用装；开机自己在托盘里盯着「下载」。左下角 EN / 中文 一点就换。

          https://qianshoulab.github.io/saodi/
          "@
            gh release create $tag $asset -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest=false `
              --title "Jiechi · 戒尺僧 $env:VERSION" --notes $notes
          }
          $global:LASTEXITCODE = 0
