# 扫地僧：在真 Windows 上跑测试 → 打 exe → exe 自检 + 界面冒烟 → 发到 Release
# 只在 saodi/ 变动时触发；其他罗汉的改动不会惊动它。
name: saodi-build

on:
  push:
    branches: [main]
    paths:
      - "saodi/**"
      - ".github/workflows/saodi.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saodi-build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: saodi/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.16.0

      - name: 核心测试（真 NTFS、真回收站）
        run: python -m pytest -q tests/test_core.py

      - name: 打包 exe
        run: |
          $v = python -c "from saodi import VERSION; print(VERSION)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pyinstaller --noconfirm --onefile --windowed --name SaodiSeng --icon assets/icon.ico `
            --add-data "ui;ui" --collect-submodules webview main.py
          Get-Item dist/SaodiSeng.exe | Select-Object Name, Length

      - name: exe 自检（1000 个文件计时、占用、超长路径、回收站、续传）
        run: |
          $out = Join-Path $pwd "selftest.json"
          $p = Start-Process -FilePath dist/SaodiSeng.exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }

      - name: 界面冒烟（开窗、界面渲染、JS 能调 Python、自动关）
        run: |
          $out = Join-Path $pwd "smoke.txt"
          $p = Start-Process -FilePath dist/SaodiSeng.exe -ArgumentList "--smoke-ui", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw "smoke timeout" }
          if (-not (Test-Path $out)) { throw "smoke: UI never became ready (exit $($p.ExitCode))" }
          Get-Content $out

      - uses: actions/upload-artifact@v4
        with:
          name: SaodiSeng-${{ env.VERSION }}
          path: |
            saodi/app/dist/SaodiSeng.exe
            saodi/app/selftest.json

      - name: 发到 Release（tag saodi-v版本号，不抢 latest）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "saodi-v$env:VERSION"
          $asset = "dist/SaodiSeng-$env:VERSION.exe"
          Copy-Item dist/SaodiSeng.exe $asset
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber -R $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest=false `
              --title "扫地僧 $env:VERSION" --notes "千手院 · 扫地僧 Windows 版。下载 SaodiSeng-$env:VERSION.exe 双击就跑。介绍页 https://qianshoulab.github.io/saodi/"
          }
          $global:LASTEXITCODE = 0
