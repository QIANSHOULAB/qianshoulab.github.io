<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 字全在 app/ui/strings.js（i_ 开头），跟程序共用一份。这里的标题和简介只是给不跑脚本的（搜索引擎、链接预览）看的英文底子 -->
<title>Jiechi · File Sweeper</title>
<meta name="description" content="The cure for desktop clutter. Batch-download, rename, and send every file to the folder it belongs in. Free for Windows. Your files never leave your PC.">
<script src="app/ui/strings.js?v=0.4.1"></script>
<script>
/* 挑语言：?lang=zh|en（只管这一次）> 右上角选过的（localStorage saodi.lang）> 默认英文。不跟浏览器语言走（Song 11-03 22:19）。
   画页面之前就把 <html lang>、标题、简介换好，免得先闪一下英文 */
(function () {
  var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1], s = null;
  try { s = localStorage.getItem("saodi.lang"); } catch (e) {}
  LANG = q || (s === "zh" || s === "en" ? s : "en");
  document.documentElement.lang = t("html_lang");
  document.title = t("i_title");
  document.querySelector('meta[name="description"]').content = t("i_desc");
})();
</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* 令牌照 _ops/设计规范.md；主色戒尺僧橄榄 #6E9A24，按钮上白字加深到 #567A1C（5:1） */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --bg:#ffffff; --bg-group:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#6e6e73; --fg-3:#86868b;
  --line:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --accent:#567a1c; --accent-press:#4b6b18; --link:#567a1c; --on-accent:#ffffff;
  --glass:rgba(255,255,255,.98);
  --r-card:18px; --r-btn:12px; --r-field:10px; --r-chip:8px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --t:240ms;
  color-scheme:light;
}
/* 英文：西文字体排前面（Windows 上不然会用雅黑的西文字形），中文字体垫后 */
html[lang="en"]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-group:#000000; --card:#1c1c1e; --card-2:#2c2c2e;
  --fg:#f5f5f7; --fg-2:#a1a1a6; --fg-3:#8e8e93;
  --line:rgba(255,255,255,.12); --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --accent:#5b801e; --accent-press:#668f22; --link:#9ccb4e;
  --glass:rgba(0,0,0,.98); --shadow:none;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.tn{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

nav{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;height:48px;gap:12px}
nav .back{font-size:15px;color:var(--fg-2);display:flex;align-items:center;gap:4px;min-height:44px}
nav .back:hover{color:var(--link);text-decoration:none}
nav .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}
nav .me img{width:24px;height:24px}
nav .dl{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600}
nav .dl:hover{background:var(--accent-press);text-decoration:none}
/* 右上角 EN / 中文 */
.lang{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-chip);background:var(--fill);flex:none}
.lang button{position:relative;min-width:36px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;font:600 12px/1 var(--font);color:var(--fg-2);cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.lang button::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
@media (prefers-color-scheme:dark){.lang button[aria-pressed="true"]{background:#636366;box-shadow:none}}
html[lang="en"] .tag{letter-spacing:-.01em}

.hero{text-align:center;padding:64px 0 32px}
.hero .icon{width:96px;height:96px;margin:0 auto 24px;display:block;filter:drop-shadow(0 8px 24px rgba(86,122,28,.28))}
h1{font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
.tag{font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.2;margin:12px 0 0}
.lede{color:var(--fg-2);margin:16px auto 0;max-width:560px}
/* 中文只在标点、空格处换行，词不拆开 */
h1,.tag,.lede{word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.cta{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;transition:background var(--t) var(--ease)}
.btn:hover{background:var(--accent-press);text-decoration:none}
.btn svg{width:20px;height:20px}
.meta{font-size:13px;color:var(--fg-3)}

.shot{margin:48px auto 0;max-width:980px}
.shot img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 24px 64px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.shot img{box-shadow:0 0 0 1px var(--line)}}

.sec{padding:96px 0 0}
.sec h2{font-size:clamp(28px,4vw,34px);font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0;text-align:center}
.sec .sub{color:var(--fg-2);text-align:center;margin:8px auto 0;max-width:560px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 32px;margin-top:48px}
.f svg{width:28px;height:28px;color:var(--link);display:block;margin-bottom:12px}
.f h3{margin:0 0 4px;font-size:17px;font-weight:600}
.f p{margin:0;color:var(--fg-2);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.n{background:var(--bg-group);border-radius:var(--r-card);padding:24px}
@media (prefers-color-scheme:dark){.n{background:var(--card)}}
.n b{display:block;font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.n span{display:block;font-size:15px;color:var(--fg-2);margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:48px}
.s b{display:block;font-size:13px;color:var(--fg-3);font-weight:600}
.s h3{margin:4px 0;font-size:17px;font-weight:600}
.s p{margin:0;color:var(--fg-2);font-size:15px}
.s code{font-family:inherit;background:var(--fill);border-radius:var(--r-chip);padding:0 8px;color:var(--fg);font-size:15px;white-space:nowrap}

footer{border-top:1px solid var(--line);margin-top:96px;padding:24px 0 calc(32px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--fg-3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px}
footer .mail{color:var(--fg-2);user-select:all;-webkit-user-select:all}
/* 提意见：点的地方够 44 高，排版上不撑开这一行 */
footer a.fb{display:inline-block;padding:13px 8px;margin:-13px -4px;color:var(--link);font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
@media (hover:hover){footer a.fb:hover{text-decoration:underline}}
footer a.fb:focus-visible{outline:2px solid var(--link);outline-offset:-8px;border-radius:var(--r-chip)}

@media (max-width:760px){
  body{font-size:17px}
  .hero{padding:48px 0 16px}
  .hero .icon{width:80px;height:80px}
  .shot{margin-top:32px}
  .sec{padding-top:64px}
  .feats,.nums,.steps{grid-template-columns:1fr;gap:32px}
  .nums{gap:12px}
  nav .me span{display:none}
  nav .wrap{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="back" href="https://qianshoulab.github.io/"><svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1.5 1.5 7.5l6 6"/></svg><span data-t="i_home"></span></a>

      <div class="f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>

      <div class="f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>

        <h3 data-t="i_f6"></h3><p data-t="i_f6_p"></p></div>

<script>
/* 字从 app/ui/strings.js 拿；右上角 EN / 中文 一点就换，记在 localStorage；
   下载链接跟着 version.json 走：以后出新版只改 version.json 不用改页面 */
(function () {
  var V = "0.4.0";
  var $ = function (s) { return document.querySelector(s); };
  var exe = function () { return "SaodiSeng-" + V + ".exe"; };
  var url = function () { return "https://github.com/QIANSHOULAB/qianshoulab.github.io/releases/download/saodi-v" + V + "/" + exe(); };
  /* 提意见：mailto 打开用户自己的邮件程序，标题、正文填好（字跟程序里同一套 fb_*）；不接表单，不收数据。
     正文最后一行「版本 · 系统 · 浏览器」简写，比如 0.4.1 · Windows 11 · Edge 130 */
  var UA = navigator.userAgent || "";
  function deviceTag() {
    var os = "other", br = "other", m;
    if ((m = /Windows NT (\d+\.\d+)/.exec(UA))) os = m[1] === "10.0" ? "Windows" : "Windows " + ({ "6.3": "8.1", "6.2": "8", "6.1": "7" }[m[1]] || m[1]);
    else if ((m = /(?:iPhone|CPU) OS (\d+)_/.exec(UA))) os = (/iPad/.test(UA) ? "iPadOS " : "iOS ") + m[1];
    else if (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1) os = "iPadOS";
    else if ((m = /Android (\d+)/.exec(UA))) os = "Android " + m[1];
    else if (/Mac OS X/.test(UA)) os = "macOS";
    else if (/CrOS/.test(UA)) os = "ChromeOS";
    else if (/Linux/.test(UA)) os = "Linux";
    if ((m = /MicroMessenger\/(\d+)/.exec(UA))) br = "WeChat " + m[1];
    else if ((m = /Edg(?:A|iOS)?\/(\d+)/.exec(UA))) br = "Edge " + m[1];
    else if ((m = /OPR\/(\d+)/.exec(UA))) br = "Opera " + m[1];
    else if ((m = /(?:Firefox|FxiOS)\/(\d+)/.exec(UA))) br = "Firefox " + m[1];
    else if ((m = /(?:Chrome|CriOS)\/(\d+)/.exec(UA))) br = "Chrome " + m[1];
    else if ((m = /Version\/(\d+).*Safari/.exec(UA))) br = "Safari " + m[1];
    else if (/Safari/.test(UA)) br = "Safari";
    return os + " · " + br;
  }
  var DEVICE = deviceTag(), FB_TO = ["oilsongchengmin", "gmail.com"].join("@");
  var fbHref = function () {
    return "mailto:" + FB_TO + "?subject=" + encodeURIComponent(t("fb_subject", { v: V }))
      + "&body=" + encodeURIComponent([t("fb_q1"), t("fb_q2"), t("fb_q3")].join("\n\n") + "\n\n\n——\n" + V + " · " + DEVICE);
  };
  var fbFill = function () { document.querySelectorAll("a.fb").forEach(function (a) { a.href = fbHref(); }); };
  // Chromium 的 UA 里 Windows 10 / 11、macOS、Android 的版本是冻住的，问得到真版本就换上（问不到就用上面的简写）
  try {
    var ud = navigator.userAgentData;
    if (ud && /^(Windows|macOS|Android)$/.test(ud.platform) && ud.getHighEntropyValues) ud.getHighEntropyValues(["platformVersion"]).then(function (v) {
      var pv = String(v.platformVersion || "").split(/[._]/), maj = parseInt(pv[0], 10);
      if (!(maj > 0) || DEVICE.indexOf(ud.platform) !== 0) return;
      // Windows：platformVersion 13 起是 11，1–10 是 10；macOS 10.x 带上小版本，11 起只写大版本
      var os = ud.platform === "Windows" ? (maj >= 13 ? "Windows 11" : "Windows 10") : ud.platform + " " + (ud.platform === "macOS" && maj === 10 && pv[1] ? "10." + pv[1] : maj);
      DEVICE = DEVICE.replace(/^(Windows|macOS|Android)( \d+)?/, os);
      fbFill();
    }).catch(function () {});
  } catch (e) {}
  function draw() {
    document.documentElement.lang = t("html_lang");
    document.title = t("i_title");
    document.querySelector('meta[name="description"]').content = t("i_desc");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.dataset.t); });
    document.querySelectorAll("[data-h]").forEach(function (el) { el.innerHTML = t(el.dataset.h); });
    $("#st1").innerHTML = t("i_st1_p", { exe: '<code id="exeName"></code>' });
    $("#exeName").textContent = exe();
    $("#meta").textContent = t("i_meta", { v: V });
    $("#dlBtn").href = $("#dlTop").href = url();
    fbFill();
    var dir = LANG === "en" ? "img/en/" : "img/";
    $("#shot").src = dir + "app-light.webp"; $("#shotDark").srcset = dir + "app-dark.webp"; $("#shot").alt = t("i_alt");
    var ls = $("#lang");
    ls.setAttribute("aria-label", t("lang_label"));
    ls.innerHTML = [["en", "EN", "en"], ["zh", "中文", "zh-CN"]].map(function (x) {
      return '<button type="button" data-l="' + x[0] + '" lang="' + x[2] + '" aria-pressed="' + (x[0] === LANG) + '">' + x[1] + "</button>";
    }).join("");
  }
  $("#lang").addEventListener("click", function (e) {
    var b = e.target.closest("[data-l]");
    if (!b || b.dataset.l === LANG) return;
    LANG = b.dataset.l;
    try { localStorage.setItem("saodi.lang", LANG); } catch (err) {}
    draw();
  });
  draw();
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (v) {
    if (v.version && v.version !== V) { V = v.version; draw(); }
  }).catch(function () {});
})();
</script>
